<!DOCTYPE html>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f14'/%3E%3Crect x='7' y='14' width='8' height='13' fill='%236fcf6f'/%3E%3Cpolygon points='6,14 11,9 16,14' fill='%238a3b2b'/%3E%3Crect x='17' y='8' width='8' height='19' fill='%235ab0ff'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; touch-action: none; }

  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start;
         padding: 10px 16px; background: linear-gradient(to bottom, rgba(10,14,20,.92), rgba(10,14,20,0));
         color: #eaf2ff; z-index: 10; pointer-events: none; }
  #hud .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  #hud .stat { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: rgba(20,28,40,.7);
               border: 1px solid rgba(120,170,255,.25); border-radius: 12px; padding: 8px 14px; font-weight: 600;
               font-size: 15px; backdrop-filter: blur(6px); }
  #money { color: #8be28b; }
  #income { color: #ffd479; font-size: 13px; font-weight: 500; }
  #progress { color: #9fd0ff; font-size: 13px; font-weight: 500; }

  #topRightBtns { display: flex; gap: 8px; pointer-events: auto; }
  .iconBtn { cursor: pointer; background: rgba(20,28,40,.75); color: #fff; border: 1px solid rgba(120,170,255,.3);
             border-radius: 10px; padding: 8px 10px; font-size: 15px; line-height: 1; backdrop-filter: blur(6px); }
  .iconBtn.danger { background: rgba(140,50,50,.7); border-color: rgba(255,120,120,.3); }
  .iconBtn.hasBadge { position: relative; }
  .iconBtn .badge { position: absolute; top: -6px; right: -6px; background: #ff5d5d; color: #fff; font-size: 10px;
                     font-weight: 700; border-radius: 8px; padding: 1px 5px; display: none; }
  .iconBtn .badge.show { display: block; }

  #nextCard { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); z-index: 9; pointer-events: none;
              background: rgba(20,28,40,.75); border: 1px solid rgba(255,212,121,.35); border-radius: 12px;
              padding: 7px 14px; color: #ffe6a8; font-size: 13px; font-weight: 600; backdrop-filter: blur(6px);
              text-align: center; max-width: 90vw; }

  #prestigeBtn { position: fixed; top: 96px; left: 50%; transform: translateX(-50%); z-index: 9; cursor: pointer;
                 border: none; border-radius: 12px; padding: 9px 18px; font-weight: 700; font-size: 13px;
                 background: linear-gradient(135deg,#ffd479,#ff9d4d); color: #2a1a00;
                 box-shadow: 0 0 18px rgba(255,180,80,.5); }

  #compass { position: fixed; z-index: 12; pointer-events: none; display: none; }
  #compass .arrow { width: 0; height: 0; border-left: 13px solid transparent; border-right: 13px solid transparent;
                     border-bottom: 24px solid #ffd479; filter: drop-shadow(0 0 5px rgba(255,212,121,.85)); }

  #staminaWrap { position: fixed; left: 26px; bottom: 152px; width: 118px; height: 9px; border-radius: 5px;
                 background: rgba(20,28,40,.55); border: 1px solid rgba(120,170,255,.25); z-index: 15;
                 overflow: hidden; opacity: 0; transition: opacity .25s; }
  #staminaFill { height: 100%; width: 100%; background: linear-gradient(90deg,#ffd479,#ff9d4d); transition: width .1s linear; }

  #toast { position: fixed; top: 106px; left: 50%; transform: translateX(-50%); z-index: 30; color: #fff;
           background: rgba(20,28,40,.92); border: 1px solid rgba(120,170,255,.3); padding: 8px 16px; border-radius: 10px;
           font-size: 13px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; text-align: center;
           max-width: 80vw; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }

  /* Achievements panel */
  #achOverlay { position: fixed; inset: 0; background: rgba(5,8,12,.6); z-index: 40; display: none;
                align-items: center; justify-content: center; padding: 20px; }
  #achOverlay.show { display: flex; }
  #achPanel { width: min(420px, 100%); max-height: 78vh; overflow-y: auto; background: rgba(16,22,32,.97);
              border: 1px solid rgba(120,170,255,.3); border-radius: 16px; padding: 16px; color: #eaf2ff; }
  #achPanel h2 { margin: 0 0 12px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
  #achPanel h2 .close { cursor: pointer; font-size: 18px; opacity: .7; }
  .achItem { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 12px; margin-bottom: 8px;
             background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); }
  .achItem.unlocked { background: rgba(90,180,110,.12); border-color: rgba(90,180,110,.3); }
  .achItem .ico { font-size: 22px; filter: grayscale(1); opacity: .5; }
  .achItem.unlocked .ico { filter: none; opacity: 1; }
  .achItem .body { flex: 1; }
  .achItem .name { font-weight: 700; font-size: 13px; }
  .achItem .desc { font-size: 12px; color: #9fb0c4; margin-top: 2px; }
  .achItem .reward { font-size: 11px; color: #ffd479; margin-top: 3px; }

  /* Onboarding hint */
  #hintOverlay { position: fixed; inset: 0; background: rgba(5,8,12,.7); z-index: 50; display: none;
                 align-items: center; justify-content: center; padding: 20px; }
  #hintOverlay.show { display: flex; }
  #hintCard { width: min(360px, 100%); background: rgba(16,22,32,.97); border: 1px solid rgba(120,170,255,.35);
              border-radius: 18px; padding: 20px; color: #eaf2ff; text-align: center; }
  #hintCard .emoji { font-size: 40px; margin-bottom: 8px; }
  #hintCard h2 { margin: 0 0 10px; font-size: 18px; }
  #hintCard ul { text-align: left; font-size: 13px; color: #c3d0e2; line-height: 1.7; margin: 0 0 16px; padding-left: 20px; }
  #hintCard button { width: 100%; cursor: pointer; border: none; border-radius: 12px; padding: 12px; font-weight: 700;
                      font-size: 14px; background: linear-gradient(135deg,#3fae5c,#2c8c47); color: #fff; }

  /* Mobile joystick */
  #joyBase { position: fixed; left: 26px; bottom: 26px; width: 118px; height: 118px; border-radius: 50%;
             background: rgba(20,28,40,.55); border: 1px solid rgba(120,170,255,.3); z-index: 15; touch-action: none;
             display: none; }
  #joyBase.active-input { display: block; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%;
             background: rgba(120,170,255,.55); border: 1px solid rgba(200,225,255,.6); transform: translate(-50%, -50%); }

  @media (max-width: 420px) {
    #hud .stat { font-size: 13px; padding: 7px 10px; }
    #nextCard { font-size: 12px; }
  }
  @media (pointer: coarse) {
    #joyBase { display: block; }
  }

/* ---------------------------------------------------------------------- */

const GROUND_HALF = 70;
const PLAYER_SPEED = 7.2;       // units / sec
const SPRINT_MULT = 1.7;
const STAMINA_MAX = 100;
const STAMINA_DRAIN = 40;       // per second while sprinting
const STAMINA_REGEN = 18;       // per second while not sprinting
const PLAYER_EYE_HEIGHT = 1.5;

const PLAYER_RADIUS = 0.4;
const BUILDING_RADIUS = 1.5;      // collision footprint of a constructed building
const BUILDING_OFFSET = 2.7;      // building sits this far past its pad, so it never overlaps the player standing on the pad
const UPGRADE_PAD_OFFSET = 2.15;  // an upgrade pad sits this far to the side of its building

// Spiral layout: each stage sits further from spawn, so the base visibly grows outward.

    check: s => s.planksEarned >= 50 },

function achName(a) { return lang === 'ru' ? a.name : a.nameEn; }
function achDesc(a) { return lang === 'ru' ? a.desc : a.descEn; }

/* ---------------------------------------------------------------------- */
/*  I18N — minimal data-driven ru/en strings table                         */
/* ---------------------------------------------------------------------- */
const LANG_KEY = 'tycoon3d_lang';
let lang = localStorage.getItem(LANG_KEY) || (navigator.language?.startsWith('ru') ? 'ru' : 'en');

const STRINGS = {
  ru: {
    reset: 'Сброс',
    hint_title: 'Добро пожаловать в Tycoon 3D!',
    hint_button: 'Понятно, начнём!',

      '<b>Синяя площадка</b> у здания — прокачивает его до 3 уровней и повышает доход. Сами здания теперь твёрдые — сквозь них не пройти',
      'Следите за достижениями 🏆 — за них дают деньги. Построите весь тайкон — откроется <b>престиж</b> ✨',
    ],
    ach_title: 'Достижения',
    ach_unlocked: 'Получено',
    ach_reward: 'Награда',
    reset_confirm: 'Сбросить весь прогресс?',
    prestige_confirm: 'Начать тайкон заново? Все здания и деньги обнулятся, но доход навсегда умножится на x{mult}.',
    prestige_btn: '✨ Престиж — доход x{mult}',
    next_building: 'Далее: {emoji} {name} — {cost} 💰 (добегите до площадки)',
    next_complete: '🎉 Тайкон полностью построен!',
    next_prestige_suffix: ' (престижей: {n})',
    toast_built: 'Построено: {emoji} {name}!',
    toast_upgraded: 'Улучшено: {name} → ур. {level}',
    toast_prestige: '✨ Престиж! Доход теперь x{mult}',
    toast_achievement: '🏆 Достижение: {name} (+{reward} 💰)',
    toast_need_more: 'Нужно ещё {amount} 💰',
    toast_need_more_upgrade: 'Нужно ещё {amount} 💰 на улучшение',
    upgrade_level_line: '⬆️ Ур. {level}',
    doc_title: 'Tycoon 3D — Строительный тайкон',
  },
  en: {
    reset: 'Reset',
    hint_title: 'Welcome to Tycoon 3D!',
    hint_button: "Got it, let's go!",
    hint_bullets: [
      "<b>WASD / arrow keys</b> to run (joystick bottom-left on phone)",

      'Watch for achievements 🏆 — they pay out cash. Build the whole tycoon and <b>prestige</b> ✨ unlocks',
    ],
    ach_title: 'Achievements',
    ach_unlocked: 'Unlocked',
    ach_reward: 'Reward',
    reset_confirm: 'Reset all progress?',
    prestige_confirm: 'Start the tycoon over? All buildings and money reset, but income permanently multiplies by x{mult}.',
    prestige_btn: '✨ Prestige — income x{mult}',
    next_building: 'Next: {emoji} {name} — {cost} 💰 (run to the pad)',
    next_complete: '🎉 Tycoon fully built!',
    next_prestige_suffix: ' (prestiges: {n})',
    toast_built: 'Built: {emoji} {name}!',
    toast_upgraded: 'Upgraded: {name} → lv. {level}',
    toast_prestige: '✨ Prestige! Income is now x{mult}',
    toast_achievement: '🏆 Achievement: {name} (+{reward} 💰)',
    toast_need_more: 'Need {amount} 💰 more',
    toast_need_more_upgrade: 'Need {amount} 💰 more to upgrade',

function t(key, vars) {
  let str = STRINGS[lang][key] ?? STRINGS.ru[key] ?? key;
  if (vars) for (const k in vars) str = str.replaceAll(`{${k}}`, vars[k]);
  return str;
}

/* ---------------------------------------------------------------------- */
/*  STATE                                                                  */
/* ---------------------------------------------------------------------- */
let money = 300;
let displayedMoney = money; // eased toward `money` each frame for a count-up feel
let stageIndex = 0; // number of stages already built
let stamina = STAMINA_MAX;
let planks = 0; // secondary resource produced by the sawmill (see SAWMILL below)
const stats = { totalEarned: 0, distanceRun: 0, prestige: 0, maxLevelHit: false, planksEarned: 0 };
const unlockedAch = new Set();
let currentPad = null; // { index, group, pos: THREE.Vector3 }
const growingMeshes = []; // pop-in scale animation queue
const buildings = []; // { index, level, mesh, pos: THREE.Vector3, upgradePad: {...} | null }

function earn(amount) {
  money += amount;
  if (amount > 0) stats.totalEarned += amount;
}

function incomeMultiplier() {
  return 1 + stats.prestige * 0.5;
}

function fmt(n) {
  n = Math.floor(n);
  if (n >= 1000000) return (n / 1000000).toFixed(2).replace(/\.?0+$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return n.toLocaleString('ru-RU');
}

function stagePosition(i) {
  const angle = i * SPIRAL_ANGLE_STEP;
  const radius = SPIRAL_BASE_RADIUS + i * SPIRAL_RADIUS_STEP;
  return new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
}

// The building itself sits a bit further out than its pad, so it never appears exactly where
// the player was standing (and never overlaps the player once it becomes solid).
function buildingPosition(i) {
  const pad = stagePosition(i);
  const dir = pad.clone().normalize();
  return pad.addScaledVector(dir, BUILDING_OFFSET);
}

// An upgrade pad sits to the side of its building, clear of both the building's own
// footprint and the main path.
function upgradePadPosition(buildingPos, i) {
  const dir = stagePosition(i).normalize();
  const tangent = new THREE.Vector3(-dir.z, 0, dir.x);
  return buildingPos.clone().addScaledVector(tangent, UPGRADE_PAD_OFFSET);
}

function buildingIncome(stageIdx, level) {
  return STAGES[stageIdx].incomeAdd * level;
}

function buildingUpgradeCost(stageIdx, level) {
  // cost to go from `level` to `level + 1`
  return Math.round(STAGES[stageIdx].cost * 0.55 * level);
}

/* ---------------------------------------------------------------------- */
/*  SOUND (synthesized, no external assets)                                */
/* ---------------------------------------------------------------------- */
let audioCtx = null;
let muted = localStorage.getItem(MUTE_KEY) === '1';

function ensureAudio() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) audioCtx = new Ctx();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep(freq, start, duration, type = 'sine', gain = 0.12) {
  const ctx = ensureAudio();
  if (!ctx || muted) return;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.value = 0;
  osc.connect(g).connect(ctx.destination);
  const t0 = ctx.currentTime + start;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

(function scatterScenery() {
  const stagePositions = STAGES.map((_, i) => stagePosition(i));
  const MIN_CLEAR = 3.6;
  let placed = 0, attempts = 0;
  while (placed < 60 && attempts < 500) {
    attempts++;
    const x = (Math.random() - 0.5) * GROUND_HALF * 1.9;
    const z = (Math.random() - 0.5) * GROUND_HALF * 1.9;
    if (Math.hypot(x, z) < 5) continue; // keep the spawn area clear
    let tooClose = false;
    for (const p of stagePositions) {
      if (Math.hypot(x - p.x, z - p.z) < MIN_CLEAR) { tooClose = true; break; }
    }
    if (tooClose) continue;
    const deco = Math.random() < 0.6 ? makeTree() : makeRock();
    deco.position.set(x, 0, z);
    const scale = 0.8 + Math.random() * 0.6;
    deco.scale.set(scale, scale, scale);
    deco.rotation.y = Math.random() * Math.PI * 2;
    scene.add(deco);
    placed++;
  }
})();

const WOOD_SPAWN_INTERVAL = 4;   // seconds between logs leaving the generator
const WOOD_TRAVEL_TIME = 3.5;    // seconds for a log to ride the belt

// Picked to sit well clear of every spiral stage (nearest is >9 units away) at any prestige.

  // Conveyor belt: a flat dark strip with side rails running between generator and mill.
  const beltDir = new THREE.Vector3().subVectors(SAWMILL_POS, GENERATOR_POS);

  const log = new THREE.Mesh(

function updateSawmill(dt) {
  if (sawmillBlade) sawmillBlade.rotation.y += dt * 12;

  woodSpawnTimer += dt;
  if (woodSpawnTimer >= WOOD_SPAWN_INTERVAL) {
    woodSpawnTimer = 0;
    spawnLog();
  }

  for (let i = logsInTransit.length - 1; i >= 0; i--) {
    const log = logsInTransit[i];
    log.t += dt / WOOD_TRAVEL_TIME;
    if (log.t >= 1) {
      scene.remove(log.mesh);
      logsInTransit.splice(i, 1);
      planks += PLANKS_PER_LOG;
      stats.planksEarned += PLANKS_PER_LOG;
      spawnBurst(SAWMILL_POS, 0xc9a06a);
      sfx.plank();
      updateHUD();
      checkAchievements();
      save();
    } else {
      log.mesh.position.lerpVectors(GENERATOR_POS, SAWMILL_POS, log.t);
      log.mesh.position.y = 0.3;
      log.mesh.rotation.x += dt * 3;
    }
  }
}

function createBuildingMesh(stage, level = 1) {
  const group = new THREE.Group();
  const baseSize = 2.6;
  const buildingHeight = stage.height * (1 + (level - 1) * 0.28);
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(baseSize, buildingHeight, baseSize),
    new THREE.MeshStandardMaterial({ color: stage.color, roughness: 0.7, metalness: 0.05 })
  );
  body.position.y = buildingHeight / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(baseSize * 0.75, buildingHeight * 0.3, 4),
    new THREE.MeshStandardMaterial({ color: 0x8a3b2b, roughness: 0.8 })
  );
  roof.rotation.y = Math.PI / 4;
  roof.position.y = buildingHeight + (buildingHeight * 0.3) / 2;
  roof.castShadow = true;
  group.add(roof);

  // Small glowing pips on a corner mark the upgrade level at a glance.
  for (let i = 0; i < level; i++) {
    const pip = new THREE.Mesh(
      new THREE.BoxGeometry(0.32, 0.22, 0.32),
      new THREE.MeshStandardMaterial({ color: 0xffe08a, emissive: 0x664400, emissiveIntensity: 0.5 })
    );
    pip.position.set(baseSize / 2 - 0.25, buildingHeight + 0.2 + i * 0.3, baseSize / 2 - 0.25);
    group.add(pip);
  }

  return group;
}

function spawnBuilding(index, level, { grow = true } = {}) {
  const stage = STAGES[index];
  const mesh = createBuildingMesh(stage, level);
  const pos = buildingPosition(index);
  mesh.position.set(pos.x, 0, pos.z);
  if (grow) {
    mesh.scale.set(0.001, 0.001, 0.001);
    growingMeshes.push(mesh);
  }
  scene.add(mesh);

  const entry = { index, level, mesh, pos, upgradePad: null };
  buildings.push(entry);
  if (level < MAX_BUILDING_LEVEL) spawnUpgradePad(entry);
  return entry;
}

function spawnUpgradePad(entry) {
  const stage = STAGES[entry.index];
  const pos = upgradePadPosition(entry.pos, entry.index);
  const group = new THREE.Group();

  const disc = new THREE.Mesh(
    new THREE.CylinderGeometry(0.85, 0.85, 0.13, 24),
    new THREE.MeshStandardMaterial({ color: 0x5ab0ff, emissive: 0x0a2a4a, emissiveIntensity: 0.6, roughness: 0.4 })

  const sprite = makeLabelSprite([
    t('upgrade_level_line', { level: entry.level + 1 }),

  ]);

}

function removeUpgradePad(entry) {
  if (!entry.upgradePad) return;
  scene.remove(entry.upgradePad.group);

function upgradeBuilding(entry) {
  const cost = buildingUpgradeCost(entry.index, entry.level);
  money -= cost;
  removeUpgradePad(entry);
  scene.remove(entry.mesh);
  entry.level += 1;
  entry.mesh = createBuildingMesh(STAGES[entry.index], entry.level);
  entry.mesh.position.set(entry.pos.x, 0, entry.pos.z);
  entry.mesh.scale.set(0.001, 0.001, 0.001);
  growingMeshes.push(entry.mesh);
  scene.add(entry.mesh);

/*  PARTICLE BURST — purchase "juice"                                      */
/* ---------------------------------------------------------------------- */
const particleBursts = [];
function spawnBurst(pos, color) {
  const count = 36;
  const positions = new Float32Array(count * 3);
  const velocities = [];
  for (let i = 0; i < count; i++) {
    positions[i * 3] = pos.x;
    positions[i * 3 + 1] = pos.y + 1;
    positions[i * 3 + 2] = pos.z;
    const a = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 4;
    velocities.push(new THREE.Vector3(Math.cos(a) * speed, 3 + Math.random() * 3, Math.sin(a) * speed));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color, size: 0.35, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const points = new THREE.Points(geo, mat);
  scene.add(points);
  particleBursts.push({ points, velocities, life: 0.9, maxLife: 0.9 });
}

function makeLabelSprite(lines) {
  const canvas = document.createElement('canvas');
  canvas.width = 320;
  canvas.height = 150;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(16,22,32,0.88)';
  ctx.beginPath();
  ctx.roundRect(4, 4, canvas.width - 8, canvas.height - 8, 22);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,212,121,0.7)';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#eaf2ff';
  ctx.font = '700 46px sans-serif';
  ctx.fillText(lines[0], canvas.width / 2, 66);
  ctx.fillStyle = '#ffd479';
  ctx.font = '700 40px sans-serif';
  ctx.fillText(lines[1], canvas.width / 2, 120);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const material = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(3.4, 1.6, 1);
  sprite.renderOrder = 10;
  return sprite;
}

function doPrestige() {
  if (stageIndex < STAGES.length) return;
  const nextMult = 1 + (stats.prestige + 1) * 0.5;
  if (!confirm(t('prestige_confirm', { mult: nextMult.toFixed(1) }))) return;
  stats.prestige += 1;
  buildings.forEach(b => {
    scene.remove(b.mesh);
    removeUpgradePad(b);
  });
  buildings.length = 0;
  stageIndex = 0;
  money = 300;
  displayedMoney = money;
  spawnPad(0);
  sfx.prestige();
  toast(t('toast_prestige', { mult: incomeMultiplier().toFixed(1) }));
  updateHUD();
  checkAchievements();
  save();
}
document.getElementById('prestigeBtn').addEventListener('click', doPrestige);

/* ---------------------------------------------------------------------- */
/*  ECONOMY                                                                 */
/* ---------------------------------------------------------------------- */
function totalIncomePerSec() {
  let sum = 0;
  for (const b of buildings) sum += buildingIncome(b.index, b.level);
  return sum * incomeMultiplier();
}

function updateHUD() {
  document.getElementById('income').textContent =
    `+${fmt(totalIncomePerSec())}/с${stats.prestige > 0 ? ` (x${incomeMultiplier().toFixed(1)})` : ''}`;
  document.getElementById('progress').textContent = `🏗️ ${stageIndex}/${STAGES.length}`;
  document.getElementById('planks').textContent = `🪵 ${fmt(planks)}`;

  const nextCard = document.getElementById('nextCard');
  const prestigeBtn = document.getElementById('prestigeBtn');
  if (stageIndex < STAGES.length) {
    const s = STAGES[stageIndex];
    nextCard.textContent = t('next_building', { emoji: s.emoji, name: stageName(s), cost: fmt(s.cost) });
    prestigeBtn.hidden = true;
  } else {
    nextCard.textContent = t('next_complete') +
      (stats.prestige > 0 ? t('next_prestige_suffix', { n: stats.prestige }) : '');
    prestigeBtn.hidden = false;
    prestigeBtn.textContent = t('prestige_btn', { mult: (1 + (stats.prestige + 1) * 0.5).toFixed(1) });
  }
}

setInterval(() => {
  earn(totalIncomePerSec());
  updateHUD();
  checkAchievements();
  save();
}, 1000);

/* ---------------------------------------------------------------------- */
/*  ACHIEVEMENTS                                                           */
/* ---------------------------------------------------------------------- */
const achListEl = document.getElementById('achList');
const achBadge = document.getElementById('achBadge');

function renderAchList() {
  achListEl.innerHTML = '';
  ACHIEVEMENTS.forEach(a => {
    const unlocked = unlockedAch.has(a.id);
    const item = document.createElement('div');
    item.className = 'achItem' + (unlocked ? ' unlocked' : '');
    item.innerHTML = `
      <div class="ico">${a.emoji}</div>
      <div class="body">
        <div class="name">${achName(a)}</div>
        <div class="desc">${achDesc(a)}</div>
        <div class="reward">${unlocked ? t('ach_unlocked') : t('ach_reward')}: +${a.reward} 💰</div>
      </div>`;
    achListEl.appendChild(item);
  });
}

function updateAchBadge() {
  const lockedCount = ACHIEVEMENTS.length - unlockedAch.size;
  achBadge.textContent = lockedCount;
  achBadge.classList.toggle('show', lockedCount > 0);
}

function checkAchievements() {
  const income = totalIncomePerSec();
  let unlockedAny = false;
  ACHIEVEMENTS.forEach(a => {
    if (unlockedAch.has(a.id)) return;
    if (a.check(stats, stageIndex, income)) {
      unlockedAch.add(a.id);
      earn(a.reward);
      toast(t('toast_achievement', { name: achName(a), reward: a.reward }));
      sfx.achievement();
      unlockedAny = true;
    }
  });
  if (unlockedAny) {
    updateHUD();
    updateAchBadge();
    renderAchList();
    save();
  }
}

document.getElementById('achBtn').addEventListener('click', () => {
  renderAchList();
  document.getElementById('achOverlay').classList.add('show');
});
document.getElementById('achClose').addEventListener('click', () => {
  document.getElementById('achOverlay').classList.remove('show');
});
document.getElementById('achOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'achOverlay') e.currentTarget.classList.remove('show');
});

/* ---------------------------------------------------------------------- */
/*  UI — buttons, toast, hint                                              */
/* ---------------------------------------------------------------------- */
document.getElementById('resetBtn').addEventListener('click', () => {

  location.reload();
});

document.getElementById('camBtn').addEventListener('click', () => {

/* ---------------------------------------------------------------------- */
/*  LANGUAGE SWITCHING — applies `lang` to all DOM text and any already-   */
/*  rendered canvas sprite labels (pad/upgrade-pad price tags).            */
/* ---------------------------------------------------------------------- */
function regenerateSprite(oldSprite, lines, scaleY) {
  oldSprite.material.map.dispose();
  oldSprite.material.dispose();
  const sprite = makeLabelSprite(lines);
  sprite.position.y = oldSprite.position.y;
  if (scaleY) sprite.scale.set(2.4, scaleY, 1);
  return sprite;
}

function applyLanguage() {
  document.title = t('doc_title');
  document.documentElement.lang = lang;
  document.getElementById('resetBtn').textContent = t('reset');
  document.getElementById('langBtn').textContent = lang === 'ru' ? 'EN' : 'RU';
  document.getElementById('hintTitle').textContent = t('hint_title');
  document.getElementById('hintBullets').innerHTML =
    (STRINGS[lang].hint_bullets || STRINGS.ru.hint_bullets).map(b => `<li>${b}</li>`).join('');
  document.getElementById('hintCloseBtn').textContent = t('hint_button');
  document.getElementById('achTitleText').textContent = t('ach_title');

  if (currentPad) {
    const stage = STAGES[currentPad.index];
    const sprite = regenerateSprite(currentPad.sprite, [`${stage.emoji} ${stageName(stage)}`, `${fmt(stage.cost)} 💰`]);
    currentPad.group.remove(currentPad.sprite);
    currentPad.group.add(sprite);
    currentPad.sprite = sprite;
  }
  for (const b of buildings) {
    if (!b.upgradePad) continue;
    const sprite = regenerateSprite(b.upgradePad.sprite, [
      t('upgrade_level_line', { level: b.level + 1 }),
      `${fmt(buildingUpgradeCost(b.index, b.level))} 💰`,
    ], 1.15);
    b.upgradePad.group.remove(b.upgradePad.sprite);
    b.upgradePad.group.add(sprite);
    b.upgradePad.sprite = sprite;
  }

  renderAchList();
  updateHUD();
}

document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'ru' ? 'en' : 'ru';
  localStorage.setItem(LANG_KEY, lang);
  applyLanguage();
});

let toastTimer = null;

  el.classList.add('show');

/* ---------------------------------------------------------------------- */
/*  COMPASS — points at the next pad when it's off-screen                  */
/* ---------------------------------------------------------------------- */
const compassEl = document.getElementById('compass');
const _padNdc = new THREE.Vector3();
function updateCompass() {
  if (!currentPad) { compassEl.style.display = 'none'; return; }
  _padNdc.set(currentPad.pos.x, 1.2, currentPad.pos.z).project(camera);
  const behind = _padNdc.z > 1;
  const onScreen = !behind && Math.abs(_padNdc.x) < 0.85 && Math.abs(_padNdc.y) < 0.8;
  if (onScreen) { compassEl.style.display = 'none'; return; }
  let x = _padNdc.x, y = _padNdc.y;
  if (behind) { x = -x; y = -y; }
  const angle = Math.atan2(y, x); // math convention: 0 = right, 90deg = up
  const margin = 0.42;
  compassEl.style.left = `${50 + Math.cos(angle) * margin * 100}%`;
  compassEl.style.top = `${50 - Math.sin(angle) * margin * 100}%`;
  compassEl.style.transform = `translate(-50%, -50%) rotate(${90 - angle * 180 / Math.PI}deg)`;
  compassEl.style.display = 'block';
}

/* ---------------------------------------------------------------------- */
/*  STAMINA BAR                                                            */
/* ---------------------------------------------------------------------- */
const staminaWrap = document.getElementById('staminaWrap');
const staminaFill = document.getElementById('staminaFill');
function updateStaminaBar() {
  const pct = Math.max(0, Math.min(100, (stamina / STAMINA_MAX) * 100));
  staminaFill.style.width = pct + '%';
  staminaWrap.style.opacity = pct < 99.5 ? '1' : '0';
}

/* ---------------------------------------------------------------------- */
/*  CAMERA SHAKE — purchase juice                                          */
/* ---------------------------------------------------------------------- */
let shakeTime = 0;
let shakeStrength = 0;
const shakeOffset = new THREE.Vector3();
function triggerShake(strength, duration) {
  shakeTime = duration;
  shakeStrength = strength;
}

/* ---------------------------------------------------------------------- */
/*  INPUT — keyboard + virtual joystick                                    */
/* ---------------------------------------------------------------------- */
const keys = new Set();
addEventListener('keydown', (e) => keys.add(e.code));
addEventListener('keyup', (e) => keys.delete(e.code));

const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
const joyVec = { x: 0, z: 0 }; // x = strafe, z = forward, both in [-1, 1]
let joyPointerId = null;
const JOY_RADIUS = 44;

function joyReset() {
  joyVec.x = 0; joyVec.z = 0;
  joyKnob.style.transform = 'translate(-50%, -50%)';
}

joyBase.addEventListener('pointerdown', (e) => {
  joyPointerId = e.pointerId;
  joyBase.setPointerCapture(e.pointerId);
  updateJoy(e);
});
joyBase.addEventListener('pointermove', (e) => {
  if (e.pointerId !== joyPointerId) return;
  updateJoy(e);
});
function endJoy(e) {
  if (e.pointerId !== joyPointerId) return;
  joyPointerId = null;
  joyReset();
}
joyBase.addEventListener('pointerup', endJoy);
joyBase.addEventListener('pointercancel', endJoy);

function updateJoy(e) {
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const dist = Math.min(Math.hypot(dx, dy), JOY_RADIUS);
  const angle = Math.atan2(dy, dx);
  dx = Math.cos(angle) * dist;
  dy = Math.sin(angle) * dist;
  joyKnob.style.transform = `translate(${dx - 26}px, ${dy - 26}px)`;
  joyVec.x = dx / JOY_RADIUS;
  joyVec.z = -dy / JOY_RADIUS; // screen up = forward
}

/* ---------------------------------------------------------------------- */
/*  SAVE / LOAD                                                            */
/* ---------------------------------------------------------------------- */
function save() {
  localStorage.setItem(SAVE_KEY, JSON.stringify({
    money, stageIndex, stats, unlocked: [...unlockedAch], planks,
    buildings: buildings.map(b => ({ index: b.index, level: b.level })),
    player: { x: player.position.x, z: player.position.z },
  }));
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    money = typeof data.money === 'number' ? data.money : money;
    planks = typeof data.planks === 'number' ? data.planks : planks;
    stageIndex = Math.min(typeof data.stageIndex === 'number' ? data.stageIndex : 0, STAGES.length);
    if (data.stats) Object.assign(stats, data.stats);
    (data.unlocked || []).forEach(id => unlockedAch.add(id));
    if (Array.isArray(data.buildings)) {
      data.buildings.forEach(({ index, level }) => {
        if (STAGES[index]) spawnBuilding(index, Math.min(level || 1, MAX_BUILDING_LEVEL), { grow: false });
      });
    } else {
      // Back-compat with saves from before per-building levels existed.
      for (let i = 0; i < stageIndex; i++) spawnBuilding(i, 1, { grow: false });
    }
    if (data.player) {
      player.position.set(
        THREE.MathUtils.clamp(data.player.x || 0, -GROUND_HALF + 2, GROUND_HALF - 2),
        0,
        THREE.MathUtils.clamp(data.player.z || 0, -GROUND_HALF + 2, GROUND_HALF - 2)
      );
    }
  } catch (e) {
    console.warn('save corrupted, ignoring', e);
  }
}

/* ---------------------------------------------------------------------- */
/*  RESIZE                                                                  */
/* ---------------------------------------------------------------------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------------------------------------------------------------- */
/*  MOVEMENT + ANIMATE                                                      */
/* ---------------------------------------------------------------------- */
const worldUp = new THREE.Vector3(0, 1, 0);
const camForward = new THREE.Vector3();
const camRight = new THREE.Vector3();
const moveDir = new THREE.Vector3();
let runCycle = 0;
let lastFootstepPhase = 0;

function updatePlayer(dt) {
  const prevX = player.position.x;
  const prevZ = player.position.z;

  let inZ = 0, inX = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) inZ += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) inZ -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) inX += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) inX -= 1;
  inZ += joyVec.z;
  inX += joyVec.x;
  inZ = THREE.MathUtils.clamp(inZ, -1, 1);
  inX = THREE.MathUtils.clamp(inX, -1, 1);

  const moving = Math.abs(inZ) > 0.05 || Math.abs(inX) > 0.05;
  const sprintRequested = moving && (keys.has('ShiftLeft') || keys.has('ShiftRight') || Math.hypot(joyVec.x, joyVec.z) > 0.92);
  const sprinting = sprintRequested && stamina > 0.5;
  stamina = THREE.MathUtils.clamp(stamina + (sprinting ? -STAMINA_DRAIN : STAMINA_REGEN) * dt, 0, STAMINA_MAX);
  updateStaminaBar();

  if (moving) {
    camera.getWorldDirection(camForward);
    camForward.y = 0;
    camForward.normalize();
    camRight.crossVectors(camForward, worldUp).normalize();

    moveDir.set(0, 0, 0)
      .addScaledVector(camForward, inZ)
      .addScaledVector(camRight, inX);
    if (moveDir.lengthSq() > 1) moveDir.normalize();

    const speed = PLAYER_SPEED * (sprinting ? SPRINT_MULT : 1);
    const step = speed * dt;
    let nx = THREE.MathUtils.clamp(player.position.x + moveDir.x * step, -GROUND_HALF + 1, GROUND_HALF - 1);
    let nz = THREE.MathUtils.clamp(player.position.z + moveDir.z * step, -GROUND_HALF + 1, GROUND_HALF - 1);

    // Push the player out of any building it would otherwise walk into, sliding along its edge
    // (both the spiral's buildings and the sawmill's two static buildings).
    const pushOut = (pos, radius) => {
      const cd = radius + PLAYER_RADIUS;
      const dx = nx - pos.x;
      const dz = nz - pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist < cd && dist > 0.0001) {
        const push = cd - dist;
        nx += (dx / dist) * push;
        nz += (dz / dist) * push;
      }
    };
    for (const b of buildings) pushOut(b.pos, BUILDING_RADIUS);
    for (const c of STATIC_COLLIDERS) pushOut(c.pos, c.radius);

    stats.distanceRun += Math.hypot(nx - player.position.x, nz - player.position.z);
    player.position.x = nx;
    player.position.z = nz;

    const targetYaw = Math.atan2(moveDir.x, moveDir.z);
    let delta = targetYaw - player.rotation.y;
    delta = Math.atan2(Math.sin(delta), Math.cos(delta));
    player.rotation.y += delta * Math.min(1, dt * 10);

    runCycle += dt * (sprinting ? 14 : 9);
    const swing = Math.sin(runCycle) * 0.55;
    legL.rotation.x = swing;
    legR.rotation.x = -swing;
    armL.rotation.x = -swing;
    armR.rotation.x = swing;

    const footPhase = Math.floor(runCycle / Math.PI);
    if (footPhase !== lastFootstepPhase) {
      lastFootstepPhase = footPhase;
      sfx.footstep(footPhase % 2 === 0);
    }
  } else {
    legL.rotation.x = THREE.MathUtils.lerp(legL.rotation.x, 0, dt * 8);
    legR.rotation.x = THREE.MathUtils.lerp(legR.rotation.x, 0, dt * 8);
    armL.rotation.x = THREE.MathUtils.lerp(armL.rotation.x, 0, dt * 8);
    armR.rotation.x = THREE.MathUtils.lerp(armR.rotation.x, 0, dt * 8);
  }

  // Pad trigger check
  if (currentPad) {
    const dist = Math.hypot(player.position.x - currentPad.pos.x, player.position.z - currentPad.pos.z);
    if (dist < PAD_TRIGGER_RADIUS) {
      const stage = STAGES[currentPad.index];
      if (money >= stage.cost) {
        purchaseCurrentPad();
      } else if (!currentPad.insufficientShown) {
        currentPad.insufficientShown = true;
        sfx.error();
        toast(t('toast_need_more', { amount: fmt(stage.cost - money) }));
      }
    } else if (dist > PAD_TRIGGER_RADIUS * 1.6) {
      currentPad.insufficientShown = false;
    }
  }

  // Upgrade-pad trigger check — several of these can be active at once (one per built building).
  for (const b of buildings) {
    const up = b.upgradePad;
    if (!up) continue;
    const dist = Math.hypot(player.position.x - up.pos.x, player.position.z - up.pos.z);
    if (dist < PAD_TRIGGER_RADIUS) {
      const cost = buildingUpgradeCost(b.index, b.level);
      if (money >= cost) {
        upgradeBuilding(b);
      } else if (!up.insufficientShown) {
        up.insufficientShown = true;
        sfx.error();
        toast(t('toast_need_more_upgrade', { amount: fmt(cost - money) }));
      }
    } else if (dist > PAD_TRIGGER_RADIUS * 1.6) {
      up.insufficientShown = false;
    }
  }

  // OrbitControls.update() recomputes its spherical offset from (camera.position - target)
  // on every call. Since target now teleports to the player each frame, the camera must be
  // shifted by the exact same delta first — otherwise the offset (and thus distance) balloons
  // every frame until it's clamped at maxDistance, leaving the camera stranded far behind.
  camera.position.x += player.position.x - prevX;
  camera.position.z += player.position.z - prevZ;
  controls.target.set(player.position.x, PLAYER_EYE_HEIGHT, player.position.z);
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  updatePlayer(dt);
  updateSawmill(dt);

  for (let i = growingMeshes.length - 1; i >= 0; i--) {
    const m = growingMeshes[i];
    const s = m.scale.x;
    const ns = Math.min(1, s + dt * 4);
    m.scale.set(ns, ns, ns);
    if (ns >= 1) growingMeshes.splice(i, 1);
  }

  if (currentPad) {
    currentPad.beacon.material.opacity = 0.25 + Math.sin(performance.now() / 300) * 0.12;
    currentPad.group.rotation.y += dt * 0.6;
  }
  for (const b of buildings) {
    if (b.upgradePad) b.upgradePad.group.rotation.y += dt * 0.9;
  }

  clouds.forEach(c => {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > GROUND_HALF * 1.35) c.position.x = -GROUND_HALF * 1.35;
  });

  for (let i = particleBursts.length - 1; i >= 0; i--) {
    const p = particleBursts[i];
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.points);
      p.points.geometry.dispose();
      p.points.material.dispose();
      particleBursts.splice(i, 1);
      continue;
    }
    const pos = p.points.geometry.attributes.position;
    for (let j = 0; j < p.velocities.length; j++) {
      const v = p.velocities[j];
      v.y -= 9 * dt;
      pos.array[j * 3] += v.x * dt;
      pos.array[j * 3 + 1] += v.y * dt;
      pos.array[j * 3 + 2] += v.z * dt;
    }
    pos.needsUpdate = true;
    p.points.material.opacity = Math.max(0, p.life / p.maxLife);
  }

  updateCompass();

  displayedMoney += (money - displayedMoney) * Math.min(1, dt * 8);
  if (Math.abs(money - displayedMoney) < 0.5) displayedMoney = money;
  document.getElementById('money').textContent = fmt(displayedMoney);

  controls.update();

  // Camera shake is a purely visual jitter applied to the already-resolved camera position;
  // it's undone before the next frame so it never pollutes the follow-cam's base position.
  camera.position.sub(shakeOffset);
  if (shakeTime > 0) {
    shakeTime -= dt;
    const s = shakeStrength * Math.max(0, shakeTime);
    shakeOffset.set((Math.random() - 0.5) * s, (Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    camera.position.add(shakeOffset);
  } else {
    shakeOffset.set(0, 0, 0);
  }

  renderer.render(scene, camera);
}

/* ---------------------------------------------------------------------- */
/*  INIT                                                                   */
/* ---------------------------------------------------------------------- */
load();
applyLanguage();
if (stageIndex < STAGES.length && !currentPad) spawnPad(stageIndex);

// Position the camera behind the player, facing the next objective pad (or a sensible
// default direction once everything is built), so new/returning players immediately see where to run.
{
  const aimIndex = Math.min(stageIndex, STAGES.length - 1);
  const aimPos = stagePosition(aimIndex);
  const aimDir = new THREE.Vector3(aimPos.x - player.position.x, 0, aimPos.z - player.position.z);
  if (aimDir.lengthSq() < 0.0001) aimDir.set(0, 0, -1); else aimDir.normalize();
  camera.position.set(
    player.position.x - aimDir.x * CAM_DEFAULT_DIST,
    PLAYER_EYE_HEIGHT + 3.2,
    player.position.z - aimDir.z * CAM_DEFAULT_DIST
  );
  controls.target.set(player.position.x, PLAYER_EYE_HEIGHT, player.position.z);
  controls.update();
}

updateHUD();
updateAchBadge();
checkAchievements();
if (!localStorage.getItem(HINT_KEY)) hintOverlay.classList.add('show');
animate();
</script>
