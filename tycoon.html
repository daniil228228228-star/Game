<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tycoon 3D — Строительный тайкон</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; touch-action: none; }

  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
         padding: 10px 16px; background: linear-gradient(to bottom, rgba(10,14,20,.92), rgba(10,14,20,0));
         color: #eaf2ff; z-index: 10; pointer-events: none; }
  #hud .stat { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: rgba(20,28,40,.7);
               border: 1px solid rgba(120,170,255,.25); border-radius: 12px; padding: 8px 14px; font-weight: 600;
               font-size: 15px; backdrop-filter: blur(6px); }
  #hud .stat .icon { font-size: 18px; }
  #money { color: #8be28b; }
  #income { color: #ffd479; font-size: 13px; font-weight: 500; }

  #buildbar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 10px;
              padding: 12px 10px 18px; z-index: 10; background: linear-gradient(to top, rgba(10,14,20,.92), rgba(10,14,20,0));
              flex-wrap: wrap; }
  .btn { pointer-events: auto; cursor: pointer; user-select: none; border: 1px solid rgba(120,170,255,.3);
         background: rgba(20,28,40,.85); color: #eaf2ff; border-radius: 14px; padding: 10px 14px; min-width: 84px;
         text-align: center; transition: transform .12s, border-color .12s, background .12s; backdrop-filter: blur(6px); }
  .btn:active { transform: scale(0.95); }
  .btn.selected { border-color: #7fd0ff; background: rgba(50,90,140,.85); box-shadow: 0 0 14px rgba(120,190,255,.4); }
  .btn .emoji { font-size: 22px; display: block; }
  .btn .name { font-size: 12px; font-weight: 600; margin-top: 2px; }
  .btn .cost { font-size: 11px; color: #ffd479; margin-top: 2px; }
  .btn.disabled { opacity: .4; }
  #sellBtn.active { border-color: #ff7d7d; background: rgba(140,50,50,.85); box-shadow: 0 0 14px rgba(255,120,120,.4); }

  #toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 20; color: #fff;
           background: rgba(20,28,40,.9); border: 1px solid rgba(120,170,255,.3); padding: 8px 16px; border-radius: 10px;
           font-size: 13px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }

  #resetBtn { position: fixed; top: 10px; right: 16px; z-index: 10; pointer-events: auto; cursor: pointer;
              background: rgba(140,50,50,.7); color: #fff; border: 1px solid rgba(255,120,120,.3); border-radius: 10px;
              padding: 6px 10px; font-size: 12px; }
</style>
</head>
<body>

<div id="hud">
  <div class="stat"><span class="icon">💰</span><span id="money">0</span></div>
  <div class="stat"><span id="income">+0/с</span></div>
</div>

<button id="resetBtn">Сброс</button>
<div id="toast"></div>

<div id="buildbar">
  <div class="btn" data-type="house">
    <span class="emoji">🏠</span><span class="name">Дом</span><span class="cost">50</span>
  </div>
  <div class="btn" data-type="shop">
    <span class="emoji">🏪</span><span class="name">Магазин</span><span class="cost">200</span>
  </div>
  <div class="btn" data-type="factory">
    <span class="emoji">🏭</span><span class="name">Завод</span><span class="cost">800</span>
  </div>
  <div class="btn" data-type="tower">
    <span class="emoji">🏢</span><span class="name">Башня</span><span class="cost">3000</span>
  </div>
  <div class="btn" id="sellBtn">
    <span class="emoji">💵</span><span class="name">Продать</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------------- */
/*  CONFIG                                                                 */
/* ---------------------------------------------------------------------- */
const GRID_SIZE = 14;        // tiles per side
const TILE_SIZE = 4;         // world units per tile
const SAVE_KEY = 'tycoon3d_save_v1';

const BUILDING_TYPES = {
  house:   { name: 'Дом',      cost: 50,   income: 1,  color: 0x6fcf6f, height: 2.2, emoji: '🏠' },
  shop:    { name: 'Магазин',  cost: 200,  income: 5,  color: 0x5ab0ff, height: 3.2, emoji: '🏪' },
  factory: { name: 'Завод',    cost: 800,  income: 25, color: 0xff9d4d, height: 4.2, emoji: '🏭' },
  tower:   { name: 'Башня',    cost: 3000, income: 90, color: 0xd282ff, height: 9,   emoji: '🏢' },
};
const SELL_REFUND_RATIO = 0.5;

/* ---------------------------------------------------------------------- */
/*  STATE                                                                  */
/* ---------------------------------------------------------------------- */
let money = 300;
let selectedType = 'house';
let sellMode = false;
/** grid[x][z] = { type, mesh } | null */
const grid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(null));

/* ---------------------------------------------------------------------- */
/*  THREE SETUP                                                            */
/* ---------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b7e0);
scene.fog = new THREE.Fog(0x87b7e0, 60, 140);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
camera.position.set(GRID_SIZE * 2.2, GRID_SIZE * 2.0, GRID_SIZE * 2.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.15;
controls.minDistance = 10;
controls.maxDistance = 90;
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(40, 60, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const half = GRID_SIZE * TILE_SIZE * 0.7;
sun.shadow.camera.left = -half;
sun.shadow.camera.right = half;
sun.shadow.camera.top = half;
sun.shadow.camera.bottom = -half;
sun.shadow.camera.far = 200;
scene.add(sun);

// Ground
const groundSize = GRID_SIZE * TILE_SIZE;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(groundSize, groundSize),
  new THREE.MeshStandardMaterial({ color: 0x3a9a4d })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const gridHelper = new THREE.GridHelper(groundSize, GRID_SIZE, 0x1c5e2a, 0x2d7a3d);
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// Tile pick-planes (invisible, one per cell, for raycasting + hover highlight)
const tileGroup = new THREE.Group();
scene.add(tileGroup);
const tileGeo = new THREE.PlaneGeometry(TILE_SIZE * 0.94, TILE_SIZE * 0.94);
const tileMatIdle = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
const origin = -groundSize / 2 + TILE_SIZE / 2;

for (let x = 0; x < GRID_SIZE; x++) {
  for (let z = 0; z < GRID_SIZE; z++) {
    const tile = new THREE.Mesh(tileGeo, tileMatIdle.clone());
    tile.rotation.x = -Math.PI / 2;
    tile.position.set(origin + x * TILE_SIZE, 0.02, origin + z * TILE_SIZE);
    tile.userData = { gx: x, gz: z };
    tileGroup.add(tile);
  }
}

// Hover highlight ring
const hoverMesh = new THREE.Mesh(
  new THREE.RingGeometry(TILE_SIZE * 0.35, TILE_SIZE * 0.46, 24),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide })
);
hoverMesh.rotation.x = -Math.PI / 2;
hoverMesh.visible = false;
scene.add(hoverMesh);

/* ---------------------------------------------------------------------- */
/*  BUILDING PLACEMENT                                                     */
/* ---------------------------------------------------------------------- */
function tileWorldPos(x, z) {
  return new THREE.Vector3(origin + x * TILE_SIZE, 0, origin + z * TILE_SIZE);
}

function createBuildingMesh(type) {
  const def = BUILDING_TYPES[type];
  const group = new THREE.Group();

  const baseSize = TILE_SIZE * 0.72;
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(baseSize, def.height, baseSize),
    new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.7, metalness: 0.05 })
  );
  body.position.y = def.height / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(baseSize * 0.75, def.height * 0.35, 4),
    new THREE.MeshStandardMaterial({ color: 0x8a3b2b, roughness: 0.8 })
  );
  roof.rotation.y = Math.PI / 4;
  roof.position.y = def.height + (def.height * 0.35) / 2;
  roof.castShadow = true;
  if (type === 'house' || type === 'shop') group.add(roof);

  group.scale.set(0.001, 0.001, 0.001);
  group.userData.targetScale = 1;
  return group;
}

function placeBuilding(x, z, type) {
  const mesh = createBuildingMesh(type);
  const pos = tileWorldPos(x, z);
  mesh.position.set(pos.x, 0, pos.z);
  scene.add(mesh);
  grid[x][z] = { type, mesh, income: BUILDING_TYPES[type].income };
}

function removeBuilding(x, z) {
  const cell = grid[x][z];
  if (!cell) return;
  scene.remove(cell.mesh);
  grid[x][z] = null;
}

/* ---------------------------------------------------------------------- */
/*  ECONOMY                                                                 */
/* ---------------------------------------------------------------------- */
function totalIncomePerSec() {
  let sum = 0;
  for (let x = 0; x < GRID_SIZE; x++)
    for (let z = 0; z < GRID_SIZE; z++)
      if (grid[x][z]) sum += grid[x][z].income;
  return sum;
}

function updateHUD() {
  document.getElementById('money').textContent = Math.floor(money).toLocaleString('ru-RU');
  document.getElementById('income').textContent = `+${totalIncomePerSec().toLocaleString('ru-RU')}/с`;
}

setInterval(() => {
  money += totalIncomePerSec();
  updateHUD();
  save();
}, 1000);

/* ---------------------------------------------------------------------- */
/*  UI — build bar                                                         */
/* ---------------------------------------------------------------------- */
const buildbar = document.getElementById('buildbar');
const buildingBtns = [...buildbar.querySelectorAll('.btn[data-type]')];
const sellBtn = document.getElementById('sellBtn');

function refreshBuildbar() {
  buildingBtns.forEach(btn => {
    const type = btn.dataset.type;
    btn.classList.toggle('selected', !sellMode && selectedType === type);
    btn.classList.toggle('disabled', money < BUILDING_TYPES[type].cost);
  });
  sellBtn.classList.toggle('active', sellMode);
}

buildingBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    selectedType = btn.dataset.type;
    sellMode = false;
    refreshBuildbar();
  });
});

sellBtn.addEventListener('click', () => {
  sellMode = !sellMode;
  refreshBuildbar();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Сбросить прогресс?')) return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
});

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1200);
}

/* ---------------------------------------------------------------------- */
/*  RAYCASTING — pointer interaction                                       */
/* ---------------------------------------------------------------------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pointerDownPos = null;

function pointerToNDC(e) {
  const p = e.touches ? e.touches[0] : e;
  pointer.x = (p.clientX / innerWidth) * 2 - 1;
  pointer.y = -(p.clientY / innerHeight) * 2 + 1;
}

function pickTile(e) {
  pointerToNDC(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(tileGroup.children, false);
  return hits.length ? hits[0].object.userData : null;
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!pointerDownPos) return;
  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  pointerDownPos = null;
  if (Math.hypot(dx, dy) > 6) return; // was a drag/orbit, not a tap

  const tile = pickTile(e);
  if (!tile) return;
  const { gx, gz } = tile;

  if (sellMode) {
    const cell = grid[gx][gz];
    if (cell) {
      const refund = Math.floor(BUILDING_TYPES[cell.type].cost * SELL_REFUND_RATIO);
      money += refund;
      removeBuilding(gx, gz);
      toast(`Продано +${refund} 💰`);
      updateHUD();
      refreshBuildbar();
      save();
    } else {
      toast('Тут нечего продавать');
    }
    return;
  }

  if (grid[gx][gz]) {
    toast('Клетка уже занята');
    return;
  }
  const cost = BUILDING_TYPES[selectedType].cost;
  if (money < cost) {
    toast('Недостаточно денег');
    return;
  }
  money -= cost;
  placeBuilding(gx, gz, selectedType);
  toast(`Построено: ${BUILDING_TYPES[selectedType].name}`);
  updateHUD();
  refreshBuildbar();
  save();
});

renderer.domElement.addEventListener('pointermove', (e) => {
  const tile = pickTile(e);
  if (tile) {
    const pos = tileWorldPos(tile.gx, tile.gz);
    hoverMesh.position.set(pos.x, 0.03, pos.z);
    hoverMesh.material.color.set(grid[tile.gx][tile.gz] ? 0xff6b6b : 0x7fffb0);
    hoverMesh.visible = true;
  } else {
    hoverMesh.visible = false;
  }
});

/* ---------------------------------------------------------------------- */
/*  SAVE / LOAD                                                            */
/* ---------------------------------------------------------------------- */
function save() {
  const cells = [];
  for (let x = 0; x < GRID_SIZE; x++)
    for (let z = 0; z < GRID_SIZE; z++)
      if (grid[x][z]) cells.push({ x, z, type: grid[x][z].type });
  localStorage.setItem(SAVE_KEY, JSON.stringify({ money, cells }));
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    money = typeof data.money === 'number' ? data.money : money;
    (data.cells || []).forEach(({ x, z, type }) => {
      if (BUILDING_TYPES[type] && grid[x] && grid[x][z] === null) placeBuilding(x, z, type);
    });
  } catch (e) {
    console.warn('save corrupted, ignoring', e);
  }
}

/* ---------------------------------------------------------------------- */
/*  RESIZE                                                                  */
/* ---------------------------------------------------------------------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------------------------------------------------------------- */
/*  ANIMATE                                                                 */
/* ---------------------------------------------------------------------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // simple pop-in grow animation for newly placed buildings
  for (let x = 0; x < GRID_SIZE; x++) {
    for (let z = 0; z < GRID_SIZE; z++) {
      const cell = grid[x][z];
      if (!cell) continue;
      const s = cell.mesh.scale.x;
      if (s < 1) {
        const ns = Math.min(1, s + dt * 4);
        cell.mesh.scale.set(ns, ns, ns);
      }
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

/* ---------------------------------------------------------------------- */
/*  INIT                                                                   */
/* ---------------------------------------------------------------------- */
load();
updateHUD();
refreshBuildbar();
animate();
</script>
</body>
</html>
