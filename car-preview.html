<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>EliteRoof Car Preview</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0f14;font-family:-apple-system;color:#fff}#c{width:100%;height:100%;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;gap:8px}.card{background:rgba(8,12,18,.88);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:10px 12px;backdrop-filter:blur(12px)}.brand{font-weight:900}.brand b{color:#ffad18}.hint{font-size:11px;color:#c6ced6}.boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0f14;z-index:5;text-align:center;padding:30px;font-weight:700}.err{color:#ffb3a7}</style></head><body><canvas id="c"></canvas><div id="boot" class="boot">Загрузка машины…</div><div class="ui"><div class="top"><div class="card brand">Elite<b>Roof</b> • CAR TEST</div><div class="card hint">Пальцем вращай • щипок — масштаб</div></div></div><script>const boot=document.getElementById('boot');function fail(t){boot.classList.add('err');boot.textContent=t}function load(srcs,i=0){if(i>=srcs.length)return fail('Не удалось загрузить Babylon.js');const s=document.createElement('script');s.src=srcs[i];s.onload=()=>loadLoader(0);s.onerror=()=>load(srcs,i+1);document.head.appendChild(s)}function loadLoader(i){const srcs=['https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js','https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.0.0/babylonjs.loaders.min.js','https://unpkg.com/babylonjs-loaders@7.0.0/babylonjs.loaders.min.js'];if(i>=srcs.length)return fail('Не удалось загрузить GLB-загрузчик');const s=document.createElement('script');s.src=srcs[i];s.onload=start;s.onerror=()=>loadLoader(i+1);document.head.appendChild(s)}async function start(){try{const canvas=document.getElementById('c');const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,adaptToDeviceRatio:true});const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.55,.68,.75,1);scene.environmentIntensity=.8;const camera=new BABYLON.ArcRotateCamera('cam',-Math.PI/2,1.15,9,new BABYLON.Vector3(0,1,0),scene);camera.attachControl(canvas,true);camera.lowerRadiusLimit=2.5;camera.upperRadiusLimit=20;camera.wheelDeltaPercentage=.01;camera.pinchDeltaPercentage=.01;new BABYLON.HemisphericLight('h',new BABYLON.Vector3(0,1,0),scene).intensity=1.4;const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.6,-1,-.4),scene);sun.position=new BABYLON.Vector3(10,16,10);sun.intensity=2.3;const ground=BABYLON.MeshBuilder.CreateGround('ground',{width:30,height:30},scene);const gm=new BABYLON.PBRMaterial('gm',scene);gm.albedoColor=new BABYLON.Color3(.16,.19,.14);gm.roughness=1;ground.material=gm;ground.receiveShadows=true;const shadow=new BABYLON.ShadowGenerator(1024,sun);shadow.useBlurExponentialShadowMap=true;shadow.blurKernel=24;const result=await BABYLON.SceneLoader.ImportMeshAsync('','./assets/','car_scene_mobile.glb',scene);const root=new BABYLON.TransformNode('root',scene);result.meshes.forEach(m=>{if(m!==scene.meshes[0]){m.parent=root;m.receiveShadows=true;shadow.addShadowCaster(m,true)}});const bounds=root.getHierarchyBoundingVectors();const size=bounds.max.subtract(bounds.min);const center=bounds.min.add(size.scale(.5));root.position.subtractInPlace(center);const maxDim=Math.max(size.x,size.y,size.z)||1;const scale=4/maxDim;root.scaling.setAll(scale);camera.target=new BABYLON.Vector3(0,Math.max(.7,size.y*scale*.35),0);camera.radius=7;boot.remove();engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize())}catch(e){console.error(e);fail('Модель пока не загружена. Загрузите car_scene_mobile.glb в папку assets.\n\n'+e.message)}}load(['https://cdn.babylonjs.com/babylon.js','https://cdn.jsdelivr.net/npm/babylonjs@7.0.0/babylon.min.js','https://unpkg.com/babylonjs@7.0.0/babylon.js']);</script></body></html>
