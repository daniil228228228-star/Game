function createWorkLift(color = 0x5ab0ff) {
  const group = new THREE.Group();
  const chassisMat = createMetalMaterial(0x353b44, { roughness: 0.8, metalness: 0.18 });
  const accentMat = createMetalMaterial(color, { roughness: 0.56, metalness: 0.2 });
  const platformMat = createMetalMaterial(0xc8d0d8, { roughness: 0.62, metalness: 0.24 });

  const chassis = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.18, 1.42), chassisMat);
  chassis.position.y = 0.18; group.add(chassis);
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.82, 0.2, 1.1), accentMat);
  base.position.y = 0.34; base.castShadow = true; group.add(base);

  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x171a1f, roughness: 0.96 });
  for (const sx of [-0.42, 0.42]) for (const sz of [-0.48, 0.48]) {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.12, 12), wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(sx, 0.14, sz);
    group.add(wheel);
  }

  // Outrigger support legs (spec section 6: "arrives, deploys legs ... then folds up,
  // leaves"). Hidden while driving/idle, shown only while actually working a site --
  // toggled in moveWorkVehicle().
  const outriggerMat = createMetalMaterial(0xd8a23c, { roughness: 0.6, metalness: 0.24 });
  const outriggers = [];
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.64), outriggerMat);
    leg.position.set(sx * 0.5, 0.13, sz * 0.72);
    leg.rotation.x = sz * 0.78;
    leg.rotation.z = sx * 0.08;
    leg.visible = false;
    group.add(leg);
    outriggers.push(leg);
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.03, 10), outriggerMat);
    pad.position.set(sx * 0.64, 0.015, sz * 1.05);
    pad.visible = false;
    group.add(pad);
    outriggers.push(pad);
  }
  group.userData.outriggers = outriggers;

  // Two-stage scissor arm mechanism.
  const lowerPivot = new THREE.Group();
  lowerPivot.position.y = 0.34;
  const armMat = createMetalMaterial(0xe7b742, { roughness: 0.6, metalness: 0.18 });
  const armA = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.12, 0.1), armMat);
  armA.rotation.z = 0.62; armA.position.set(-0.25, 0.44, 0); lowerPivot.add(armA);
  const armB = armA.clone(); armB.rotation.z = -0.62; armB.position.x = 0.25; lowerPivot.add(armB);
  const armC = armA.clone(); armC.rotation.z = -0.62; armC.position.set(-0.25, 1.05, 0); lowerPivot.add(armC);
  const armD = armA.clone(); armD.rotation.z = 0.62; armD.position.set(0.25, 1.05, 0); lowerPivot.add(armD);
  group.add(lowerPivot);

  // The platform (+ guard rail) is now a CHILD of the arm pivot. It used to be a separate
  // mesh positioned independently at a fixed height that never actually moved -- the lift
  // never visibly raised its own basket, a "flying object" bug (a support structure that
  // moved while the thing it's supposed to support stayed put, disconnected from it).
  // Parenting it here, right above the arms' own local top, means it now genuinely rides up
  // and down with the mechanism, and moveWorkVehicle() drives lowerPivot across a much
  // larger range so the raise is actually visible.
  const platform = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.08, 0.78), platformMat);
  platform.position.y = 1.58; platform.castShadow = true; lowerPivot.add(platform);
  for (const sx of [-0.4, 0.4]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.34, 0.035), platformMat);
    post.position.set(sx, 1.76, 0.31); lowerPivot.add(post);
  }
  const rail = new THREE.Mesh(new THREE.BoxGeometry(0.84, 0.035, 0.035), platformMat);
  rail.position.set(0, 1.92, 0.31); lowerPivot.add(rail);

  // A rider standing on the platform, visible only while the lift is actually working a
  // site -- spec section 6's "a worker inside doing finishing work."
  const rider = createWorkerNPC(0xffb84d);
  rider.group.scale.setScalar(0.72);
  rider.group.position.set(0, 1.58, 0);
  rider.group.visible = false;
  lowerPivot.add(rider.group);
  group.userData.rider = rider.group;

  const label = makeLabelSprite([lang === 'ru' ? 'ПОДЪЁМНИК' : 'LIFT', lang === 'ru' ? 'ожидает задачу' : 'waiting']);
  label.position.set(0, 3.15, 0);
  label.scale.set(1.9, 0.76, 1);
  group.add(label);
  group.userData.statusSprite = label;
  group.userData.liftArms = lowerPivot;
  group.userData.liftRetracted = 0.34;
  return group;
}

function vehicleWorkTargets(role = 'delivery') {
  return growingMeshes
    .filter(build => build && build.entry && build.entry.underConstruction)
    .filter(build => {
      const phase = typeof build.phase === 'number' ? build.phase : constructionPhaseIndex(build.timer / Math.max(0.001, build.duration));
      return role === 'lift' ? phase >= 4 : phase <= 3;
    })
    .map(build => ({ pos: build.entry.pos.clone(), build }));
}

// Names the building a vehicle's status label should reference, e.g. "Доски → Дом" instead
// of the previous generic "MATERIALS / delivery" (spec section 5). Reads ud.assignedEntry,
// set by assignVehicleJob() for both a real construction/upgrade target and the delivery
// role's "no active site, restock the nearest built warehouse/factory" fallback -- so it
// stays correct through the whole outbound -> working -> returning cycle, not just at
// assignment time.
function jobTargetName(ud) {
  return ud.assignedEntry ? stageName(STAGES[ud.assignedEntry.index]) : null;
}

function setVehicleStatus(vehicle, primary, secondary = '') {
  const sprite = vehicle.userData.statusSprite;
  if (!sprite) return;
  updateLabelSprite(sprite, [primary, secondary].filter(Boolean));
}

function assignVehicleJob(vehicle) {
  const ud = vehicle.userData;
  const targets = vehicleWorkTargets(ud.role || 'delivery');
  const activeJob = targets.length ? targets[Math.floor(Math.random() * targets.length)] : null;
  const activeTarget = activeJob ? activeJob.pos : null;
  ud.assignedEntry = activeJob ? activeJob.build.entry : null;
  if (ud.role === 'lift') {
    if (!activeTarget) {
      ud.state = 'idle';
      ud.path = [ud.home.clone()];
      ud.pathIndex = 0;
      setVehicleStatus(vehicle, lang === 'ru' ? 'ПОДЪЁМНИК' : 'LIFT', lang === 'ru' ? 'ждёт стройку' : 'waiting for build');
      return;
    }
    ud.jobTarget = activeTarget.clone().add(new THREE.Vector3(1.7, 0, -1.2));
    ud.path = buildRoadRoute(ud.home, ud.jobTarget);
    ud.pathIndex = 0;
    ud.state = 'outbound';
    const liftTargetName = jobTargetName(ud);
    setVehicleStatus(vehicle, lang === 'ru' ? 'ПОДЪЁМНИК' : 'LIFT',
      liftTargetName ? `→ ${liftTargetName}` : (lang === 'ru' ? 'едет на объект' : 'to worksite'));
  } else {
    let target = activeTarget;
    // With no active construction to deliver to, restock whichever built warehouse or
    // factory is nearest instead -- keep its entry (not just its position), same as the
    // real-construction case above, so the status label can still name a real target
    // building all the way through outbound -> working -> returning.
    if (!target) {
      ud.assignedEntry = buildings.find(b => !b.underConstruction && STAGES[b.index]?.archetype === 'warehouse')
        || buildings.find(b => !b.underConstruction && STAGES[b.index]?.archetype === 'factory');
      if (ud.assignedEntry) target = ud.assignedEntry.pos.clone();
    }
    if (!target) {
      ud.state = 'idle';
      ud.path = [ud.home.clone()];
      ud.pathIndex = 0;
      setVehicleStatus(vehicle, lang === 'ru' ? 'МАТЕРИАЛЫ' : 'MATERIALS', lang === 'ru' ? 'ждёт заказ' : 'waiting');
      return;
    }
    ud.jobTarget = target.clone().add(new THREE.Vector3(-1.5, 0, 1.2));
    ud.path = buildRoadRoute(ud.home, ud.jobTarget);
    ud.pathIndex = 0;
    ud.state = 'outbound';
    const deliveryTargetName = jobTargetName(ud);
    setVehicleStatus(vehicle, lang === 'ru' ? 'МАТЕРИАЛЫ' : 'MATERIALS',
      deliveryTargetName ? `→ ${deliveryTargetName}` : (lang === 'ru' ? 'доставка на объект' : 'delivery'));
  }
}

function constructionBuildNear(position, maxDistance = 3.4) {
  let best = null;
  let bestDist = Infinity;
  for (const build of growingMeshes) {
    if (!build?.entry?.underConstruction) continue;
    const d = Math.hypot(build.entry.pos.x - position.x, build.entry.pos.z - position.z);
    if (d < maxDistance && d < bestDist) { best = build; bestDist = d; }
  }
  return best;
}

function moveWorkVehicle(vehicle, dt) {
  const ud = vehicle.userData;
  if (!ud.path || !ud.path.length) assignVehicleJob(vehicle);

  // Lift arms/outriggers/rider: retract and hide by default (driving/idle/returning), only
  // deployed and extended in the 'working' branch below. Runs before any state branch's
  // early return so it applies in every state, not just 'working'.
  if (ud.role === 'lift' && ud.liftArms && ud.state !== 'working') {
    ud.liftArms.position.y = THREE.MathUtils.lerp(ud.liftArms.position.y, vehicle.userData.liftRetracted, Math.min(1, dt * 2.6));
    if (vehicle.userData.rider) vehicle.userData.rider.visible = false;
    for (const leg of vehicle.userData.outriggers || []) leg.visible = false;
  }

  if (ud.state === 'idle') {
    vehicle.position.lerp(ud.home, Math.min(1, dt * 2));
    ud.recheck = (ud.recheck || 0) - dt;
    if (ud.recheck <= 0) {
      ud.recheck = 1.25;
      assignVehicleJob(vehicle);
    }
    return;
  }
  if (ud.state === 'working') {
    ud.waitTimer -= dt;
    const nearbyBuild = constructionBuildNear(vehicle.position, 4.0);
    if (ud.role === 'lift' && ud.liftArms) {
      const liftPhase = nearbyBuild ? (nearbyBuild.phase ?? constructionPhaseIndex(nearbyBuild.timer / nearbyBuild.duration)) : -1;
      const targetHeight = (liftPhase >= 5 ? 1.95 : 1.35) + Math.sin(performance.now() / 520) * 0.05;
      ud.liftArms.position.y = THREE.MathUtils.lerp(ud.liftArms.position.y, targetHeight, Math.min(1, dt * 2.2));
      if (vehicle.userData.rider) vehicle.userData.rider.visible = true;
      for (const leg of vehicle.userData.outriggers || []) leg.visible = true;
      if (nearbyBuild && liftPhase >= 4) nearbyBuild.timer = Math.min(nearbyBuild.duration, nearbyBuild.timer + dt * 0.34);
    }
    if (ud.waitTimer <= 0) {
      ud.path = buildRoadRoute(vehicle.position, ud.home);
      ud.pathIndex = 0;
      ud.state = 'returning';
      setVehicleStatus(vehicle,
        ud.role === 'lift' ? (lang === 'ru' ? 'ПОДЪЁМНИК' : 'LIFT') : (lang === 'ru' ? 'МАТЕРИАЛЫ' : 'MATERIALS'),
        lang === 'ru' ? 'возвращается на базу' : 'returning');
    }
    return;
  }

  const path = ud.path;
  const nextIndex = Math.min(ud.pathIndex + 1, path.length - 1);
  const target = path[nextIndex];
  const dx = target.x - vehicle.position.x;
  const dz = target.z - vehicle.position.z;
  const dist = Math.hypot(dx, dz);
  if (dist < 0.12) {
    if (nextIndex >= path.length - 1) {
      if (ud.state === 'outbound') {
        ud.state = 'working';
        ud.waitTimer = ud.role === 'lift' ? 6.0 : 2.6;
        if (ud.role === 'delivery') {
          const build = constructionBuildNear(vehicle.position, 4.2);
          if (build && (build.phase ?? 0) <= 3) build.timer = Math.min(build.duration, build.timer + build.duration * 0.09);
        }
        {
          const workingTargetName = jobTargetName(ud);
          const workingSecondary = ud.role === 'lift'
            ? (workingTargetName ? `${lang === 'ru' ? 'работает' : 'working'}: ${workingTargetName}` : (lang === 'ru' ? 'работает на стройке' : 'working'))
            : (workingTargetName ? `${lang === 'ru' ? 'разгрузка' : 'unloading'}: ${workingTargetName}` : (lang === 'ru' ? 'разгрузка' : 'unloading'));
          setVehicleStatus(vehicle,
            ud.role === 'lift' ? (lang === 'ru' ? 'ПОДЪЁМНИК' : 'LIFT') : (lang === 'ru' ? 'МАТЕРИАЛЫ' : 'MATERIALS'),
            workingSecondary);
        }
      } else {
        ud.state = 'idle';
        ud.recheck = 1.0;
        setVehicleStatus(vehicle,
          ud.role === 'lift' ? (lang === 'ru' ? 'ПОДЪЁМНИК' : 'LIFT') : (lang === 'ru' ? 'МАТЕРИАЛЫ' : 'MATERIALS'),
          lang === 'ru' ? 'на базе' : 'at base');
      }
      return;
    }
    ud.pathIndex = nextIndex;
    return;
  }
  const step = Math.min(dist, (ud.speed || 1) * dt);
  vehicle.position.x += (dx / dist) * step;
  vehicle.position.z += (dz / dist) * step;
  vehicle.rotation.y = Math.atan2(dx, dz);
}

function spawnAmbientLife() {
  // 7 workers cycling through the 4 roles (builder/rigger/foreman/loader), each anchored to
  // a home base they return to (and wander only near) whenever there's no construction to
  // help with. Two are stationed near each of the sawmill's two buildings, two at the
  // central plaza, one at the fourth spiral stage -- close to where they're actually likely
  // to be needed rather than scattered arbitrarily.
  for (let i = 0; i < 7; i++) {
    const role = WORKER_ROLES[i % WORKER_ROLES.length];
    const worker = createWorkerNPC(role.key);
    const base = i < 2 ? GENERATOR_POS : (i < 4 ? SAWMILL_POS : (i < 6 ? new THREE.Vector3(0, 0, 0) : stagePosition(3)));
    worker.homeBase = base.clone();
    worker.group.position.set(base.x + (Math.random() - 0.5) * 2.8, 0, base.z + (Math.random() - 0.5) * 2.8);
    chooseWorkerTarget(worker);
    scene.add(worker.group);
    npcWorkers.push(worker);
  }

  const delivery = createServiceTruck(0xf7b53f);
  delivery.userData.role = 'delivery';
  delivery.userData.home = SAWMILL_POS.clone().add(new THREE.Vector3(2.2, 0, 1.7));
  delivery.userData.speed = 1.08;
  delivery.userData.state = 'idle';
  delivery.position.copy(delivery.userData.home);
  const deliveryLabel = makeLabelSprite([lang === 'ru' ? 'МАТЕРИАЛЫ' : 'MATERIALS', lang === 'ru' ? 'на базе' : 'at base']);
  deliveryLabel.position.set(0, 1.95, 0);
  deliveryLabel.scale.set(1.9, 0.78, 1);
  delivery.add(deliveryLabel);
  delivery.userData.statusSprite = deliveryLabel;
  scene.add(delivery);
  serviceVehicles.push(delivery);

  const lift = createWorkLift(0x5ab0ff);
  lift.userData.role = 'lift';
  lift.userData.home = GENERATOR_POS.clone().add(new THREE.Vector3(-2.2, 0, 1.5));
  lift.userData.speed = 0.88;
  lift.userData.state = 'idle';
  lift.position.copy(lift.userData.home);
  scene.add(lift);
  serviceVehicles.push(lift);
}
spawnAmbientLife();

function updateAmbientLife(dt) {
  if (scene.userData.clouds) {
    for (const cloud of scene.userData.clouds) {
      cloud.position.x += cloud.userData.drift * dt;
      if (cloud.position.x > 90) cloud.position.x = -90;
    }
  }
  if (scene.userData.fountainWater) {
    scene.userData.fountainWater.position.y = 0.23 + Math.sin(performance.now() / 260) * 0.01;
  }
  for (const worker of npcWorkers) {
    if (!worker.target) chooseWorkerTarget(worker);
    const dx = worker.target.x - worker.group.position.x;
    const dz = worker.target.z - worker.group.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.18) {
      if (worker.idle > 0) {
        worker.idle -= dt;
        const activeWork = worker.workBuild && worker.workBuild.entry && worker.workBuild.entry.underConstruction;
        if (activeWork) {
          worker.phase += dt * 9;
          worker.armL.rotation.x = -0.45 + Math.sin(worker.phase) * 0.55;
          worker.armR.rotation.x = -0.35 + Math.sin(worker.phase + Math.PI) * 0.48;
          worker.legL.rotation.x = THREE.MathUtils.lerp(worker.legL.rotation.x, 0, dt * 8);
          worker.legR.rotation.x = THREE.MathUtils.lerp(worker.legR.rotation.x, 0, dt * 8);
          worker.workBuild.timer = Math.min(worker.workBuild.duration, worker.workBuild.timer + dt * 0.035);
        } else {
          worker.armL.rotation.x = THREE.MathUtils.lerp(worker.armL.rotation.x, 0, dt * 6);
          worker.armR.rotation.x = THREE.MathUtils.lerp(worker.armR.rotation.x, 0, dt * 6);
          worker.legL.rotation.x = THREE.MathUtils.lerp(worker.legL.rotation.x, 0, dt * 6);
          worker.legR.rotation.x = THREE.MathUtils.lerp(worker.legR.rotation.x, 0, dt * 6);
        }
      } else chooseWorkerTarget(worker);
    } else {
      const step = Math.min(dist, worker.speed * dt);
      worker.group.position.x += (dx / dist) * step;
      worker.group.position.z += (dz / dist) * step;
      worker.group.rotation.y = Math.atan2(dx, dz);
      worker.phase += dt * 8;
      worker.legL.rotation.x = Math.sin(worker.phase) * 0.7;
      worker.legR.rotation.x = Math.sin(worker.phase + Math.PI) * 0.7;
      worker.armL.rotation.x = Math.sin(worker.phase + Math.PI) * 0.6;
      worker.armR.rotation.x = Math.sin(worker.phase) * 0.6;
    }
  }

  for (const vehicle of serviceVehicles) {
    moveWorkVehicle(vehicle, dt);
  }
}

function updateConstructionSites(dt) {
  for (let i = constructionSites.length - 1; i >= 0; i--) {
    const site = constructionSites[i];
    if (site.buildRef) site.timer = site.buildRef.timer;
    else site.timer += dt;
    const t = Math.min(1, site.timer / Math.max(0.001, site.duration));
    const phase = constructionPhaseIndex(t);
    setConstructionPhaseVisual(site, phase, t);

    if (phase >= 1 && phase <= 4) site.jibPivot.rotation.y += dt * (phase === 2 ? 1.0 : 0.55);
    site.hook.position.y = -0.1 - 0.22 * Math.sin(performance.now() / 260 + i);
    if (phase <= 1) site.drumPivot.rotation.x += dt * 3.8;
    if (phase <= 1) {
      site.armBase.rotation.z = -0.14 + Math.sin(performance.now() / 300 + i) * 0.12;
      site.arm2Pivot.rotation.z = 0.18 + Math.sin(performance.now() / 240 + i * 2) * 0.16;
    }
    site.beacon.material.opacity = 0.1 + Math.sin(performance.now() / 180) * 0.05;
    site.group.position.y = Math.sin(Math.min(1, t) * Math.PI) * 0.025;

    if (site.timer >= site.duration) {
      scene.remove(site.group);
      constructionSites.splice(i, 1);
    }
  }
}

function fitLabelFont(ctx, text, maxWidth, startSize, minSize, weight = 800) {
  let size = startSize;
  while (size > minSize) {
    ctx.font = `${weight} ${size}px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif`;
    if (ctx.measureText(String(text)).width <= maxWidth) break;
    size -= 1;
  }
  return size;
}

function drawLabelLine(ctx, text, y, color, maxSize, minSize, maxWidth, weight = 800) {
  const value = String(text ?? '');
  const size = fitLabelFont(ctx, value, maxWidth, maxSize, minSize, weight);
  ctx.font = `${weight} ${size}px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(value, 256, y, maxWidth);
}

function makeLabelSprite(lines) {
  const safeLines = Array.isArray(lines) ? lines.filter(v => v !== undefined && v !== null).slice(0, 3) : [String(lines ?? '')];
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = safeLines.length >= 3 ? 246 : 210;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, 'rgba(29,39,55,0.97)');
  grad.addColorStop(1, 'rgba(11,17,26,0.95)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(8, 8, canvas.width - 16, canvas.height - 16, 28);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,212,121,0.82)';
  ctx.lineWidth = 5;
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,212,121,0.18)';
  ctx.beginPath();
  ctx.roundRect(22, 20, canvas.width - 44, 8, 4);
  ctx.fill();

  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 3;

  if (safeLines.length <= 1) {
    drawLabelLine(ctx, safeLines[0] || '', canvas.height / 2 + 4, '#f2f7ff', 58, 26, 452, 850);
  } else if (safeLines.length === 2) {
    drawLabelLine(ctx, safeLines[0], 78, '#f2f7ff', 54, 24, 452, 850);
    ctx.shadowBlur = 6;
    drawLabelLine(ctx, safeLines[1], 152, '#ffd479', 42, 22, 452, 800);
  } else {
    drawLabelLine(ctx, safeLines[0], 64, '#f2f7ff', 48, 22, 452, 850);
    drawLabelLine(ctx, safeLines[1], 128, '#ffd479', 38, 21, 452, 800);
    drawLabelLine(ctx, safeLines[2], 190, '#a9cfff', 32, 19, 452, 750);
  }

  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  const texture = new THREE.CanvasTexture(canvas);
  texture.encoding = THREE.sRGBEncoding;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  const material = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(3.75, safeLines.length >= 3 ? 1.78 : 1.54, 1);
  sprite.renderOrder = 10;
  return sprite;
}

function updateLabelSprite(sprite, lines) {
  if (!sprite) return;
  const replacement = makeLabelSprite(lines);
  if (sprite.material) {
    if (sprite.material.map) sprite.material.map.dispose();
    sprite.material.dispose();
  }
  sprite.material = replacement.material;
  sprite.renderOrder = replacement.renderOrder;
}

function spawnPad(index) {
  const stage = STAGES[index];
  const pos = stagePosition(index);
  const group = new THREE.Group();

  const disc = new THREE.Mesh(
    new THREE.CylinderGeometry(1.35, 1.35, 0.15, 32),
    new THREE.MeshStandardMaterial({ color: 0xffd479, emissive: 0x664400, emissiveIntensity: 0.65, roughness: 0.32 })
  );
  disc.position.y = 0.08;
  disc.receiveShadow = true;
  group.add(disc);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.46, 0.1, 12, 36),
    new THREE.MeshStandardMaterial({ color: 0xffefb8, emissive: 0x9c6f14, emissiveIntensity: 0.8, roughness: 0.18, metalness: 0.18 })
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 0.16;
  group.add(ring);
  group.userData.pulseRing = ring;

  const beacon = new THREE.Mesh(
    new THREE.CylinderGeometry(0.1, 0.1, 7, 8, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
  );
  beacon.position.y = 3.5;
  group.add(beacon);

  const sprite = makeLabelSprite([`${stage.emoji} ${stageName(stage)}`, `${fmt(stage.cost)} 💰  •  ${buildingPlankCost(index)} 🪵`]);
  sprite.position.y = 6.9;
  sprite.scale.set(4.0, 1.62, 1);
  group.add(sprite);

  group.position.set(pos.x, 0, pos.z);
  scene.add(group);
  currentPad = { index, group, beacon, sprite, pos: new THREE.Vector3(pos.x, 0, pos.z), insufficientShown: false };
}

function purchaseCurrentPad() {
  if (!currentPad) return;
  const { index, group, pos } = currentPad;
  const stage = STAGES[index];
  const woodCost = buildingPlankCost(index);
  money -= stage.cost;
  planks -= woodCost;
  scene.remove(group);
  spawnBuilding(index, 1);
  stageIndex = index + 1;
  sfx.build();
  spawnBurst(pos, 0xffd479);
  triggerShake(0.16, 0.26);
  toast(lang === 'ru' ? `🚧 Строительство началось: ${stage.emoji} ${stageName(stage)}` : `🚧 Construction started: ${stage.emoji} ${stageName(stage)}`);
  currentPad = null;
  if (stageIndex < STAGES.length) spawnPad(stageIndex);
  updateHUD();
  checkAchievements();
  save();
}

function doPrestige() {
  if (stageIndex < STAGES.length) return;
  const nextMult = 1 + (stats.prestige + 1) * 0.5;
  if (!confirm(t('prestige_confirm', { mult: nextMult.toFixed(1) }))) return;
  stats.prestige += 1;
  buildings.forEach(b => {
    scene.remove(b.mesh);
    removeUpgradePad(b);
  });
  buildings.length = 0;

  // stageIndex reaches STAGES.length (unlocking the prestige button) the instant the LAST
  // building's construction *starts*, not when it finishes -- and any building can have an
  // upgrade in progress at click time too. Without this cleanup, a building still under
  // construction/upgrading at the moment of prestige would leave its construction site
  // (crane, scaffolding, fence) running in the scene as an orphaned ghost with no building
  // behind it, since growingMeshes/constructionSites are separate arrays from `buildings`
  // and prestige only ever cleared the latter. Every entry in both is invalid now that every
  // building is gone, so clear both and their scene objects together.
  for (const build of growingMeshes) {
    if (build.site) scene.remove(build.site.group);
  }
  growingMeshes.length = 0;
  for (const site of constructionSites) {
    scene.remove(site.group);
  }
  constructionSites.length = 0;
  // Workers that were mid-"help build" on one of those now-gone sites would otherwise keep
  // playing their hammering animation forever next to an empty foundation; clearing their
  // target makes them re-roll a sensible one on the very next animate() frame.
  for (const worker of npcWorkers) {
    if (worker.workBuild) { worker.workBuild = null; worker.target = null; }
  }

  stageIndex = 0;
  money = 300;
  displayedMoney = money;
  spawnPad(0);
  sfx.prestige();
  toast(t('toast_prestige', { mult: incomeMultiplier().toFixed(1) }));
  updateHUD();
  checkAchievements();
  save();
}
document.getElementById('prestigeBtn').addEventListener('click', doPrestige);

/*  ECONOMY                                                                 */
/* ---------------------------------------------------------------------- */
function totalIncomePerSec() {
  let sum = 0;
  for (const b of buildings) {
    if (!b.underConstruction) sum += buildingIncome(b.index, b.level);
  }
  return sum * incomeMultiplier();
}

function updateHUD() {
  document.getElementById('income').textContent =
    `+${fmt(totalIncomePerSec())}/с${stats.prestige > 0 ? ` (x${incomeMultiplier().toFixed(1)})` : ''}`;
  document.getElementById('progress').textContent = `🏗️ ${stageIndex}/${STAGES.length}${buildings.some(b => b.underConstruction) ? '  🚧' : ''}`;
  document.getElementById('planks').textContent = `🪵 ${fmt(planks)}`;
  const carriedEl = document.getElementById('carriedLogs');
  if (carriedEl) carriedEl.textContent = `🪵🎒 ${carriedLogs}/${maxCarriedLogs()}`;

  const nextCard = document.getElementById('nextCard');
  const prestigeBtn = document.getElementById('prestigeBtn');
  if (stageIndex < STAGES.length) {
    const s = STAGES[stageIndex];
    nextCard.textContent = `${s.emoji} ${stageName(s)} — ${fmt(s.cost)} 💰 + ${buildingPlankCost(stageIndex)} 🪵`;
    prestigeBtn.hidden = true;
  } else {
    nextCard.textContent = t('next_complete') +
      (stats.prestige > 0 ? t('next_prestige_suffix', { n: stats.prestige }) : '');

/* ---------------------------------------------------------------------- */
/*  CONTRACTS — short optional objectives with a cash reward. Up to        */
/*  CONTRACT_SLOTS active at once; a completed slot is replaced by a fresh */
/*  contract on the next check, so there's (almost) always something      */
/*  short-term to work toward besides the main build path.                 */
/* ---------------------------------------------------------------------- */
const CONTRACT_SLOTS = 2;
const CONTRACT_TEMPLATES = [
  { kind: 'build', min: 1, max: 3,
    reward: n => 90 * n,
    ru: n => `Построить ${n} ${n === 1 ? 'здание' : n < 5 ? 'здания' : 'зданий'}`,
    en: n => `Build ${n} building${n > 1 ? 's' : ''}` },
  { kind: 'planks', min: 10, max: 30,
    reward: n => 6 * n,
    ru: n => `Произвести ${n} досок`,
    en: n => `Produce ${n} planks` },
  { kind: 'logs', min: 8, max: 20,
    reward: n => 7 * n,
    ru: n => `Срубить ${n} брёвен`,
    en: n => `Chop ${n} logs` },
  { kind: 'earn', min: 500, max: 2000,
    reward: n => Math.round(n * 0.22),
    ru: n => `Заработать ${fmt(n)} 💰`,
    en: n => `Earn ${fmt(n)} 💰` },
];

let contracts = []; // { id, kind, amount, reward, startValue }

function contractTemplate(kind) {
  return CONTRACT_TEMPLATES.find(tpl => tpl.kind === kind) || CONTRACT_TEMPLATES[0];
}

function contractProgressValue(kind) {
  switch (kind) {
    case 'build': return stats.buildingsCompleted || 0;
    case 'planks': return stats.planksEarned || 0;
    case 'logs': return stats.logsChopped || 0;
    case 'earn': return stats.totalEarned || 0;
    default: return 0;
  }
}

function generateContract() {
  const tpl = CONTRACT_TEMPLATES[Math.floor(Math.random() * CONTRACT_TEMPLATES.length)];
  const amount = Math.round(THREE.MathUtils.lerp(tpl.min, tpl.max, Math.random()));
  return {
    id: `${tpl.kind}_${Date.now()}_${Math.floor(Math.random() * 1000)}`,
    kind: tpl.kind,
    amount,
    reward: tpl.reward(amount),
    startValue: contractProgressValue(tpl.kind),
  };
}

function contractText(c) {
  const tpl = contractTemplate(c.kind);
  return lang === 'ru' ? tpl.ru(c.amount) : tpl.en(c.amount);
}

function contractProgress(c) {
  return Math.max(0, contractProgressValue(c.kind) - c.startValue);
}

function ensureContracts() {
  while (contracts.length < CONTRACT_SLOTS) contracts.push(generateContract());
}

function checkContracts() {
  let changed = false;
  for (let i = contracts.length - 1; i >= 0; i--) {
    const c = contracts[i];
    if (contractProgress(c) >= c.amount) {
      earn(c.reward);
      toast(lang === 'ru' ? `📜 Контракт выполнен! +${c.reward} 💰` : `📜 Contract done! +${c.reward} 💰`);
      sfx.achievement();
      contracts.splice(i, 1);
      changed = true;
    }
  }
  if (changed) {
    ensureContracts();
    renderContracts();
    updateHUD();
    save();
  }
}

function renderContracts() {
  const el = document.getElementById('contractsCard');
  if (!el) return;
  el.innerHTML = contracts.map(c => {
    const p = Math.min(c.amount, contractProgress(c));
    return `<div class="contractRow"><span class="ctxt">📜 ${contractText(c)}</span><span class="cprog">${fmt(p)}/${fmt(c.amount)} · +${fmt(c.reward)}💰</span></div>`;
  }).join('');
}

function regenerateSprite(oldSprite, lines, scaleY) {
  const oldScale = oldSprite.scale.clone();
  const oldPos = oldSprite.position.clone();
  oldSprite.material.map.dispose();
  oldSprite.material.dispose();
  const sprite = makeLabelSprite(lines);
  sprite.position.copy(oldPos);
  sprite.scale.copy(oldScale);
  if (scaleY) sprite.scale.y = scaleY;
  return sprite;
}

const compassEl = document.getElementById('compass');
const _padNdc = new THREE.Vector3();
function updateCompass() {
  if (!currentPad) { compassEl.style.display = 'none'; return; }
  _padNdc.set(currentPad.pos.x, 1.2, currentPad.pos.z).project(camera);
  const behind = _padNdc.z > 1;
  const onScreen = !behind && Math.abs(_padNdc.x) < 0.85 && Math.abs(_padNdc.y) < 0.8;
  if (onScreen) { compassEl.style.display = 'none'; return; }
  let x = _padNdc.x, y = _padNdc.y;
  if (behind) { x = -x; y = -y; }
  const angle = Math.atan2(y, x); // math convention: 0 = right, 90deg = up
  const margin = 0.42;
  compassEl.style.left = `${50 + Math.cos(angle) * margin * 100}%`;
  compassEl.style.top = `${50 - Math.sin(angle) * margin * 100}%`;
  compassEl.style.transform = `translate(-50%, -50%) rotate(${90 - angle * 180 / Math.PI}deg)`;
  compassEl.style.display = 'block';
}

const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
const joyVec = { x: 0, z: 0 }; // x = strafe, z = forward, both in [-1, 1]
let joyPointerId = null;
const JOY_RADIUS = 44;

function joyReset() {
  joyVec.x = 0; joyVec.z = 0;
  joyKnob.style.transform = 'translate(-50%, -50%)';
}

joyBase.addEventListener('pointerdown', (e) => {
  joyPointerId = e.pointerId;
  joyBase.setPointerCapture(e.pointerId);
  updateJoy(e);
});
joyBase.addEventListener('pointermove', (e) => {
  if (e.pointerId !== joyPointerId) return;
  updateJoy(e);
});
function endJoy(e) {
  if (e.pointerId !== joyPointerId) return;
  joyPointerId = null;
  joyReset();
}
joyBase.addEventListener('pointerup', endJoy);
joyBase.addEventListener('pointercancel', endJoy);

function updateJoy(e) {
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const dist = Math.min(Math.hypot(dx, dy), JOY_RADIUS);
  const angle = Math.atan2(dy, dx);
  dx = Math.cos(angle) * dist;
  dy = Math.sin(angle) * dist;
  joyKnob.style.transform = `translate(${dx - 26}px, ${dy - 26}px)`;
  joyVec.x = dx / JOY_RADIUS;
  joyVec.z = -dy / JOY_RADIUS; // screen up = forward
}

function save() {
  localStorage.setItem(SAVE_KEY, JSON.stringify({
    saveVersion: 4,
    money, stageIndex, stats, unlocked: [...unlockedAch], planks, carriedLogs, fieldUpgrades, contracts,
    buildings: buildings.map(b => ({ index: b.index, level: b.level })),
    player: { x: player.position.x, z: player.position.z },
  }));
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    money = typeof data.money === 'number' ? data.money : money;
    planks = typeof data.planks === 'number' ? data.planks : planks;
    carriedLogs = typeof data.carriedLogs === 'number' ? THREE.MathUtils.clamp(Math.floor(data.carriedLogs), 0, maxCarriedLogs()) : carriedLogs;
    refreshCarriedLogVisuals();
    if (data.fieldUpgrades) {
      for (const k of Object.keys(fieldUpgrades)) fieldUpgrades[k] = Math.max(0, Math.floor(data.fieldUpgrades[k] || 0));
      for (const pad of fieldUpgradePads) refreshFieldUpgradePad(pad);
    }
    carriedLogs = THREE.MathUtils.clamp(carriedLogs, 0, maxCarriedLogs());
    refreshCarriedLogVisuals();
    stageIndex = Math.min(typeof data.stageIndex === 'number' ? data.stageIndex : 0, STAGES.length);
    if (data.stats) Object.assign(stats, data.stats);
    (data.unlocked || []).forEach(id => unlockedAch.add(id));
    if (Array.isArray(data.contracts)) {
      contracts = data.contracts.filter(c => c && contractTemplate(c.kind) && typeof c.amount === 'number');
    }
    if (Array.isArray(data.buildings)) {
      data.buildings.forEach(({ index, level }) => {
        if (STAGES[index]) spawnBuilding(index, Math.min(level || 1, MAX_BUILDING_LEVEL), { grow: false });
      });
    } else {
      // Back-compat with saves from before per-building levels existed.
      for (let i = 0; i < stageIndex; i++) spawnBuilding(i, 1, { grow: false });
    }
    if (data.player) {
      player.position.set(
        THREE.MathUtils.clamp(data.player.x || 0, -GROUND_HALF + 2, GROUND_HALF - 2),
        0,
        THREE.MathUtils.clamp(data.player.z || 0, -GROUND_HALF + 2, GROUND_HALF - 2)
      );
    }
  } catch (e) {
    console.warn('save corrupted, ignoring', e);
  }
}

/* ---------------------------------------------------------------------- */
/*  MOVEMENT + ANIMATE                                                      */
/* ---------------------------------------------------------------------- */
const worldUp = new THREE.Vector3(0, 1, 0);
const camForward = new THREE.Vector3();
const camRight = new THREE.Vector3();
const moveDir = new THREE.Vector3();
let runCycle = 0;
let lastFootstepPhase = 0;

function updatePlayer(dt) {
  const prevX = player.position.x;
  const prevZ = player.position.z;

  let inZ = 0, inX = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) inZ += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) inZ -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) inX += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) inX -= 1;
  inZ += joyVec.z;
  inX += joyVec.x;
  inZ = THREE.MathUtils.clamp(inZ, -1, 1);
  inX = THREE.MathUtils.clamp(inX, -1, 1);

  const moving = Math.abs(inZ) > 0.05 || Math.abs(inX) > 0.05;
  const sprintRequested = moving && (keys.has('ShiftLeft') || keys.has('ShiftRight') || Math.hypot(joyVec.x, joyVec.z) > 0.92);
  const sprinting = sprintRequested && stamina > 0.5;
  stamina = THREE.MathUtils.clamp(stamina + (sprinting ? -STAMINA_DRAIN : STAMINA_REGEN) * dt, 0, STAMINA_MAX);
  updateStaminaBar();

  if (moving) {
    camera.getWorldDirection(camForward);
    camForward.y = 0;
    camForward.normalize();
    camRight.crossVectors(camForward, worldUp).normalize();

    moveDir.set(0, 0, 0)
      .addScaledVector(camForward, inZ)
      .addScaledVector(camRight, inX);
    if (moveDir.lengthSq() > 1) moveDir.normalize();

    const speed = PLAYER_SPEED * (sprinting ? SPRINT_MULT : 1);
    const step = speed * dt;
    let nx = THREE.MathUtils.clamp(player.position.x + moveDir.x * step, -GROUND_HALF + 1, GROUND_HALF - 1);
    let nz = THREE.MathUtils.clamp(player.position.z + moveDir.z * step, -GROUND_HALF + 1, GROUND_HALF - 1);

    // Push the player out of any building it would otherwise walk into, sliding along its edge
    // (both the spiral's buildings and the sawmill's two static buildings).
    const pushOut = (pos, radius) => {
      const cd = radius + PLAYER_RADIUS;
      const dx = nx - pos.x;
      const dz = nz - pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist < cd && dist > 0.0001) {
        const push = cd - dist;
        nx += (dx / dist) * push;
        nz += (dz / dist) * push;
      }
    };
    for (const b of buildings) pushOut(b.pos, BUILDING_RADIUS);
    for (const c of STATIC_COLLIDERS) pushOut(c.pos, c.radius);

    stats.distanceRun += Math.hypot(nx - player.position.x, nz - player.position.z);
    player.position.x = nx;
    player.position.z = nz;

    const targetYaw = Math.atan2(moveDir.x, moveDir.z);
    let delta = targetYaw - player.rotation.y;
    delta = Math.atan2(Math.sin(delta), Math.cos(delta));
    player.rotation.y += delta * Math.min(1, dt * 10);

    runCycle += dt * (sprinting ? 14 : 9);
    const swing = Math.sin(runCycle) * 0.55;
    legL.rotation.x = swing;
    legR.rotation.x = -swing;
    armL.rotation.x = -swing;
    armR.rotation.x = swing;

    const footPhase = Math.floor(runCycle / Math.PI);
    if (footPhase !== lastFootstepPhase) {
      lastFootstepPhase = footPhase;
      sfx.footstep(footPhase % 2 === 0);
    }
  } else {
    legL.rotation.x = THREE.MathUtils.lerp(legL.rotation.x, 0, dt * 8);
    legR.rotation.x = THREE.MathUtils.lerp(legR.rotation.x, 0, dt * 8);
    armL.rotation.x = THREE.MathUtils.lerp(armL.rotation.x, 0, dt * 8);
    armR.rotation.x = THREE.MathUtils.lerp(armR.rotation.x, 0, dt * 8);
  }

  // Pad trigger check
  if (currentPad) {
    const dist = Math.hypot(player.position.x - currentPad.pos.x, player.position.z - currentPad.pos.z);
    if (dist < PAD_TRIGGER_RADIUS) {
      const stage = STAGES[currentPad.index];
      const woodCost = buildingPlankCost(currentPad.index);
      if (money >= stage.cost && planks >= woodCost) {
        purchaseCurrentPad();
      } else if (!currentPad.insufficientShown) {
        currentPad.insufficientShown = true;
        sfx.error();
        const moneyMissing = Math.max(0, stage.cost - money);
        const woodMissing = Math.max(0, woodCost - planks);
        toast(lang === 'ru'
          ? `Не хватает: ${moneyMissing > 0 ? fmt(moneyMissing) + ' 💰 ' : ''}${woodMissing > 0 ? woodMissing + ' 🪵' : ''}`
          : `Missing: ${moneyMissing > 0 ? fmt(moneyMissing) + ' 💰 ' : ''}${woodMissing > 0 ? woodMissing + ' 🪵' : ''}`);
      }
    } else if (dist > PAD_TRIGGER_RADIUS * 1.6) {
      currentPad.insufficientShown = false;
    }
  }

  // Upgrade-pad trigger check — several of these can be active at once (one per built building).
  for (const b of buildings) {
    const up = b.upgradePad;
    if (!up) continue;
    const padPositions = up.positions || [up.pos];
    let nearestDist = Infinity;
    for (const p of padPositions) {
      nearestDist = Math.min(nearestDist, Math.hypot(player.position.x - p.x, player.position.z - p.z));
    }
    if (nearestDist < PAD_TRIGGER_RADIUS) {
      const cost = buildingUpgradeCost(b.index, b.level);
      const woodCost = buildingUpgradePlankCost(b.index, b.level);
      if (!b.underConstruction && money >= cost && planks >= woodCost) {
        upgradeBuilding(b);
      } else if (!b.underConstruction && !up.insufficientShown) {
        up.insufficientShown = true;
        sfx.error();
        const moneyMissing = Math.max(0, cost - money);
        const woodMissing = Math.max(0, woodCost - planks);
        toast(lang === 'ru'
          ? `Для улучшения не хватает: ${moneyMissing > 0 ? fmt(moneyMissing) + ' 💰 ' : ''}${woodMissing > 0 ? woodMissing + ' 🪵' : ''}`
          : `Upgrade missing: ${moneyMissing > 0 ? fmt(moneyMissing) + ' 💰 ' : ''}${woodMissing > 0 ? woodMissing + ' 🪵' : ''}`);
      }
    } else if (nearestDist > PAD_TRIGGER_RADIUS * 1.6) {
      up.insufficientShown = false;
    }
  }

  // Global development pads — permanent upgrade choices around the map.
  for (const pad of fieldUpgradePads) {
    const dist = Math.hypot(player.position.x - pad.cfg.pos.x, player.position.z - pad.cfg.pos.z);
    if (dist < PAD_TRIGGER_RADIUS) {
      tryPurchaseFieldUpgrade(pad);
    } else if (dist > PAD_TRIGGER_RADIUS * 1.55) {
      pad.insufficientShown = false;
    }
  }

  // OrbitControls.update() recomputes its spherical offset from (camera.position - target)
  // on every call. Since target now teleports to the player each frame, the camera must be
  // shifted by the exact same delta first — otherwise the offset (and thus distance) balloons
  // every frame until it's clamped at maxDistance, leaving the camera stranded far behind.
  camera.position.x += player.position.x - prevX;
  camera.position.z += player.position.z - prevZ;
  controls.target.set(player.position.x, PLAYER_EYE_HEIGHT, player.position.z);
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  updatePlayer(dt);
  updateTreeInteraction();
  updateSawmill(dt);
  updateSmoke(dt);
  updateAmbientLife(dt);

  for (let i = growingMeshes.length - 1; i >= 0; i--) {
    const build = growingMeshes[i];
    build.timer += dt;
    const t = Math.min(1, build.timer / build.duration);
    const phase = constructionPhaseIndex(t);
    build.phase = phase;

    // The finished building no longer grows from a paper-thin point. It only appears once
    // the structural shell exists, then gains height as walls/roof/finishing are completed.
    if (phase < 3) {
      build.mesh.visible = false;
    } else {
      build.mesh.visible = true;
      let sy = 0.48;
      let sxz = 0.96;
      if (phase === 3) {
        const k = THREE.MathUtils.clamp((t - 0.52) / 0.20, 0, 1);
        sy = 0.38 + 0.28 * k;
        sxz = 0.95 + 0.02 * k;
      } else if (phase === 4) {
        const k = THREE.MathUtils.clamp((t - 0.72) / 0.16, 0, 1);
        sy = 0.66 + 0.22 * k;
        sxz = 0.97 + 0.02 * k;
      } else {
        const k = THREE.MathUtils.clamp((t - 0.88) / 0.12, 0, 1);
        sy = 0.88 + 0.12 * k;
        sxz = 0.99 + 0.01 * k;
      }
      build.mesh.scale.set(sxz, sy, sxz);
    }

    if (build.site) setConstructionPhaseVisual(build.site, phase, t);

    if (t >= 1) {
      build.mesh.visible = true;
      build.mesh.scale.set(1, 1, 1);
      build.entry.underConstruction = false;
      if (!build.upgrading) stats.buildingsCompleted += 1;
      if (build.entry.level < MAX_BUILDING_LEVEL && !build.entry.upgradePad) spawnUpgradePad(build.entry);
      sfx.build();
      spawnBurst(build.entry.pos, build.upgrading ? 0x5ab0ff : 0xffd479);
      toast(lang === 'ru'
        ? `✅ ${stageName(STAGES[build.entry.index])} готов${build.upgrading ? ' — уровень ' + build.entry.level : ''}`
        : `✅ ${stageName(STAGES[build.entry.index])} complete${build.upgrading ? ' — level ' + build.entry.level : ''}`);
      updateHUD();
      save();
      growingMeshes.splice(i, 1);
    }
  }
  updateConstructionSites(dt);

  if (currentPad) {
    currentPad.beacon.material.opacity = 0.25 + Math.sin(performance.now() / 300) * 0.12;
    currentPad.group.rotation.y += dt * 0.6;
    if (currentPad.group.userData.pulseRing) {
      const k = 1 + Math.sin(performance.now() / 220) * 0.05;
      currentPad.group.userData.pulseRing.scale.set(k, k, k);
    }
  }
  for (const b of buildings) {
    if (b.upgradePad) {
      const groups = b.upgradePad.groups || [b.upgradePad.group];
      groups.forEach((g, gi) => {
        g.rotation.y += dt * (0.72 + gi * 0.12);
      });
      const rings = b.upgradePad.rings || [];
      rings.forEach((ring, ri) => {
        const k = 1 + Math.sin(performance.now() / 240 + b.index + ri * 0.8) * 0.05;
        ring.scale.set(k, k, k);
      });
    }
  }
  if (sawmillDropoff) {
    sawmillDropoff.group.rotation.y += dt * 0.45;
    const k = 1 + Math.sin(performance.now() / 210) * 0.06;
    sawmillDropoff.ring.scale.set(k, k, k);
  }
  fieldUpgradePads.forEach((pad, i) => {
    pad.group.rotation.y += dt * (0.35 + i * 0.04);
    const k = 1 + Math.sin(performance.now() / 230 + i) * 0.055;
    pad.ring.scale.set(k, k, k);
  });

  clouds.forEach(c => {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > GROUND_HALF * 1.35) c.position.x = -GROUND_HALF * 1.35;
  });

  for (let i = particleBursts.length - 1; i >= 0; i--) {
    const p = particleBursts[i];
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.points);
      p.points.geometry.dispose();
      p.points.material.dispose();
      particleBursts.splice(i, 1);
      continue;
    }
    const pos = p.points.geometry.attributes.position;
    for (let j = 0; j < p.velocities.length; j++) {
      const v = p.velocities[j];
      v.y -= 9 * dt;
      pos.array[j * 3] += v.x * dt;
      pos.array[j * 3 + 1] += v.y * dt;
      pos.array[j * 3 + 2] += v.z * dt;
    }
    pos.needsUpdate = true;
    p.points.material.opacity = Math.max(0, p.life / p.maxLife);
  }

  updateCompass();

  displayedMoney += (money - displayedMoney) * Math.min(1, dt * 8);
  if (Math.abs(money - displayedMoney) < 0.5) displayedMoney = money;
  document.getElementById('money').textContent = fmt(displayedMoney);

  controls.update();

  // Camera shake is a purely visual jitter applied to the already-resolved camera position;
  // it's undone before the next frame so it never pollutes the follow-cam's base position.
  camera.position.sub(shakeOffset);
  if (shakeTime > 0) {
    shakeTime -= dt;
    const s = shakeStrength * Math.max(0, shakeTime);
    shakeOffset.set((Math.random() - 0.5) * s, (Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    camera.position.add(shakeOffset);
  } else {
    shakeOffset.set(0, 0, 0);
  }

  renderer.render(scene, camera);
  if (!bootCompleted) {
    bootCompleted = true;
    clearTimeout(bootWatchdog);
    requestAnimationFrame(() => bootSplash.classList.add('hide'));
  }
}

/* ---------------------------------------------------------------------- */
/*  INIT                                                                   */
/* ---------------------------------------------------------------------- */
load();
ensureContracts();
applyLanguage();
if (stageIndex < STAGES.length && !currentPad) spawnPad(stageIndex);

// Position the camera behind the player, facing the next objective pad (or a sensible
// default direction once everything is built), so new/returning players immediately see where to run.
{
  const aimIndex = Math.min(stageIndex, STAGES.length - 1);
  const aimPos = stagePosition(aimIndex);
  const aimDir = new THREE.Vector3(aimPos.x - player.position.x, 0, aimPos.z - player.position.z);
  if (aimDir.lengthSq() < 0.0001) aimDir.set(0, 0, -1); else aimDir.normalize();
  camera.position.set(
    player.position.x - aimDir.x * CAM_DEFAULT_DIST,
    PLAYER_EYE_HEIGHT + 3.2,
    player.position.z - aimDir.z * CAM_DEFAULT_DIST
  );
  controls.target.set(player.position.x, PLAYER_EYE_HEIGHT, player.position.z);
  controls.update();
}

updateHUD();
updateAchBadge();
checkAchievements();
if (!localStorage.getItem(HINT_KEY)) hintOverlay.classList.add('show');
animate();
</script>
