(function(){
  function showBootError(message){
    var el=document.getElementById('bootError');
    if(!el){
      el=document.createElement('div'); el.id='bootError';
      el.style.cssText='position:fixed;inset:0;z-index:99999;background:#0b0f14;color:#fff;padding:28px;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line';
      document.body.appendChild(el);
    }
    el.textContent=message;
  }
  window.__showTycoonBootError=showBootError;
  window.addEventListener('error',function(e){
    var msg = !window.THREE
      ? 'Не удалось загрузить 3D-движок.\nПроверь интернет и открой файл через Web Viewer / встроенный браузер Documents.'
      : 'Ошибка запуска игры:\n' + (e.message || 'Неизвестная ошибка') + (e.lineno ? '\nСтрока: ' + e.lineno : '');
    showBootError(msg);
  });
  window.addEventListener('unhandledrejection',function(e){
    var reason = e.reason && (e.reason.stack || e.reason.message || String(e.reason));
    showBootError('Ошибка запуска игры:\n' + (reason || 'Необработанная ошибка Promise'));
  });
})();
</script>

<script>
if (!window.THREE) { window.__showTycoonBootError && window.__showTycoonBootError('Не удалось загрузить Three.js.'); throw new Error('THREE unavailable'); }

const EMBEDDED_ASSETS = {"grass": "assets_v19/grass.jpg", "dirt": "assets_v19/dirt.jpg", "asphalt": "assets_v19/asphalt.jpg", "concrete": "assets_v19/concrete.jpg", "metal": "assets_v19/metal.jpg", "wood": "assets_v19/wood.jpg", "brick": "assets_v19/brick.jpg", "roof": "assets_v19/roof.jpg", "siding": "assets_v19/siding.jpg", "splash": "assets_v19/splash.png"};

const embeddedTextureCache = new Map();
function embeddedTexture(name, repeatX = 1, repeatY = 1) {
  const key = `${name}:${repeatX}:${repeatY}`;
  if (embeddedTextureCache.has(key)) return embeddedTextureCache.get(key);
  const tex = new THREE.TextureLoader().load(EMBEDDED_ASSETS[name]);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeatX, repeatY);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 8;
  embeddedTextureCache.set(key, tex);
  return tex;
}

const bootSplash = document.getElementById('bootSplash');
bootSplash.style.backgroundImage = `url(${EMBEDDED_ASSETS.splash})`;
let bootCompleted = false;
const bootWatchdog = setTimeout(() => {
  if (!bootCompleted && window.__showTycoonBootError) {
    window.__showTycoonBootError('Игра не завершила запуск за 12 секунд.\nЕсли ниже появится конкретная ошибка — пришли её мне.');
  }
}, 12000);

// Boot-critical texture caches: initialize before scene materials use them.
const materialTextureCache = new Map();
let windowTexture = null;

/* ---------------------------------------------------------------------- */
/*  CONFIG                                                                 */
/* ---------------------------------------------------------------------- */
const SAVE_KEY = 'tycoon3d_save_v3';
const MUTE_KEY = 'tycoon3d_muted';
const HINT_KEY = 'tycoon3d_seen_hint_v4';

const GROUND_HALF = 70;
const PLAYER_SPEED = 7.2;       // units / sec
const SPRINT_MULT = 1.7;
const STAMINA_MAX = 100;
const STAMINA_DRAIN = 40;       // per second while sprinting
const STAMINA_REGEN = 18;       // per second while not sprinting

const PAD_TRIGGER_RADIUS = 2.0;
const CAM_MIN_DIST = 3.5;
const CAM_MAX_DIST = 20;
const CAM_DEFAULT_DIST = 9;

const PLAYER_RADIUS = 0.4;
const BUILDING_RADIUS = 1.5;      // collision footprint of a constructed building
const BUILDING_OFFSET = 2.7;      // building sits this far past its pad, so it never overlaps the player standing on the pad
const UPGRADE_PAD_OFFSET = 2.15;  // an upgrade pad sits this far to the side of its building
const MAX_BUILDING_LEVEL = 5;     // 1 = just built; four upgrade levels on top of that

// Spiral layout: each stage sits further from spawn, so the base visibly grows outward.
const SPIRAL_BASE_RADIUS = 7;
const SPIRAL_RADIUS_STEP = 4.6;
const SPIRAL_ANGLE_STEP = 0.95; // radians per stage

const STAGES = [
  { name: 'Дом',            nameEn: 'House',           cost: 50,     plankCost: 0,  incomeAdd: 1,   emoji: '🏠', color: 0x6fcf6f, height: 2.4,  archetype: 'house',     baseSize: 2.2 },

  { name: 'Склад',          nameEn: 'Warehouse',       cost: 900,    plankCost: 5,  incomeAdd: 8,   emoji: '📦', color: 0x9aa5b1, height: 2.4,  archetype: 'warehouse', baseSize: 2.2 },

function earn(amount) {
  money += amount;
  if (amount > 0) stats.totalEarned += amount;

function incomeMultiplier() {
  return 1 + stats.prestige * 0.5;
}

function fmt(n) {
  n = Math.floor(n);
  if (n >= 1000000) return (n / 1000000).toFixed(2).replace(/\.?0+$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return n.toLocaleString('ru-RU');
}

function stagePosition(i) {
  const angle = i * SPIRAL_ANGLE_STEP;
  const radius = SPIRAL_BASE_RADIUS + i * SPIRAL_RADIUS_STEP;
  return new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
}

// The building itself sits a bit further out than its pad, so it never appears exactly where
// the player was standing (and never overlaps the player once it becomes solid).
function buildingPosition(i) {
  const pad = stagePosition(i);
  const dir = pad.clone().normalize();
  return pad.addScaledVector(dir, BUILDING_OFFSET);
}

// An upgrade pad sits to the side of its building, clear of both the building's own
// footprint and the main path.
function upgradePadPosition(buildingPos, i) {
  const dir = stagePosition(i).normalize();
  const tangent = new THREE.Vector3(-dir.z, 0, dir.x);
  return buildingPos.clone().addScaledVector(tangent, UPGRADE_PAD_OFFSET);
}

function buildingIncome(stageIdx, level) {
  return STAGES[stageIdx].incomeAdd * level;
}

function buildingUpgradeCost(stageIdx, level) {
  // cost to go from `level` to `level + 1`
  return Math.round(STAGES[stageIdx].cost * 0.55 * level);
}

function buildingPlankCost(stageIdx) {
  return Math.max(0, STAGES[stageIdx].plankCost || 0);
}

function buildingUpgradePlankCost(stageIdx, level) {
  const base = Math.max(1, buildingPlankCost(stageIdx));
  return Math.max(1, Math.ceil(base * 0.45 * level));
}

function constructionDuration(stageIdx, level = 1, upgrading = false) {
  const base = 3.6 + stageIdx * 0.26 + (level - 1) * 0.46;
  const speedMult = Math.pow(0.84, fieldUpgrades.construction || 0);
  return Math.max(2.2, Math.min(7.2, base + (upgrading ? 0.6 : 0)) * speedMult);
}

let audioCtx = null;
let muted = localStorage.getItem(MUTE_KEY) === '1';

function ensureAudio() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) audioCtx = new Ctx();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep(freq, start, duration, type = 'sine', gain = 0.12) {
  const ctx = ensureAudio();
  if (!ctx || muted) return;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.value = 0;
  osc.connect(g).connect(ctx.destination);
  const t0 = ctx.currentTime + start;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

/* ---------------------------------------------------------------------- */
/*  ROAD NETWORK — service vehicles route along the actual road centerline */
/*  (this same spiral chain the road segments above are built from)       */
/*  instead of cutting one straight line through the lawn via a single    */
/*  map-center waypoint. `pathPoints` is a simple chain (index 0 = plaza  */
/*  center, index i = stagePosition(i-1)), so routing between any two     */
/*  points is just slicing it in the right direction -- no graph search   */
/*  needed. (Spec section 16.)                                             */
/* ---------------------------------------------------------------------- */
const ROAD_NODES = pathPoints.map(p => p.clone());

function nearestRoadNodeIndex(pos) {
  let best = 0, bestD = Infinity;
  for (let i = 0; i < ROAD_NODES.length; i++) {
    const d = ROAD_NODES[i].distanceToSquared(pos);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

function buildRoadRoute(fromPos, toPos) {
  const fromIdx = nearestRoadNodeIndex(fromPos);
  const toIdx = nearestRoadNodeIndex(toPos);
  const route = [fromPos.clone()];
  const step = fromIdx <= toIdx ? 1 : -1;
  for (let i = fromIdx; i !== toIdx + step; i += step) route.push(ROAD_NODES[i].clone());
  route.push(toPos.clone());
  return route;
}

function makeSkyTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 1024);
  g.addColorStop(0, '#79bff1');
  g.addColorStop(0.45, '#a8d7fb');
  g.addColorStop(0.74, '#d7edff');
  g.addColorStop(1, '#f1f8ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 1800; i++) {
    const x = Math.random() * 1024;
    const y = Math.random() * 520;
    const r = Math.random() * 2.4;
    ctx.fillStyle = `rgba(255,255,255,${0.03 + Math.random() * 0.05})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

function makeBush() {
  const bush = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x3f8a50, roughness: 0.92 });
  for (let i = 0; i < 3; i++) {
    const part = new THREE.Mesh(new THREE.SphereGeometry(0.45 + Math.random() * 0.15, 8, 8), mat);
    part.position.set((i - 1) * 0.34, 0.38 + Math.random() * 0.08, (Math.random() - 0.5) * 0.25);
    part.castShadow = true;
    part.receiveShadow = true;
    bush.add(part);
  }
  return bush;
}

// Tree variety (VISION spec section 7 -- "the forest shouldn't look like 50 identical
// cones"). Two species with genuinely different silhouettes (conifer: stacked cones,
// like the original single tree shape; deciduous: a round leafy canopy on a short thick
// trunk) plus a size tier that scales trunk and canopy *independently* rather than just
// uniformly scaling the whole group, so a "young" tree reads as spindly, not just small.
// Both still return a plain THREE.Group with userData.harvestableTree = true, so the
// chop/carry/regrow system (which just does group.scale.setScalar(...) on whatever it's
// given) needs no changes at all.
const TREE_SIZES = {
  young:  { trunkR: 0.62, trunkH: 0.68, canopy: 0.66 },
  normal: { trunkR: 1.0,  trunkH: 1.0,  canopy: 1.0 },
  large:  { trunkR: 1.3,  trunkH: 1.22, canopy: 1.2 },
};

function makeConiferTree(sizeKey) {
  const s = TREE_SIZES[sizeKey];
  const group = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2f, roughness: 0.92 });
  const trunkH = 1.95 * s.trunkH;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16 * s.trunkR, 0.24 * s.trunkR, trunkH, 8), trunkMat);
  trunk.position.y = trunkH / 2;
  trunk.castShadow = true;
  group.add(trunk);

  for (let i = 0; i < 3; i++) {
    const branch = new THREE.Mesh(new THREE.CylinderGeometry(0.035 * s.trunkR, 0.05 * s.trunkR, 0.62 * s.canopy, 7), trunkMat);
    branch.position.set((i - 1) * 0.18, trunkH * 0.75 + i * 0.16 * s.canopy, i % 2 ? 0.12 : -0.12);
    branch.rotation.z = (i - 1) * 0.45;
    branch.rotation.x = i % 2 ? 0.32 : -0.24;
    branch.castShadow = true;
    group.add(branch);
  }

  const leafColors = [0x2f7d4a, 0x3a8f55, 0x2a7142, 0x468b54];
  const canopyBase = trunkH * 0.91;
  for (let i = 0; i < 4; i++) {
    const leaves = new THREE.Mesh(
      new THREE.ConeGeometry((1.1 - i * 0.16) * s.canopy, 1.18 * s.canopy, 9),
      new THREE.MeshStandardMaterial({ color: leafColors[(i + Math.floor(Math.random() * leafColors.length)) % leafColors.length], roughness: 0.86 })
    );
    leaves.position.y = canopyBase + i * 0.38 * s.canopy;
    leaves.castShadow = true;
    group.add(leaves);
  }

  const topPuff = new THREE.Mesh(
    new THREE.SphereGeometry(0.42 * s.canopy, 9, 9),
    new THREE.MeshStandardMaterial({ color: leafColors[Math.floor(Math.random() * leafColors.length)], roughness: 0.88 })
  );
  topPuff.position.y = canopyBase + 4 * 0.38 * s.canopy - 0.24 * s.canopy;
  topPuff.castShadow = true;
  group.add(topPuff);
  return group;
}

function makeDeciduousTree(sizeKey) {
  const s = TREE_SIZES[sizeKey];
  const group = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7a5a38, roughness: 0.9 });
  const trunkH = 1.15 * s.trunkH;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15 * s.trunkR, 0.26 * s.trunkR, trunkH, 8), trunkMat);
  trunk.position.y = trunkH / 2;
  trunk.castShadow = true;
  group.add(trunk);

  // A short fork of two leaning limbs instead of the conifer's straight central trunk,
  // so the deciduous silhouette reads differently even before the canopy is added.
  for (const side of [-1, 1]) {
    const limb = new THREE.Mesh(new THREE.CylinderGeometry(0.07 * s.trunkR, 0.11 * s.trunkR, 0.55 * s.canopy, 7), trunkMat);
    limb.position.set(side * 0.16 * s.canopy, trunkH + 0.2 * s.canopy, 0);
    limb.rotation.z = side * 0.5;
    limb.castShadow = true;
    group.add(limb);
  }

  // Round, leafy canopy: a cluster of overlapping spheres (same technique as makeBush(),
  // scaled up) instead of stacked cones -- this is the silhouette that actually reads as
  // "deciduous" rather than "small pine."
  const canopyColors = [0x5aa447, 0x6fb552, 0x4f9640, 0x7abd5c];
  const canopyY = trunkH + 0.55 * s.canopy;
  const puffs = 5;
  for (let i = 0; i < puffs; i++) {
    const a = (i / puffs) * Math.PI * 2;
    const r = 0.34 * s.canopy;
    const puff = new THREE.Mesh(
      new THREE.SphereGeometry((0.55 + Math.random() * 0.16) * s.canopy, 8, 8),
      new THREE.MeshStandardMaterial({ color: canopyColors[i % canopyColors.length], roughness: 0.88 })
    );
    puff.position.set(Math.cos(a) * r, canopyY + (i === 0 ? 0.28 * s.canopy : 0), Math.sin(a) * r);
    puff.castShadow = true;
    group.add(puff);
  }
  return group;
}

function makeTree(opts = {}) {
  const species = opts.species || (Math.random() < 0.62 ? 'conifer' : 'deciduous');
  const sizeRoll = Math.random();
  const sizeKey = opts.size || (sizeRoll < 0.2 ? 'young' : (sizeRoll < 0.85 ? 'normal' : 'large'));
  const group = species === 'deciduous' ? makeDeciduousTree(sizeKey) : makeConiferTree(sizeKey);

  if (Math.random() < 0.7) {
    const bush = makeBush();
    bush.position.set((Math.random() - 0.5) * 0.5, 0, (Math.random() - 0.5) * 0.5);
    bush.scale.setScalar(0.62 + Math.random() * 0.18);
    group.add(bush);
  }
  group.userData.harvestableTree = true;
  group.userData.treeSpecies = species;
  return group;
}

function makeRock() {
  const rock = new THREE.Mesh(

  rock.castShadow = true;

  rock.scale.y = 0.7 + Math.random() * 0.4;
  rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
  return rock;
}

function makeLamp() {
  const group = new THREE.Group();
  const pole = new THREE.Mesh(

(function scatterScenery() {
  const stagePositions = STAGES.map((_, i) => stagePosition(i));
  const MIN_CLEAR = 3.7;
  let placed = 0, attempts = 0;
  while (placed < 110 && attempts < 900) {
    attempts++;
    const x = (Math.random() - 0.5) * GROUND_HALF * 1.9;
    const z = (Math.random() - 0.5) * GROUND_HALF * 1.9;
    if (Math.hypot(x, z) < 5.5) continue;
    let tooClose = false;
    for (const p of stagePositions) {
      if (Math.hypot(x - p.x, z - p.z) < MIN_CLEAR) { tooClose = true; break; }
    }
    if (tooClose) continue;
    const r = Math.random();
    const deco = r < 0.5 ? makeTree() : (r < 0.75 ? makeRock() : makeBush());
    deco.position.set(x, 0, z);
    const scale = 0.75 + Math.random() * 0.75;
    deco.scale.set(scale, scale, scale);
    deco.rotation.y = Math.random() * Math.PI * 2;
    scene.add(deco);
    placed++;
  }

  for (let i = 0; i < pathPoints.length; i += 2) {
    const p = pathPoints[i];
    const side = i % 4 === 0 ? 1 : -1;
    const dir = p.clone().normalize();
    if (dir.lengthSq() < 0.001) continue;
    const tangent = new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(2.15 * side);
    const lamp = makeLamp();
    lamp.position.set(p.x + tangent.x, 0, p.z + tangent.z);
    lamp.rotation.y = Math.atan2(-tangent.x, -tangent.z);
    scene.add(lamp);
  }
})();

function fieldUpgradeCosts(cfg) {
  const level = fieldUpgrades[cfg.key] || 0;
  const next = level + 1;
  return { money: Math.round(cfg.money * next * 1.35), wood: Math.round(cfg.wood * next) };
}

function fieldUpgradeLabelLines(cfg) {
  const level = fieldUpgrades[cfg.key] || 0;
  if (level >= cfg.max) {
    return [`${cfg.emoji} ${lang === 'ru' ? cfg.ru : cfg.en}`, lang === 'ru' ? 'МАКС. УРОВЕНЬ' : 'MAX LEVEL'];
  }
  const c = fieldUpgradeCosts(cfg);
  return [`${cfg.emoji} ${lang === 'ru' ? cfg.ru : cfg.en} ${level + 1}/${cfg.max}`, `${fmt(c.money)} 💰  •  ${c.wood} 🪵`];
}

function refreshFieldUpgradePad(pad) {

function tryPurchaseFieldUpgrade(pad) {
  const cfg = pad.cfg;
  const level = fieldUpgrades[cfg.key] || 0;
  if (level >= cfg.max) return;
  const cost = fieldUpgradeCosts(cfg);
  if (money < cost.money || planks < cost.wood) {
    if (!pad.insufficientShown) {
      pad.insufficientShown = true;
      sfx.error();
      toast(lang === 'ru'
        ? `Не хватает для улучшения: ${Math.max(0, cost.money - money) > 0 ? fmt(Math.max(0, cost.money - money)) + ' 💰 ' : ''}${Math.max(0, cost.wood - planks) > 0 ? Math.max(0, cost.wood - planks) + ' 🪵' : ''}`
        : `Upgrade missing: ${Math.max(0, cost.money - money) > 0 ? fmt(Math.max(0, cost.money - money)) + ' 💰 ' : ''}${Math.max(0, cost.wood - planks) > 0 ? Math.max(0, cost.wood - planks) + ' 🪵' : ''}`);
    }
    return;
  }
  money -= cost.money;
  planks -= cost.wood;
  fieldUpgrades[cfg.key] = level + 1;
  if (cfg.key === 'carry' && carriedLogs > maxCarriedLogs()) carriedLogs = maxCarriedLogs();
  refreshCarriedLogVisuals();
  refreshFieldUpgradePad(pad);
  spawnBurst(cfg.pos, 0x8f7cff);
  sfx.build();
  toast(lang === 'ru'
    ? `⬆️ ${cfg.ru}: уровень ${fieldUpgrades[cfg.key]}`
    : `⬆️ ${cfg.en}: level ${fieldUpgrades[cfg.key]}`);
  updateHUD();
  save();
}

function deliverCarriedLogs() {
  if (carriedLogs <= 0) return;
  const count = carriedLogs;
  carriedLogs = 0;
  refreshCarriedLogVisuals();
  for (let i = 0; i < count; i++) {
    const start = SAWMILL_DROPOFF_POS.clone();
    start.x += (i - (count - 1) / 2) * 0.2;
    spawnLog(start, i * 0.28);

  spawnBurst(SAWMILL_DROPOFF_POS, 0xffcf74);

function compactActionText(text) {
  if (window.innerWidth > 680) return text;
  return String(text)
    .replace('Нажми E / Пробел, чтобы ', '')
    .replace('Press E / Space to ', '')
    .replace('Переноска заполнена — ', '')
    .replace('Carry capacity full — ', '');
}

function updateTreeInteraction() {
  let best = null;
  let bestDist = TREE_INTERACT_RADIUS;
  for (const tree of sourceTrees) {
    if (tree.state !== 'grown') continue;
    const dist = Math.hypot(player.position.x - tree.mesh.position.x, player.position.z - tree.mesh.position.z);
    if (dist < bestDist) {
      best = tree;
      bestDist = dist;
    }
  }
  nearbyHarvestTree = best;
  nearSawmillDropoff = Math.hypot(player.position.x - SAWMILL_DROPOFF_POS.x, player.position.z - SAWMILL_DROPOFF_POS.z) < 2.2;

  const actionPrompt = document.getElementById('actionPrompt');
  const actionBtn = document.getElementById('actionBtn');

  if (nearSawmillDropoff && carriedLogs > 0) {
    actionPrompt.textContent = compactActionText(t('action_deliver_logs'));
    actionPrompt.classList.add('show');
    actionBtn.hidden = false;
    actionBtn.textContent = t('action_deliver_button');
  } else if (nearbyHarvestTree) {
    actionPrompt.textContent = compactActionText(carriedLogs >= maxCarriedLogs() ? t('action_carry_full') : t('action_chop_tree'));
    actionPrompt.classList.add('show');
    actionBtn.hidden = carriedLogs >= maxCarriedLogs();
    actionBtn.textContent = t('action_button');
  } else {
    actionPrompt.classList.remove('show');
    actionBtn.hidden = true;
  }

  if (interactRequested) {
    if (nearSawmillDropoff && carriedLogs > 0) deliverCarriedLogs();
    else if (nearbyHarvestTree) tryHarvestTree();
  }
  interactRequested = false;
}

function updateSawmill(dt) {
  if (sawmillBlade) sawmillBlade.rotation.z += dt * 12;

  // Once the company has its first building, the sawmill begins a slow automatic cycle.
  // Manual chopping still gives extra planks and remains the fastest way to gather wood.
  if (stageIndex >= 1) {
    sawmillAutoTimer += dt;
    if (sawmillAutoTimer >= sawmillAutoInterval()) {
      sawmillAutoTimer -= sawmillAutoInterval();
      const produced = 1 + Math.floor(stats.prestige / 3);
      planks += produced;
      stats.planksEarned += produced;
      spawnBurst(SAWMILL_POS, 0xc9a06a);
      sfx.plank();
      updateHUD();
      checkAchievements();
      save();
    }
  }
  if (conveyorData) {
    for (const slat of conveyorSlats) {
      slat.offset = (slat.offset + dt * 2.8) % conveyorData.length;
      const pos = conveyorData.flatStart.clone().addScaledVector(conveyorData.dir, slat.offset);
      slat.mesh.position.set(pos.x, 0.24, pos.z);
      slat.mesh.rotation.y = conveyorData.angle;
    }
  }

  for (const tree of sourceTrees) {
    if (tree.state === 'chopping') {
      tree.timer += dt;
      if (tree.timer < CHOP_FALL_TIME) {
        tree.mesh.rotation.z = (tree.timer / CHOP_FALL_TIME) * (Math.PI * 0.46);
      } else if (tree.timer < CHOP_FALL_TIME + CHOP_SHRINK_TIME) {
        const k = (tree.timer - CHOP_FALL_TIME) / CHOP_SHRINK_TIME;
        tree.mesh.scale.setScalar(tree.baseScale * Math.max(0.001, 1 - k));
      } else {
        if (!tree.logSpawned) {
          if (carriedLogs < maxCarriedLogs()) {
            carriedLogs += 1;
            stats.logsChopped += 1;
            refreshCarriedLogVisuals();
            updateHUD();
            save();
          }
          tree.logSpawned = true;
        }
        tree.state = 'regrowing';
        tree.timer = 0;
        tree.mesh.rotation.z = 0;
        tree.mesh.scale.setScalar(0.001);
      }
    } else if (tree.state === 'regrowing') {
      tree.timer += dt;
      const k = Math.min(1, tree.timer / REGROW_TIME);
      tree.mesh.scale.setScalar(tree.baseScale * k);
      if (k >= 1) {
        tree.state = 'grown';
        tree.logSpawned = false;
      }
    } else {
      const pulse = tree === nearbyHarvestTree ? 1.06 + Math.sin(performance.now() / 140 + tree.pulse) * 0.03 : 1;
      tree.mesh.scale.setScalar(tree.baseScale * pulse);
      tree.mesh.rotation.z = 0;
    }
  }

  for (let i = logsInTransit.length - 1; i >= 0; i--) {
    const log = logsInTransit[i];
    if (log.delay > 0) {
      log.delay -= dt;
      continue;
    }
    const segCount = log.path.length - 1;
    const segDuration = WOOD_TRAVEL_TIME / segCount;
    log.t += dt / segDuration;

    while (log.t >= 1) {
      log.t -= 1;
      log.segment += 1;
      if (log.segment >= segCount) {
        scene.remove(log.mesh);
        logsInTransit.splice(i, 1);
        const produced = planksPerDeliveredLog();
        planks += produced;
        stats.planksEarned += produced;
        spawnBurst(SAWMILL_POS, 0xc9a06a);
        sfx.plank();
        updateHUD();
        checkAchievements();
        save();
        break;
      }
    }
    if (!logsInTransit.includes(log)) continue;
    const a = log.path[log.segment];
    const b = log.path[log.segment + 1];
    log.mesh.position.lerpVectors(a, b, log.t);
    log.mesh.position.y = 0.34;
    const dir = new THREE.Vector3().subVectors(b, a);
    log.mesh.rotation.z = Math.PI / 2;
    log.mesh.rotation.y = Math.atan2(dir.x, dir.z);
    log.mesh.rotation.x += dt * 3.4;
  }
}

/* ---------------------------------------------------------------------- */
/*  BUILDINGS & PADS                                                       */
/* ---------------------------------------------------------------------- */
/* ---------------------------------------------------------------------- */
/*  BUILDING ARCHETYPES — each STAGES entry picks a silhouette by         */
/*  `archetype` so buildings read as what they are, not just tinted boxes. */
/* ---------------------------------------------------------------------- */

function shadeColor(hex, amount = 0) {
  const r = Math.max(0, Math.min(255, ((hex >> 16) & 255) + amount));
  const g = Math.max(0, Math.min(255, ((hex >> 8) & 255) + amount));
  const b = Math.max(0, Math.min(255, (hex & 255) + amount));
  return `rgb(${r|0}, ${g|0}, ${b|0})`;
}

function makeTextureCanvas(size = 256, painter) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  painter(ctx, size);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

function textureKey(prefix, color) {
  return `${prefix}_${color.toString(16)}`;
}

function getWallTexture(color) {
  const key = textureKey('wall', color);
  if (materialTextureCache.has(key)) return materialTextureCache.get(key);
  const tex = makeTextureCanvas(512, (ctx, s) => {
    const grad = ctx.createLinearGradient(0, 0, s, s);
    grad.addColorStop(0, shadeColor(color, 26));
    grad.addColorStop(0.6, shadeColor(color, 0));
    grad.addColorStop(1, shadeColor(color, -22));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, s, s);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    for (let y = 0; y <= s; y += 48) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(s, y); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    for (let x = 18; x <= s; x += 68) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, s); ctx.stroke();
    }
    for (let i = 0; i < 5500; i++) {
      const x = Math.random() * s, y = Math.random() * s;
      const a = 0.02 + Math.random() * 0.045;
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fillRect(x, y, 1 + Math.random() * 2, 1 + Math.random() * 2);
      ctx.fillStyle = `rgba(0,0,0,${a * 0.7})`;
      ctx.fillRect(x + 1, y + 1, 1, 1);
    }
  });
  tex.repeat.set(1.4, 1.4);
  materialTextureCache.set(key, tex);
  return tex;
}

function getConcreteTexture(color) {
  const key = 'embedded_concrete';
  if (!materialTextureCache.has(key)) materialTextureCache.set(key, embeddedTexture('concrete', 2.2, 2.2));
  return materialTextureCache.get(key);
}

function getRoofTexture(color) {
  const key = 'embedded_roof';
  if (!materialTextureCache.has(key)) materialTextureCache.set(key, embeddedTexture('roof', 3.2, 3.2));
  return materialTextureCache.get(key);
}

function getMetalTexture(color) {
  const key = 'embedded_metal';

  return materialTextureCache.get(key);
}

function getWoodTexture(color) {

  if (!materialTextureCache.has(key)) materialTextureCache.set(key, embeddedTexture('wood', 2.6, 2.6));
  return materialTextureCache.get(key);
}

function getGlassTexture() {
  const key = 'glass';
  if (materialTextureCache.has(key)) return materialTextureCache.get(key);
  const tex = makeTextureCanvas(256, (ctx, s) => {
    const grad = ctx.createLinearGradient(0, 0, 0, s);
    grad.addColorStop(0, '#9fe0ff');
    grad.addColorStop(1, '#305f80');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, s, s);
    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    for (let x = 0; x <= s; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, s); ctx.stroke(); }
    for (let y = 0; y <= s; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(s, y); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.fillRect(16, 0, 18, s);
  });
  materialTextureCache.set(key, tex);
  return tex;
}

function getWindowTexture() {
  if (windowTexture) return windowTexture;
  const c = document.createElement('canvas');
  c.width = 128; c.height = 256;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#467aa2');
  grad.addColorStop(1, '#20364b');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 256);
  for (let y = 10; y < 256; y += 32) {
    for (let x = 8; x < 128; x += 28) {
      ctx.fillStyle = '#c8ecff';
      ctx.fillRect(x, y, 16, 19);
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(x, y, 16, 3);
      ctx.fillStyle = 'rgba(33,55,76,0.58)';
      ctx.fillRect(x + 6, y + 4, 2, 15);
    }
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.14)';
  for (let x = 0; x <= 128; x += 28) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke(); }
  for (let y = 0; y <= 256; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(128, y); ctx.stroke(); }
  windowTexture = new THREE.CanvasTexture(c);
  windowTexture.wrapS = THREE.RepeatWrapping;
  windowTexture.wrapT = THREE.RepeatWrapping;
  windowTexture.encoding = THREE.sRGBEncoding;
  return windowTexture;
}

function softenedMaterialTint(hex, whiten = 0.66) {
  const c = new THREE.Color(hex);
  c.lerp(new THREE.Color(0xffffff), whiten);
  return c;
}

function getDetailBump(kind) {
  const key = `detail_bump_${kind}`;
  if (materialTextureCache.has(key)) return materialTextureCache.get(key);
  const tex = makeTextureCanvas(256, (ctx, s) => {
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, s, s);
    if (kind === 'brick') {
      ctx.strokeStyle = '#535353';
      ctx.lineWidth = 3;
      const rowH = 32, brickW = 58;
      for (let y = 0; y <= s; y += rowH) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(s, y); ctx.stroke();
        const offset = ((y / rowH) % 2) * (brickW / 2);
        for (let x = -brickW; x <= s + brickW; x += brickW) {
          ctx.beginPath(); ctx.moveTo(x + offset, y); ctx.lineTo(x + offset, Math.min(s, y + rowH)); ctx.stroke();
        }
      }
    } else if (kind === 'wood') {
      for (let i = 0; i < 46; i++) {
        const y = Math.random() * s;
        ctx.strokeStyle = `rgba(45,45,45,${0.18 + Math.random() * 0.18})`;
        ctx.lineWidth = 1 + Math.random() * 2;
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x <= s; x += 16) ctx.lineTo(x, y + Math.sin(x * 0.08 + i) * (2 + Math.random() * 3));
        ctx.stroke();
      }
    } else if (kind === 'corrugated') {
      for (let x = 0; x < s; x += 14) {
        const v = (x / 14) % 2 ? 0x5a : 0xa0;
        ctx.fillStyle = `rgb(${v},${v},${v})`;
        ctx.fillRect(x, 0, 7, s);
      }
    } else if (kind === 'roof') {
      ctx.strokeStyle = '#5f5f5f';
      ctx.lineWidth = 2;
      for (let y = 0; y < s; y += 26) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(s, y); ctx.stroke();
        for (let x = (y / 26) % 2 ? 18 : 0; x < s; x += 36) {
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, Math.min(s, y + 26)); ctx.stroke();
        }
      }
    } else if (kind === 'metal') {
      for (let i = 0; i < 170; i++) {
        const x = Math.random() * s, y = Math.random() * s;
        const v = 92 + Math.floor(Math.random() * 80);
        ctx.fillStyle = `rgb(${v},${v},${v})`;
        ctx.fillRect(x, y, 1 + Math.random() * 3, 1);
      }
    } else {
      for (let i = 0; i < 1200; i++) {
        const v = 96 + Math.floor(Math.random() * 70);
        ctx.fillStyle = `rgb(${v},${v},${v})`;
        ctx.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 2, 1 + Math.random() * 2);
      }
    }
  });
  tex.repeat.set(kind === 'corrugated' ? 4 : 2.8, kind === 'wood' ? 3.5 : 2.8);
  materialTextureCache.set(key, tex);
  return tex;
}

function createMaterial(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ map: getWallTexture(color), color: 0xffffff, roughness: 0.7, bumpMap: getDetailBump('concrete'), bumpScale: 0.025, ...opts });
}

function createConcreteMaterial(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ map: getConcreteTexture(color), color: softenedMaterialTint(color, 0.72), roughness: 0.94, bumpMap: getDetailBump('concrete'), bumpScale: 0.04, ...opts });
}

function createRoofMaterial(color, opts = {}) {

}

function getCurtainWallTexture(tint) {
  const key = textureKey('curtain', tint);
  if (materialTextureCache.has(key)) return materialTextureCache.get(key);
  const tex = makeTextureCanvas(512, (ctx, s) => {
    const grad = ctx.createLinearGradient(0, 0, 0, s);
    grad.addColorStop(0, shadeColor(tint, 48));
    grad.addColorStop(0.4, shadeColor(tint, 8));
    grad.addColorStop(1, shadeColor(tint, -40));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, s, s);
    for (let x = 0; x <= s; x += 42) {
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fillRect(x, 0, 3, s);
      ctx.fillStyle = 'rgba(18,25,35,0.24)';
      ctx.fillRect(x + 21, 0, 2, s);
    }
    for (let y = 0; y <= s; y += 34) {
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(0, y, s, 2);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.moveTo(0, 50); ctx.lineTo(s, 0); ctx.lineTo(s, 36); ctx.lineTo(0, 86); ctx.closePath();
    ctx.fill();
  });
  tex.repeat.set(1.2, 2.5);
  materialTextureCache.set(key, tex);
  return tex;
}

function createBrickMaterial(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ map: getBrickTexture(color), color: softenedMaterialTint(color, 0.68), roughness: 0.82, bumpMap: getDetailBump('brick'), bumpScale: 0.055, ...opts });
}

}
function createCurtainWallMaterial(color = 0x467aa2, opts = {}) {
  return new THREE.MeshStandardMaterial({ map: getCurtainWallTexture(color), color: 0xffffff, roughness: 0.14, metalness: 0.42, emissive: 0x20354a, emissiveIntensity: 0.16, ...opts });
}

function createFoundation(width, depth, height = 0.18, color = 0xc7c1b5) {
  const foundation = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    createConcreteMaterial(color)
  );
  foundation.position.y = height / 2;
  foundation.receiveShadow = true;
  foundation.castShadow = true;
  return foundation;
}

function createGableRoof(width, depth, roofHeight, material) {
  const w = width / 2;
  const d = depth / 2;
  const vertices = new Float32Array([
    -w, 0,  d,   w, 0,  d,   0, roofHeight,  d,
    -w, 0, -d,   w, 0, -d,   0, roofHeight, -d,
  ]);
  const indices = [
    0,1,2,
    3,5,4,
    0,2,5, 0,5,3,
    2,1,4, 2,4,5,
    0,3,4, 0,4,1,
  ];
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const roof = new THREE.Mesh(geo, material);
  roof.castShadow = true;
  roof.receiveShadow = true;
  return roof;
}

function addCornerPillars(group, width, depth, height, color = 0xf1eadf) {
  const geo = new THREE.BoxGeometry(0.12, height, 0.12);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.8 });
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const p = new THREE.Mesh(geo, mat);
    p.position.set(sx * (width / 2 - 0.08), height / 2, sz * (depth / 2 - 0.08));
    p.castShadow = true;
    group.add(p);
  }
}

function addWindowRow(group, count, y, width, zFront, color = 0xc7ebff) {
  const spacing = width / (count + 1);
  const mat = new THREE.MeshStandardMaterial({ color, emissive: 0x4c87a8, emissiveIntensity: 0.42, roughness: 0.18, metalness: 0.12 });
  for (let i = 1; i <= count; i++) {
    const win = new THREE.Mesh(new THREE.BoxGeometry(width * 0.11, width * 0.16, 0.04), mat);
    win.position.set(-width / 2 + spacing * i, y, zFront);
    group.add(win);
  }
}

function addFramedWindow(group, { width = 0.3, height = 0.34, depth = 0.06, x = 0, y = 0, z = 0, side = 'front', frameColor = 0xf4efe7, glow = 0x4c87a8, opacity = 0.82 } = {}) {
  const frameMat = createConcreteMaterial(frameColor, { roughness: 0.84 });
  const glassMat = createGlassMaterial({ opacity, emissive: glow, emissiveIntensity: 0.22, roughness: 0.05, metalness: 0.18 });
  const frameDepth = Math.max(0.02, depth);
  const glassDepth = 0.03;
  const frame = new THREE.Mesh(new THREE.BoxGeometry(width + 0.08, height + 0.08, frameDepth), frameMat);
  const glass = new THREE.Mesh(new THREE.BoxGeometry(width, height, glassDepth), glassMat);
  const mullionV = new THREE.Mesh(new THREE.BoxGeometry(0.03, height - 0.04, 0.02), frameMat);
  const mullionH = new THREE.Mesh(new THREE.BoxGeometry(width - 0.04, 0.03, 0.02), frameMat);

  const holder = new THREE.Group();
  holder.add(frame, glass, mullionV, mullionH);
  if (side === 'left') holder.rotation.y = Math.PI / 2;
  if (side === 'right') holder.rotation.y = -Math.PI / 2;
  if (side === 'back') holder.rotation.y = Math.PI;
  holder.position.set(x, y, z);
  glass.position.z = frameDepth * 0.16;
  mullionV.position.z = glass.position.z + 0.01;
  mullionH.position.z = glass.position.z + 0.01;
  group.add(holder);
  return holder;
}

function addRoofVent(group, x, y, z, w = 0.24, h = 0.14, d = 0.2, color = 0x8f99a8) {
  const base = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), createMetalMaterial(color, { roughness: 0.68, metalness: 0.22 }));
  base.position.set(x, y, z);
  base.castShadow = true;
  group.add(base);
  const top = new THREE.Mesh(new THREE.BoxGeometry(w * 0.84, h * 0.34, d * 0.84), createMetalMaterial(0xc4cbd3, { roughness: 0.52, metalness: 0.28 }));
  top.position.set(x, y + h * 0.5, z);
  group.add(top);
}

function addBalcony(group, x, y, z, width = 0.52, depth = 0.18) {
  const slab = new THREE.Mesh(new THREE.BoxGeometry(width, 0.06, depth), createConcreteMaterial(0xd8d3ca));
  slab.position.set(x, y, z);
  slab.castShadow = true;
  group.add(slab);
  for (const sx of [-1, 1]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.22, 0.03), createMetalMaterial(0x788290, { roughness: 0.66 }));
    post.position.set(x + sx * (width * 0.46), y + 0.11, z + depth * 0.42);
    group.add(post);
  }
  const rail = new THREE.Mesh(new THREE.BoxGeometry(width * 0.96, 0.03, 0.03), createMetalMaterial(0x788290, { roughness: 0.66 }));
  rail.position.set(x, y + 0.22, z + depth * 0.42);
  group.add(rail);
}

function addBollard(group, x, z, color = 0xffbf50) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.28, 8), createMetalMaterial(color, { roughness: 0.72, metalness: 0.08 }));
  post.position.set(x, 0.14, z);
  group.add(post);
}

function makeIconSprite(emoji, size) {
  const canvas = document.createElement('canvas');
  canvas.width = 96; canvas.height = 96;
  const ctx = canvas.getContext('2d');
  ctx.font = '76px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, 48, 54);
  const texture = new THREE.CanvasTexture(canvas);
  texture.encoding = THREE.sRGBEncoding;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true }));
  sprite.scale.set(size, size, 1);
  sprite.renderOrder = 5;
  return sprite;
}

function buildHouse(stage, height, baseSize) {
  const group = new THREE.Group();
  const stoneMat = createConcreteMaterial(0xb8afa2, { roughness: 0.94 });
  const trimMat = createConcreteMaterial(0xf5efe5, { roughness: 0.82 });
  const brickMat = createBrickMaterial(stage.color, { roughness: 0.88 });
  const sidingMat = createSidingMaterial(0xefe6d6, { roughness: 0.9 });

  const mainW = baseSize * 0.82;
  const mainD = baseSize * 0.88;
  const mainH = height;
  const wingW = baseSize * 0.42;
  const wingD = baseSize * 0.62;
  const wingH = height * 0.74;

  group.add(createFoundation(baseSize * 1.42, baseSize * 1.34, 0.18, 0xd7d0c4));

  const stoneBase = new THREE.Mesh(new THREE.BoxGeometry(mainW * 1.04, 0.28, mainD * 1.04), stoneMat);
  stoneBase.position.set(-baseSize * 0.12, 0.14, 0);
  group.add(stoneBase);

  const main = new THREE.Mesh(new THREE.BoxGeometry(mainW, mainH, mainD), brickMat);
  main.position.set(-baseSize * 0.12, mainH / 2 + 0.22, 0);
  main.castShadow = true;
  main.receiveShadow = true;
  group.add(main);

  const wing = new THREE.Mesh(new THREE.BoxGeometry(wingW, wingH, wingD), sidingMat);
  wing.position.set(baseSize * 0.31, wingH / 2 + 0.22, baseSize * 0.14);
  wing.castShadow = true;
  wing.receiveShadow = true;
  group.add(wing);

  addCornerPillars(group, mainW, mainD, mainH + 0.22, 0xf4eee3);

  const belt = new THREE.Mesh(new THREE.BoxGeometry(mainW * 1.06, 0.09, mainD * 1.06), trimMat);
  belt.position.set(-baseSize * 0.12, mainH * 0.52 + 0.22, 0);
  group.add(belt);
  const cornice = new THREE.Mesh(new THREE.BoxGeometry(mainW * 1.1, 0.08, mainD * 1.1), trimMat);
  cornice.position.set(-baseSize * 0.12, mainH + 0.24, 0);
  group.add(cornice);

  const roof = createGableRoof(mainW * 1.14, mainD * 1.18, mainH * 0.42, createRoofMaterial(0x803829));
  roof.position.set(-baseSize * 0.12, mainH + 0.24, 0);
  group.add(roof);
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, mainD * 1.2), createMetalMaterial(0x5b3622, { roughness: 0.72 }));
  ridge.position.set(-baseSize * 0.12, mainH + mainH * 0.42 + 0.24, 0);

const CONSTRUCTION_PHASES = [
  { key: 'prep', ru: 'ПОДГОТОВКА', en: 'SITE PREP' },
  { key: 'foundation', ru: 'ФУНДАМЕНТ', en: 'FOUNDATION' },
  { key: 'frame', ru: 'КАРКАС', en: 'STRUCTURE' },
  { key: 'walls', ru: 'СТЕНЫ', en: 'WALLS' },
  { key: 'roof', ru: 'КРЫША', en: 'ROOF' },
  { key: 'finish', ru: 'ОТДЕЛКА', en: 'FINISHING' },
];

function constructionPhaseIndex(t) {
  if (t < 0.12) return 0;
  if (t < 0.30) return 1;
  if (t < 0.52) return 2;
  if (t < 0.72) return 3;
  if (t < 0.88) return 4;
  return 5;
}

function constructionPhaseName(phase) {
  const info = CONSTRUCTION_PHASES[Math.max(0, Math.min(CONSTRUCTION_PHASES.length - 1, phase))];
  return lang === 'ru' ? info.ru : info.en;
}

function setConstructionPhaseVisual(site, phase, t) {
  if (!site) return;
  const changed = site.phase !== phase;
  site.phase = phase;

  if (site.foundationVisual) site.foundationVisual.visible = phase >= 1;
  if (site.frameVisual) site.frameVisual.visible = phase >= 2 && phase <= 4;
  if (site.wallVisual) site.wallVisual.visible = phase >= 3 && phase <= 4;
  if (site.roofVisual) site.roofVisual.visible = phase === 4;
  if (site.finishVisual) site.finishVisual.visible = phase >= 5;
  if (site.mixer) site.mixer.visible = phase <= 1;
  if (site.excavator) site.excavator.visible = phase <= 1;
  if (site.beamStack) site.beamStack.visible = phase >= 2 && phase <= 3;
  if (site.rebarCage) site.rebarCage.visible = phase <= 2;
  if (site.craneParts) site.craneParts.forEach(obj => { if (obj) obj.visible = phase >= 1 && phase <= 4; });

  if (site.foundationVisual && phase === 1) {
    const k = THREE.MathUtils.clamp((t - 0.12) / 0.18, 0.08, 1);
    site.foundationVisual.scale.y = k;
  } else if (site.foundationVisual) {
    site.foundationVisual.scale.y = 1;
  }
  if (site.frameVisual && phase === 2) {
    const k = THREE.MathUtils.clamp((t - 0.30) / 0.22, 0.08, 1);
    site.frameVisual.scale.y = k;
  } else if (site.frameVisual) {
    site.frameVisual.scale.y = 1;
  }
  if (site.wallVisual && phase === 3) {
    const k = THREE.MathUtils.clamp((t - 0.52) / 0.20, 0.08, 1);
    site.wallVisual.scale.y = k;
  } else if (site.wallVisual) {
    site.wallVisual.scale.y = 1;
  }

  const pct = Math.min(100, Math.max(0, Math.round(t * 100)));
  const bucket = Math.floor(pct / 5);
  if (site.phaseLabel && (changed || site.lastPctBucket !== bucket)) {
    updateLabelSprite(site.phaseLabel, [constructionPhaseName(phase), `${pct}%`]);
    site.lastPctBucket = bucket;
  }
}

function addFacadeFrame(group, width, depth, height, yOffset = 0, color = 0xe9edf2) {
  const mat = createMetalMaterial(color, { roughness: 0.6, metalness: 0.12 });
  const vGeo = new THREE.BoxGeometry(0.055, height, 0.055);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const bar = new THREE.Mesh(vGeo, mat);
    bar.position.set(sx * width * 0.5, yOffset + height * 0.5, sz * depth * 0.5);
    bar.castShadow = true; group.add(bar);
  }
  const hGeoX = new THREE.BoxGeometry(width + 0.08, 0.055, 0.055);
  const hGeoZ = new THREE.BoxGeometry(0.055, 0.055, depth + 0.08);
  for (const y of [yOffset + height * 0.15, yOffset + height * 0.55, yOffset + height * 0.94]) {
    for (const sz of [-1,1]) { const b=new THREE.Mesh(hGeoX,mat); b.position.set(0,y,sz*depth*0.5); group.add(b); }
    for (const sx of [-1,1]) { const b=new THREE.Mesh(hGeoZ,mat); b.position.set(sx*width*0.5,y,0); group.add(b); }
  }
}

function addRoofTech(group, width, depth, y, intensity = 1) {
  const metal = createMetalMaterial(0x818c99, { roughness: 0.62, metalness: 0.28 });
  const dark = createCorrugatedMaterial(0x3b424c, { roughness: 0.72, metalness: 0.22 });
  const count = Math.max(1, Math.round(2 * intensity));
  for (let i=0;i<count;i++) {
    const unit = new THREE.Mesh(new THREE.BoxGeometry(width*0.18, Math.max(0.12,width*0.06), depth*0.16), i%2?metal:dark);
    unit.position.set((i-(count-1)/2)*width*0.22, y, -depth*0.08 + (i%2)*depth*0.16);
    unit.castShadow=true; group.add(unit);
    const fan = new THREE.Mesh(new THREE.CylinderGeometry(width*0.04,width*0.04,0.035,12), metal);
    fan.position.set(unit.position.x, y + Math.max(0.12,width*0.06)*0.55, unit.position.z);
    group.add(fan);
  }
}

function enhanceBuildingGeometry(group, stage, height, baseSize, level) {
  const type = stage.archetype;
  if (type === 'house') {
    const trim = createWoodMaterial(0xf2eadf,{roughness:0.8});
    for (const y of [height*0.33,height*0.66]) {
      const band = new THREE.Mesh(new THREE.BoxGeometry(baseSize*0.72,0.055,baseSize*0.86),trim);
      band.position.set(-baseSize*0.14,y,0); group.add(band);
    }
    const gutter = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,baseSize*0.78,8),createMetalMaterial(0x737b83,{roughness:0.58,metalness:0.25}));
    gutter.rotation.z=Math.PI/2; gutter.position.set(-baseSize*0.14,height+0.08,baseSize*0.43); group.add(gutter);
    const down = new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,height*0.72,8),createMetalMaterial(0x737b83,{roughness:0.58,metalness:0.25}));
    down.position.set(baseSize*0.22,height*0.38,baseSize*0.43); group.add(down);
    if (level>=2) addBalconies(group,baseSize*0.72,baseSize*0.82,height,1);
  } else if (type === 'shop') {
    addFacadeFrame(group,baseSize*0.92,baseSize*0.92,height*0.78,0.08,0x404854);
    const neon = new THREE.Mesh(new THREE.BoxGeometry(baseSize*0.72,0.055,0.035),new THREE.MeshStandardMaterial({color:0xffd479,emissive:0xffb347,emissiveIntensity:1.1,roughness:0.25}));
    neon.position.set(0,height*0.7,baseSize*0.515); group.add(neon);
    if(level>=2) addRoofTech(group,baseSize,baseSize,height*0.93,1.2);
  } else if (type === 'warehouse') {
    addFacadeFrame(group,baseSize*1.65,baseSize*1.12,height*0.86,0.05,0x798492);
    const canopy = new THREE.Mesh(new THREE.BoxGeometry(baseSize*0.92,0.09,baseSize*0.34),createCorrugatedMaterial(0x596471,{roughness:0.76}));
    canopy.position.set(0,height*0.58,baseSize*0.74); canopy.castShadow=true; group.add(canopy);
    addRoofTech(group,baseSize*1.5,baseSize,height*0.98,1.2);
  } else if (type === 'factory') {
    addFacadeFrame(group,baseSize*1.18,baseSize*1.05,height*0.6,0.08,0x4f5965);
    const pipeMat=createMetalMaterial(0x9aa3ad,{roughness:0.5,metalness:0.42});
    for (const sx of [-1,1]) {
      const pipe=new THREE.Mesh(new THREE.CylinderGeometry(0.065,0.065,height*0.46,10),pipeMat);
      pipe.position.set(sx*baseSize*0.48,height*0.37,baseSize*0.5); group.add(pipe);
      const elbow=new THREE.Mesh(new THREE.TorusGeometry(0.12,0.055,8,14,Math.PI/2),pipeMat);
      elbow.rotation.z=sx>0?0:Math.PI; elbow.position.set(sx*baseSize*0.42,height*0.58,baseSize*0.5); group.add(elbow);
    }
    addRoofTech(group,baseSize*1.15,baseSize,height*0.76,1.6);
  } else if (type === 'office') {
    addFacadeFrame(group,baseSize*0.82,baseSize*0.74,height, height*0.18, 0xc7d2df);
    addBalconies(group,baseSize*0.78,baseSize*0.82,height, Math.min(3,level+1));
    addRoofTech(group,baseSize*0.75,baseSize*0.68,height*1.19,1.4);
  } else if (type === 'tower') {
    addFacadeFrame(group,baseSize*0.78,baseSize*0.78,height*0.58,height*0.16,0xaebdca);
    const edgeMat=new THREE.MeshStandardMaterial({color:0xcceeff,emissive:0x4fa4d2,emissiveIntensity:0.38,roughness:0.16,metalness:0.35});
    for (const sx of [-1,1]) for (const sz of [-1,1]) {
      const edge=new THREE.Mesh(new THREE.BoxGeometry(0.045,height*0.78,0.045),edgeMat);
      edge.position.set(sx*baseSize*0.33,height*0.57,sz*baseSize*0.33); group.add(edge);
    }
    addRoofTech(group,baseSize*0.62,baseSize*0.62,height*1.05,1.2);
  }

  if (level >= 3) {
    const halo = new THREE.Mesh(new THREE.TorusGeometry(baseSize*0.46,0.035,8,32),new THREE.MeshStandardMaterial({color:0xffd479,emissive:0xffa52e,emissiveIntensity:0.8,roughness:0.3}));
    halo.rotation.x=Math.PI/2; halo.position.y=height*1.07; group.add(halo);
  }
}

const BUILDERS = { house: buildHouse, shop: buildShop, warehouse: buildWarehouse, factory: buildFactory, office: buildOffice, tower: buildTower };

function createBuildingMesh(stage, level = 1) {
  const height = stage.height * (1 + (level - 1) * 0.18);
  const baseSize = stage.baseSize || 2.6;
  const builder = BUILDERS[stage.archetype] || buildHouse;
  const group = builder(stage, height, baseSize);
  enhanceBuildingGeometry(group, stage, height, baseSize, level);

  // Small glowing pips on a corner mark the upgrade level at a glance, regardless of archetype.
  for (let i = 0; i < level; i++) {
    const pip = new THREE.Mesh(
      new THREE.BoxGeometry(0.32, 0.22, 0.32),
      new THREE.MeshStandardMaterial({ color: 0xffe08a, emissive: 0x664400, emissiveIntensity: 0.5 })
    );
    pip.position.set(baseSize / 2 - 0.2, height + 0.2 + i * 0.3, baseSize / 2 - 0.2);
    group.add(pip);
  }

  return group;
}

// Factory buildings expose their smokestack top positions (local space) via
// mesh.userData.stackTops; convert to world space (buildings never rotate) for the smoke system.
function smokeTopsFor(mesh, pos) {
  const tops = mesh.userData.stackTops;
  if (!tops || !tops.length) return null;
  return tops.map(local => new THREE.Vector3(pos.x + local.x, local.y, pos.z + local.z));
}

function spawnBuilding(index, level, { grow = true } = {}) {
  const stage = STAGES[index];
  const mesh = createBuildingMesh(stage, level);
  const pos = buildingPosition(index);
  mesh.position.set(pos.x, 0, pos.z);

  const entry = {
    index, level, mesh, pos, upgradePad: null,
    underConstruction: !!grow,
    smokeTops: smokeTopsFor(mesh, pos), smokeTimer: Math.random() * 1.4,
  };

  if (grow) {
    const duration = constructionDuration(index, level, false);
    mesh.scale.set(0.94, 0.08, 0.94);
    mesh.visible = false;
    const build = { mesh, entry, timer: 0, duration, upgrading: false, phase: 0, site: null };
    growingMeshes.push(build);
    build.site = spawnConstructionSite(pos, stage, duration);
    if (build.site) build.site.buildRef = build;
  }
  scene.add(mesh);
  buildings.push(entry);

  if (!grow && level < MAX_BUILDING_LEVEL) spawnUpgradePad(entry);
  return entry;
}

function spawnUpgradePad(entry) {
  const stage = STAGES[entry.index];
  const dir = stagePosition(entry.index).normalize();
  const tangent = new THREE.Vector3(-dir.z, 0, dir.x);
  const positions = [
    entry.pos.clone().addScaledVector(tangent, UPGRADE_PAD_OFFSET),
    entry.pos.clone().addScaledVector(tangent, -UPGRADE_PAD_OFFSET),
    entry.pos.clone().addScaledVector(dir, UPGRADE_PAD_OFFSET * 1.12),
  ];
  const groups = [];
  const rings = [];
  const upgradeWood = buildingUpgradePlankCost(entry.index, entry.level);
  let primarySprite = null;

  positions.forEach((pos, idx) => {
    const group = new THREE.Group();
    const disc = new THREE.Mesh(
      new THREE.CylinderGeometry(idx === 0 ? 0.9 : 0.78, idx === 0 ? 0.9 : 0.78, 0.13, 28),
      new THREE.MeshStandardMaterial({ color: 0x5ab0ff, emissive: 0x0a2a4a, emissiveIntensity: 0.7, roughness: 0.3 })
    );
    disc.position.y = 0.07;
    group.add(disc);
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(idx === 0 ? 0.98 : 0.86, 0.08, 10, 30),
      new THREE.MeshStandardMaterial({ color: 0xbde8ff, emissive: 0x4d9ed8, emissiveIntensity: 0.7, roughness: 0.25, metalness: 0.2 })
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.15;
    group.add(ring);
    rings.push(ring);

    if (idx === 0) {
      const sprite = makeLabelSprite([
        t('upgrade_level_line', { level: entry.level + 1 }),
        `${fmt(buildingUpgradeCost(entry.index, entry.level))} 💰  •  ${upgradeWood} 🪵`,
      ]);
      sprite.position.y = 2.6;
      sprite.scale.set(2.95, 1.2, 1);
      group.add(sprite);
      primarySprite = sprite;
    } else {
      const icon = makeIconSprite('⬆️', 0.62);
      icon.position.y = 1.35;
      group.add(icon);
    }
    group.position.copy(pos);
    scene.add(group);
    groups.push(group);
  });

  entry.upgradePad = {
    group: groups[0],
    groups,
    rings,
    sprite: primarySprite,
    pos: positions[0],
    positions,
    insufficientShown: false,
  };
}

function removeUpgradePad(entry) {
  if (!entry.upgradePad) return;
  const groups = entry.upgradePad.groups || [entry.upgradePad.group];
  groups.forEach(g => scene.remove(g));
  entry.upgradePad = null;
}

function upgradeBuilding(entry) {
  const cost = buildingUpgradeCost(entry.index, entry.level);
  const woodCost = buildingUpgradePlankCost(entry.index, entry.level);
  money -= cost;
  planks -= woodCost;
  removeUpgradePad(entry);
  scene.remove(entry.mesh);
  entry.level += 1;
  entry.mesh = createBuildingMesh(STAGES[entry.index], entry.level);
  entry.mesh.position.set(entry.pos.x, 0, entry.pos.z);
  entry.mesh.scale.set(0.94, 0.08, 0.94);
  entry.mesh.visible = false;
  entry.underConstruction = true;
  const duration = constructionDuration(entry.index, entry.level, true);
  const build = { mesh: entry.mesh, entry, timer: 0, duration, upgrading: true, phase: 0, site: null };
  growingMeshes.push(build);
  build.site = spawnConstructionSite(entry.pos, STAGES[entry.index], duration);
  if (build.site) build.site.buildRef = build;
  scene.add(entry.mesh);
  entry.smokeTops = smokeTopsFor(entry.mesh, entry.pos);
  if (entry.level >= MAX_BUILDING_LEVEL) stats.maxLevelHit = true;

  sfx.build();
  spawnBurst(entry.pos, 0x5ab0ff);
  triggerShake(0.12, 0.2);
  toast(lang === 'ru'
    ? `🔧 Улучшение ${stageName(STAGES[entry.index])}: −${fmt(cost)} 💰, −${woodCost} 🪵`
    : `🔧 Upgrading ${stageName(STAGES[entry.index])}: −${fmt(cost)} 💰, −${woodCost} 🪵`);
  updateHUD();
  checkAchievements();
  save();
}

/* ---------------------------------------------------------------------- */
/*  PARTICLE BURST — purchase "juice"                                      */
/* ---------------------------------------------------------------------- */
const particleBursts = [];
function spawnBurst(pos, color) {
  const count = 36;
  const positions = new Float32Array(count * 3);
  const velocities = [];
  for (let i = 0; i < count; i++) {
    positions[i * 3] = pos.x;
    positions[i * 3 + 1] = pos.y + 1;
    positions[i * 3 + 2] = pos.z;
    const a = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 4;
    velocities.push(new THREE.Vector3(Math.cos(a) * speed, 3 + Math.random() * 3, Math.sin(a) * speed));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color, size: 0.35, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const points = new THREE.Points(geo, mat);
  scene.add(points);
  particleBursts.push({ points, velocities, life: 0.9, maxLife: 0.9 });
}

/* ---------------------------------------------------------------------- */
/*  SMOKE — drifting puffs from every factory's smokestacks                */
/* ---------------------------------------------------------------------- */
const SMOKE_INTERVAL = 1.5;
let smokeTexture = null;
function getSmokeTexture() {
  if (smokeTexture) return smokeTexture;
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,0.85)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  smokeTexture = new THREE.CanvasTexture(c);
  return smokeTexture;
}

const smokePuffs = [];
function spawnSmokePuff(pos) {
  const mat = new THREE.SpriteMaterial({ map: getSmokeTexture(), color: 0xd8d8dc, transparent: true, opacity: 0.5, depthWrite: false });
  const sprite = new THREE.Sprite(mat);
  sprite.position.copy(pos);
  sprite.scale.set(0.5, 0.5, 1);
  scene.add(sprite);
  smokePuffs.push({ sprite, drift: (Math.random() - 0.5) * 0.3, life: 2.4, maxLife: 2.4 });
}

function updateSmoke(dt) {
  for (const b of buildings) {
    if (!b.smokeTops) continue;
    b.smokeTimer += dt;
    if (b.smokeTimer >= SMOKE_INTERVAL) {
      b.smokeTimer = Math.random() * 0.4;
      for (const top of b.smokeTops) spawnSmokePuff(top);
    }
  }
  for (let i = smokePuffs.length - 1; i >= 0; i--) {
    const p = smokePuffs[i];
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.sprite);
      p.sprite.material.dispose();
      smokePuffs.splice(i, 1);
      continue;
    }
    p.sprite.position.y += dt * 0.7;
    p.sprite.position.x += dt * p.drift;
    const k = 1 - p.life / p.maxLife;
    p.sprite.scale.setScalar(0.5 + k * 1.3);
    p.sprite.material.opacity = 0.5 * (p.life / p.maxLife);
  }
}

function chooseWorkerTarget(worker) {
  const activeBuilds = growingMeshes.filter(build => build?.entry?.underConstruction);
  if (activeBuilds.length && Math.random() < 0.72) {
    const build = activeBuilds[Math.floor(Math.random() * activeBuilds.length)];
    const angle = Math.random() * Math.PI * 2;
    const radius = 1.35 + Math.random() * 0.75;
    worker.target = build.entry.pos.clone().add(new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius));
    worker.workBuild = build;
    worker.idle = 0.7 + Math.random() * 1.4;
    return;
  }
  // No construction to help with right now: stick close to home base with a short walk
  // instead of wandering off toward some random building anywhere on the map (spec section
  // 17: "if there's no construction, workers stay near base ... not endlessly roam the
  // whole map").
  const base = (worker.homeBase || GENERATOR_POS).clone();
  base.x += (Math.random() - 0.5) * 3.2;
  base.z += (Math.random() - 0.5) * 3.2;
  worker.target = base;
  worker.workBuild = null;
  worker.idle = 0.25 + Math.random() * 1.1;
}
