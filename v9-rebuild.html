<style>

<body><canvas id="c"></canvas><div id="boot" class="boot">Подготовка новой стройплощадки…</div>
<div class="ui"><div class="top"><div class="glass brand">Elite<b>Roof</b><small>CONSTRUCTION</small></div><div class="glass cash"><div><strong id="money">12 450</strong><small>ДЕНЬГИ</small></div><div><strong id="bricks">1 860</strong><small>КИРПИЧ</small></div><div><strong id="wood">1 540</strong><small>ДОСКИ</small></div></div><div class="glass level"><small>УРОВЕНЬ</small><strong>12</strong></div></div>

<button id="auditBtn" class="glass auditBtn">АУДИТ</button><div id="audit" class="glass audit"><h3>Визуальный агент</h3><div class="row"><span>Композиция сцены</span><b class="good">ХОРОШО</b></div><div class="row"><span>Свет и тени</span><b class="mid">СРЕДНЕ</b></div><div class="row"><span>Материалы</span><b class="mid">СРЕДНЕ</b></div><div class="row"><span>Персонаж</span><b class="bad">НУЖЕН GLB</b></div><div class="row"><span>Техника</span><b class="bad">НУЖНЫ АССЕТЫ</b></div><div class="row"><span>Сходство с референсом</span><b class="bad">34%</b></div></div><div id="toast" class="toast"></div>
<div class="bottom"><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div class="actions"><button id="auto">АВТО: ВКЛ</button><button class="run">🏃</button></div></div></div>
<script>
const boot=document.getElementById('boot');
function load(url){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=url;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
(async()=>{try{let loaded=false;for(const u of['https://cdn.babylonjs.com/babylon.js','https://cdnjs.cloudflare.com/ajax/libs/babylonjs/7.34.1/babylon.min.js','https://unpkg.com/babylonjs@7.34.1/babylon.js']){try{await load(u);loaded=true;break}catch(e){}}if(!loaded)throw new Error('Не удалось загрузить 3D-движок');
const B=BABYLON,canvas=document.getElementById('c'),engine=new B.Engine(canvas,true,{adaptToDeviceRatio:true});engine.setHardwareScalingLevel(Math.max(1,devicePixelRatio/1.45));const scene=new B.Scene(engine);scene.clearColor=new B.Color4(.62,.77,.84,1);scene.fogMode=B.Scene.FOGMODE_EXP2;scene.fogDensity=.012;scene.fogColor=new B.Color3(.66,.77,.82);
const cam=new B.ArcRotateCamera('cam',-1.05,1.05,29,new B.Vector3(1,2,1),scene);cam.lowerRadiusLimit=13;cam.upperRadiusLimit=42;cam.lowerBetaLimit=.48;cam.upperBetaLimit=1.35;cam.attachControl(canvas,true);cam.pinchPrecision=60;cam.wheelPrecision=45;
const hemi=new B.HemisphericLight('hemi',new B.Vector3(0,1,0),scene);hemi.intensity=.82;const sun=new B.DirectionalLight('sun',new B.Vector3(-.5,-1,.35),scene);sun.position=new B.Vector3(18,24,-16);sun.intensity=2.4;const shadows=new B.ShadowGenerator(1024,sun);shadows.useBlurExponentialShadowMap=true;shadows.blurKernel=18;
function mat(name,color,rough=.85,metal=.05){const m=new B.PBRMaterial(name,scene);m.albedoColor=B.Color3.FromHexString(color);m.roughness=rough;m.metallic=metal;return m}const M={grass:mat('grass','#587944',1),dirt:mat('dirt','#8a6040',1),road:mat('road','#2d3236',.94),con:mat('con','#aaaead',.9),brick:mat('brick','#a24b2c',.92),brick2:mat('brick2','#bd6037',.9),wood:mat('wood','#8c5c31',.86),roof:mat('roof','#243b4b',.55,.16),glass:mat('glass','#3988aa',.18,.08),orange:mat('orange','#e68c10',.6),dark:mat('dark','#20262b',.78),yellow:mat('yellow','#f3bd22',.7),white:mat('white','#d8d4ca',.82)};
function box(n,p,s,m){const o=B.MeshBuilder.CreateBox(n,{size:1},scene);o.position.set(...p);o.scaling.set(...s);o.material=m;o.receiveShadows=true;shadows.addShadowCaster(o);return o}function cyl(n,p,d,h,m){const o=B.MeshBuilder.CreateCylinder(n,{diameter:d,height:h,tessellation:20},scene);o.position.set(...p);o.material=m;o.receiveShadows=true;shadows.addShadowCaster(o);return o}
box('ground',[0,-.5,0],[42,1,32],M.grass);box('site',[2,.01,1],[24,.12,19],M.dirt);box('road',[0,.03,-12],[42,.1,5],M.road);for(let x=-18;x<19;x+=4)box('stripe'+x,[x,.1,-12],[1.6,.02,.15],M.yellow);
for(let i=0;i<22;i++){box('fencepost'+i,[-14+i*1.25,.9,10.4],[.06,1.8,.06],M.dark);if(i<21)box('fencebar'+i,[-13.4+i*1.25,.9,10.4],[1.16,.05,.05],M.dark)}
box('container',[-11,1.7,4],[5,3.4,4],mat('container','#294f43',.76));box('containerRoof',[-11,3.55,4],[5.4,.2,4.4],M.dark);box('containerDoor',[-8.45,1.65,4],[.08,2.5,1.35],M.dark);
for(let p=0;p<4;p++){const px=-8+(p%2)*2.1,pz=-.2+Math.floor(p/2)*2.1;box('pal'+p,[px,.16,pz],[1.7,.22,1.25],M.wood);for(let i=0;i<18;i++)box('load'+p+'-'+i,[px+(i%6)*.25-.63,.38+Math.floor(i/6)*.22,pz],[.22,.18,.42],p===0?M.brick:p===1?M.white:p===2?M.wood:M.roof)}
const build=[];function piece(o,a,b){o.isVisible=false;o.metadata={a,b,base:o.scaling.y};build.push(o);return o}piece(box('pit',[3,-.25,1],[8,.5,6],mat('pit','#5d402d',1)),0,.05);for(let x=-3.3;x<=3.3;x+=1.1){piece(box('f1'+x,[3+x,.3,-1.7],[.95,.6,.55],M.con),.05,.14);piece(box('f2'+x,[3+x,.3,3.7],[.95,.6,.55],M.con),.05,.14)}for(let z=-.8;z<=2.8;z+=1.1){piece(box('f3'+z,[-.7,.3,1+z],[.55,.6,.95],M.con),.05,.14);piece(box('f4'+z,[6.7,.3,1+z],[.55,.6,.95],M.con),.05,.14)}piece(box('slab',[3,.78,1],[7.4,.35,5.4],M.con),.14,.23);
function wall(y,second,a,b){const mm=second?M.brick2:M.brick;for(let x=-3.1;x<=3.1;x+=.78){piece(box('wf'+y+x,[3+x,y,-1.52],[.7,.31,.38],mm),a,b);piece(box('wb'+y+x,[3+x,y,3.52],[.7,.31,.38],mm),a,b)}for(let z=-1.3;z<=1.3;z+=.78){piece(box('wl'+y+z,[-.48,y,1+z],[.38,.31,.7],mm),a,b);piece(box('wr'+y+z,[6.48,y,1+z],[.38,.31,.7],mm),a,b)}}for(let r=0;r<7;r++)wall(1.05+r*.36,false,.23+r*.025,.44);piece(box('upperSlab',[3,3.67,1],[7.3,.32,5.3],M.con),.44,.52);for(let r=0;r<6;r++)wall(3.95+r*.36,true,.52+r*.027,.69);for(let i=0;i<14;i++){const x=-3+i*.47;let l=piece(box('rafterL'+i,[3+x,6.45,-.35],[.1,.13,3.45],M.wood),.69+i*.004,.81);l.rotation.x=.62;let r=piece(box('rafterR'+i,[3+x,6.45,2.35],[.1,.13,3.45],M.wood),.69+i*.004,.81);r.rotation.x=-.62}for(let i=0;i<14;i++){const x=-3+i*.47;let l=piece(box('roofL'+i,[3+x,6.75,-.38],[.42,.11,3.6],M.roof),.81+i*.004,.91);l.rotation.x=.62;let r=piece(box('roofR'+i,[3+x,6.75,2.38],[.42,.11,3.6],M.roof),.81+i*.004,.91);r.rotation.x=-.62}for(const x of[1,3,5])piece(box('window'+x,[x,2.05,-1.75],[.95,1.05,.1],M.glass),.91,.97);piece(box('door',[3,1.8,-1.78],[1.15,2.1,.14],mat('door','#52311d',.8)),.93,.98);
function truck(){const g=new B.TransformNode('truck',scene);const base=box('truckBase',[0,.65,0],[4.2,.7,1.75],M.dark);base.parent=g;const cab=box('truckCab',[-1.45,1.55,0],[1.45,1.8,1.55],M.orange);cab.parent=g;const bed=box('truckBed',[1.05,1.35,0],[2.15,1.25,1.62],M.white);bed.parent=g;for(const x of[-1.4,1.3])for(const z of[-.88,.88]){const w=cyl('wheel',[x,.38,z],.82,.24,M.dark);w.rotation.x=Math.PI/2;w.parent=g}g.position.set(10,0,4);g.rotation.y=-.45;return g}const truck=truck();
function excavator(){const g=new B.TransformNode('excav',scene);const base=box('exBase',[0,.45,0],[3,.55,1.8],M.dark);base.parent=g;const cab=box('exCab',[-.5,1.5,0],[1.4,1.65,1.45],M.orange);cab.parent=g;const arm=box('exArm',[1.1,2.3,0],[3,.25,.28],M.orange);arm.rotation.z=-.35;arm.parent=g;const bucket=box('bucket',[2.7,.65,0],[1,.55,1],M.orange);bucket.parent=g;g.position.set(10,0,-3);return g}const excav=excavator();
function pad(label,x,z,color,cost,key){const tor=B.MeshBuilder.CreateTorus(label,{diameter:3.2,thickness:.13,tessellation:48},scene);tor.position.set(x,.12,z);const pm=new B.StandardMaterial(label+'m',scene);pm.emissiveColor=B.Color3.FromHexString(color);pm.diffuseColor=pm.emissiveColor.scale(.22);tor.material=pm;const disc=B.MeshBuilder.CreateCylinder(label+'d',{diameter:2.85,height:.05,tessellation:48},scene);disc.position.set(x,.06,z);disc.material=pm;return {x,z,cost,key,label,tor,disc}}const pads=[pad('СКОРОСТЬ',-7,-6,'#24c7ff',500,'speed'),pad('ГРУЗ',-2,-6,'#b756ff',650,'cargo'),pad('ДОХОД',3,-6,'#ffd42c',750,'income'),pad('ДОСТАВКА',8,-6,'#ff8e2c',1200,'delivery')];
const player=new B.TransformNode('player',scene);const body=box('body',[0,1.05,0],[.5,.78,.34],mat('shirt','#f2f1eb',.72));body.parent=player;const head=cyl('head',[0,1.67,0],.42,.38,mat('skin','#d6a27d',.82));head.parent=player;const hood=box('hood',[0,1.48,.18],[.56,.34,.18],M.white);hood.parent=player;const la=box('la',[-.36,1.02,0],[.15,.68,.18],M.white);la.parent=player;const ra=box('ra',[.36,1.02,0],[.15,.68,.18],M.white);ra.parent=player;const ll=box('ll',[-.16,.35,0],[.19,.72,.23],M.dark);ll.parent=player;const rl=box('rl',[.16,.35,0],[.19,.72,.23],M.dark);rl.parent=player;const cargo=box('cargo',[0,1.18,.42],[.68,.48,.5],M.brick);cargo.parent=player;
const state={money:12450,bricks:1860,wood:1540,progress:0,speed:1,cargo:1,income:1,auto:true,t:0,dir:1};try{Object.assign(state,JSON.parse(localStorage.getItem('er_v9')||'{}'))}catch(e){}const from=new B.Vector3(-7,0,-1),to=new B.Vector3(-1,0,-1);let joy={x:0,y:0,active:false};
const joyEl=document.getElementById('joy'),knob=document.getElementById('knob');function joyMove(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=31,len=Math.hypot(dx,dy)||1,k=Math.min(1,max/len);joy.x=dx*k/max;joy.y=dy*k/max;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`}joyEl.onpointerdown=e=>{joy.active=true;joyEl.setPointerCapture(e.pointerId);joyMove(e)};joyEl.onpointermove=e=>{if(joy.active)joyMove(e)};joyEl.onpointerup=()=>{joy.active=false;joy.x=joy.y=0;knob.style.transform=''};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1300)}document.getElementById('auto').onclick=()=>{state.auto=!state.auto;document.getElementById('auto').textContent='АВТО: '+(state.auto?'ВКЛ':'ВЫКЛ')};document.getElementById('auditBtn').onclick=()=>document.getElementById('audit').classList.toggle('open');
const stages=[['Расчистить площадку',0],['Построить фундамент',.05],['Залить плиту',.14],['Стены первого этажа',.23],['Перекрытие',.44],['Стены второго этажа',.52],['Стропильная система',.69],['Кровля',.81],['Отделка',.91],['Дом готов',.98]];function stage(){let s=stages[0][0];for(const x of stages)if(state.progress>=x[1])s=x[0];return s}
let last=performance.now();scene.onBeforeRenderObservable.add(()=>{const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;if(state.auto){state.t+=dt*.14*state.speed*state.dir;if(state.t>=1){state.t=1;state.dir=-1;state.progress=Math.min(1,state.progress+.005*state.cargo);state.money+=5*state.cargo*state.income}if(state.t<=0){state.t=0;state.dir=1}player.position=B.Vector3.Lerp(from,to,state.t);player.rotation.y=state.dir>0?Math.PI/2:-Math.PI/2;cargo.isVisible=state.dir>0}else if(joy.active){player.position.x+=joy.x*dt*3.4*state.speed;player.position.z+=joy.y*dt*3.4*state.speed;player.rotation.y=Math.atan2(joy.x,joy.y);cargo.isVisible=false}const walk=Math.sin(now*.012*state.speed)*(state.auto||joy.active?1:0);la.rotation.x=walk*.75;ra.rotation.x=-walk*.75;ll.rotation.x=-walk*.68;rl.rotation.x=walk*.68;player.position.y=Math.abs(walk)*.035;truck.position.x=10+Math.sin(now*.00025)*1.8;excav.rotation.y=Math.sin(now*.00035)*.08;for(const p of build){const q=B.Scalar.Clamp((state.progress-p.metadata.a)/(p.metadata.b-p.metadata.a),0,1);p.isVisible=q>0;p.scaling.y=p.metadata.base*Math.max(.04,q)}for(const p of pads){const d=Math.hypot(player.position.x-p.x,player.position.z-p.z);p.tor.scaling.setAll(1+Math.sin(now*.004)*.035);if(d<1.6&&!state.auto){if(state.money>=p.cost){state.money-=p.cost;if(p.key==='delivery')state.progress=Math.min(1,state.progress+.035);else state[p.key]+=p.key==='speed'?.2:1;toast(p.label+' улучшено')}else toast('Не хватает денег');player.position.z+=1.8}}document.getElementById('money').textContent=Math.floor(state.money).toLocaleString('ru');document.getElementById('bricks').textContent=state.bricks;document.getElementById('wood').textContent=state.wood;const pc=Math.round(state.progress*100);document.getElementById('pct').textContent=pc+'%';document.getElementById('fill').style.width=pc+'%';document.getElementById('stage').textContent=stage()});setInterval(()=>localStorage.setItem('er_v9',JSON.stringify(state)),2000);boot.remove();engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());}catch(err){boot.innerHTML='Ошибка запуска:<br>'+String(err.message||err);console.error(err)}})();
</script></body></html>
