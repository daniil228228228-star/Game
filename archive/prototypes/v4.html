,255,.1);border-radius:14px;background:rgba(14,21,29,.96);color:#fff;padding:10px 8px;font-weight:800;font-size:9px}button.primary{background:linear-gradient(#ffc32f,#f28b00);color:#231502}.toast{position:absolute;left:50%;top:20%;transform:translateX(-50%);background:rgba(8,12,18,.92);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:8px 11px;font-size:10px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:700px){.level{display:none}.res .r:nth-child(4){display:none}.brand{font-size:12px}.actions{grid-template-columns:repeat(2,84px)}}</style></head><body><div id="app"></div><div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0f14;z-index:30;font:600 15px -apple-system">Загрузка улучшенной сцены…</div><div class="ui"><div class="top"><div class="card brand">Elite<b>Roof</b><small>CONSTRUCTION</small></div><div class="card res"><div class="r"><strong id="sand">2450</strong><small>ПЕСОК</small></div><div class="r"><strong id="brick">1860</strong><small>КИРПИЧ</small></div><div class="r"><strong id="cement">980</strong><small>ЦЕМЕНТ</small></div><div class="r"><strong id="wood">1540</strong><small>ДОСКИ</small></div><div class="r"><strong id="money">12450</strong><small>ДЕНЬГИ</small></div></div><div class="card level"><small>УРОВЕНЬ</small><strong>13</strong></div></div><div class="card mission"><b>ТЕКУЩАЯ ЗАДАЧА</b><span id="mission">Подготовить стройплощадку</span></div><div class="toast" id="toast"></div><div class="bottom"><div class="card progressCard"><div class="stage"><span id="stage">РАСЧИСТКА</span><span id="pct">0%</span></div><div class="progress"><i id="fill"></i></div><div class="sub"><span>Рабочие: <b id="workers">6</b></span><span>Объекты: <b id="completed">0</b></span></div></div><div class="actions"><button class="primary" id="hire">+ РАБОЧИЙ</button><button id="speed">СКОРОСТЬ ×1</button><button id="capacity">ГРУЗ ×1</button><button id="truck">ТЕХНИКА</button></div></div></div><script type="module">import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.167.1/three.module.min.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc8dc);scene.fog=new THREE.Fog(0xbed7e2,34,78);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,180);camera.position.set(21,17,23);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.getElementById('app').appendChild(renderer.domElement);document.getElementById('boot').remove();const hemi=new THREE.HemisphereLight(0xd9eeff,0x5b432d,1.45);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffd9a4,3.1);sun.position.set(-14,24,-10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-28;sun.shadow.camera.right=28;sun.shadow.camera.top=28;sun.shadow.camera.bottom=-28;scene.add(sun);const mk=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const M={grass:mk(0x4f743f,.96),dirt:mk(0x9a7048,1),road:mk(0x30353a,.9),concrete:mk(0xaeb5ba,.78),brick:mk(0xa84b2d,.95),brick2:mk(0xc46238,.92),wood:mk(0x8c5d30,.88),roof:mk(0x17384e,.48,.16),glass:new THREE.MeshPhysicalMaterial({color:0x62b3d5,roughness:.12,transmission:.35,transparent:true,opacity:.8}),orange:mk(0xf39a12,.55),dark:mk(0x202830,.7),steel:mk(0x6e7780,.5,.35),white:mk(0xd7d6cf,.8),soil:mk(0x694a31,1),yellow:mk(0xf5bf26,.62)};function box(n,p,s,m,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),m);o.name=n;o.position.set(...p);o.scale.set(...s);o.castShadow=o.receiveShadow=true;parent.add(o);return o}function cyl(p,r,h,m,parent=scene,seg=16){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),m);o.position.set(...p);o.castShadow=o.receiveShadow=true;parent.add(o);return o}function wheel(parent,x,z){const w=cyl([x,.42,z],.34,.24,M.dark,parent,20);w.rotation.x=Math.PI/2;return w}box('ground',[0,-.35,0],[38,.7,28],M.grass);box('site',[3,.02,1],[16,.12,11],M.dirt);box('road',[0,.03,-9],[38,.12,4],M.road);for(let x=-17;x<18;x+=3)box('stripe',[x,.1,-9],[1.4,.03,.14],M.yellow);for(let x=-6;x<=12;x+=2){box('fencePost',[x,.9,6.1],[.08,1.8,.08],M.steel);box('fenceRail',[x+1,.95,6.1],[2,.04,.04],M.steel)}box('office',[-11,1.6,3.7],[4.4,3.2,3.8],mk(0x31556d,.76));box('officeRoof',[-11,3.35,3.7],[4.8,.24,4.2],M.dark);box('officeWindow',[-8.75,1.8,3.0],[.1,1.05,1.4],M.glass);box('officeDoor',[-9,1.25,4.5],[.12,2.1,.9],mk(0x55351f,.85));for(let i=0;i<5;i++){const x=-7.9+(i%2)*1.7,z=-.5+Math.floor(i/2)*1.65,mt=[mk(0xc79a51,1),M.brick,M.white,M.wood,M.roof][i];box('stack',[x,.55,z],[1.45,1.05,1.2],mt);box('pallet',[x,.08,z],[1.55,.16,1.28],M.wood)}for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,r=5.6+Math.random()*2.2;box('debris',[3+Math.cos(a)*r,.12,1+Math.sin(a)*r],[.18+Math.random()*.35,.12+Math.random()*.18,.18+Math.random()*.45],i%3?M.wood:M.concrete)}function truck(){const g=new THREE.Group();box('chassis',[0,.65,0],[3.7,.45,1.5],M.dark,g);box('bed',[.75,1.35,0],[2.25,1.1,1.4],M.concrete,g);box('cab',[-1.35,1.35,0],[1.4,1.75,1.45],M.orange,g);box('wind',[-2.07,1.65,0],[.06,.75,1.1],M.glass,g);for(const x of[-1.45,1.05])for(const z of[-.8,.8])wheel(g,x,z);g.position.set(-8,0,-7.7);scene.add(g);return g}const deliveryTruck=truck();function excavator(){const g=new THREE.Group();box('tracks',[0,.45,0],[3.2,.55,2],M.dark,g);box('deck',[0,1,0],[2.2,.35,1.6],M.orange,g);box('cab',[-.55,2,0],[1.35,1.65,1.5],M.orange,g);box('glass',[-.55,2.1,-.78],[1.05,1.1,.05],M.glass,g);const a=box('boom',[1.05,2.65,0],[2.8,.3,.36],M.orange,g);a.rotation.z=-.38;const b=box('stick',[2.35,1.85,0],[2.0,.26,.3],M.orange,g);b.rotation.z=.55;const bucket=box('bucket',[3.18,1.05,0],[.9,.7,1.0],mk(0x8b5a24,.8),g);bucket.rotation.z=.28;g.position.set(10,0,4.2);scene.add(g);return g}const excav=excavator();function crane(){const g=new THREE.Group();box('base',[0,.5,0],[1.5,1,1.5],M.yellow,g);for(let y=1.2;y<10;y+=1.1){box('mast',[0,y,0],[.22,1,.22],M.yellow,g);box('cross',[0,y+.45,0],[1.1,.12,.12],M.yellow,g)}box('jib',[-3.2,10.2,0],[6.6,.22,.22],M.yellow,g);box('counter',[2.4,9.8,0],[1.4,.6,.9],M.concrete,g);box('cable',[-4.4,7.5,0],[.035,5.3,.035],M.dark,g);box('hook',[-4.4,4.75,0],[.25,.35,.25],M.dark,g);g.position.set(10,0,0);scene.add(g);return g}const tower=crane();const house=new THREE.Group();house.position.set(3,0,1);scene.add(house);const pieces=[];function add(o,s,e){o.visible=false;o.userData={s,e,target:o.scale.clone()};pieces.push(o);return o}add(box('excavation',[0,-.2,0],[7.6,.4,5.9],M.soil,house),.01,.05);for(let x=-3.2;x<=3.2;x+=.8){add(box('footingF',[x,.22,-2.55],[.72,.55,.55],M.concrete,house),.05,.11);add(box('footingB',[x,.22,2.55],[.72,.55,.55],M.concrete,house),.05,.11)}for(let z=-1.75;z<=1.75;z+=.8){add(box('footingL',[-3.45,.22,z],[.55,.55,.72],M.concrete,house),.08,.14);add(box('footingR',[3.45,.22,z],[.55,.55,.72],M.concrete,house),.08,.14)}add(box('slab0',[0,.62,0],[6.9,.28,5.2],M.concrete,house),.14,.22);function brickRow(y,mat,start,end,offset=0){for(let x=-2.85+offset;x<=2.85;x+=.75){if(Math.abs(x)<.55&&y<2.3)continue;add(box('brickF',[x,y,-2.45],[.68,.33,.38],mat,house),start,end);add(box('brickB',[x,y,2.45],[.68,.33,.38],mat,house),start,end)}for(let z=-1.7+offset;z<=1.7;z+=.75){add(box('brickL',[-3.25,y,z],[.38,.33,.68],mat,house),start,end);add(box('brickR',[3.25,y,z],[.38,.33,.68],mat,house),start,end)}}for(let r=0;r<8;r++)brickRow(.95+r*.36,M.brick,.22+r*.025,.47,r%2?.36:0);add(box('slab1',[0,3.85,0],[6.9,.3,5.2],M.concrete,house),.47,.55);for(let r=0;r<7;r++)brickRow(4.15+r*.36,M.brick2,.55+r*.022,.71,r%2?.36:0);for(let i=0;i<12;i++){const x=-3.05+i*.56;const l=box('rafterL',[x,6.8,-1.2],[.12,.16,3.5],M.wood,house);l.rotation.x=.64;add(l,.71+i*.004,.81);const rr=box('rafterR',[x,6.8,1.2],[.12,.16,3.5],M.wood,house);rr.rotation.x=-.64;add(rr,.71+i*.004,.81)}for(let i=0;i<12;i++){const x=-3.05+i*.56;const l=box('roofL',[x,7.05,-1.25],[.52,.12,3.65],M.roof,house);l.rotation.x=.64;add(l,.81+i*.004,.9);const rr=box('roofR',[x,7.05,1.25],[.52,.12,3.65],M.roof,house);rr.rotation.x=-.64;add(rr,.81+i*.004,.9)}add(box('chimney',[2.25,7.1,.65],[.75,1.7,.75],M.brick,house),.86,.93);function windowGroup(x,y){const g=new THREE.Group();box('glass',[0,0,0],[1.05,1.15,.1],M.glass,g);box('frameT',[0,.62,-.02],[1.18,.09,.15],M.white,g);box('frameB',[0,-.62,-.02],[1.18,.09,.15],M.white,g);box('frameL',[-.59,0,-.02],[.09,1.32,.15],M.white,g);box('frameR',[.59,0,-.02],[.09,1.32,.15],M.white,g);box('frameC',[0,0,-.02],[.07,1.25,.15],M.white,g);g.position.set(x,y,-2.72);house.add(g);return g}for(const x of[-2,0,2]){add(windowGroup(x,2.25),.9,.96);add(windowGroup(x,5.1),.92,.97)}add(box('door',[0,1.9,-2.76],[1.15,2.25,.18],mk(0x56301b,.82),house),.93,.97);for(let i=0;i<10;i++)add(box('path',[0,.08,-3.2-i*.5],[1.35,.08,.38],M.concrete,house),.97,1);for(let x=-4;x<=4;x+=2){box('scaffold',[x,2.6,-3.3],[.08,5.2,.08],M.steel,house);box('scaffold2',[x,2.6,3.3],[.08,5.2,.08],M.steel,house)}for(let y=.8;y<5;y+=1.1){box('scaffoldRail',[0,y,-3.3],[8,.06,.06],M.steel,house);box('scaffoldRail2',[0,y,3.3],[8,.06,.06],M.steel,house)}const workers=[];function makeWorker(i){const g=new THREE.Group();const shirt=[0xf39a12,0xf1c22a,0x3979aa,0xe56d2a][i%4];const body=box('body',[0,1.15,0],[.42,.72,.3],mk(shirt,.72),g);const head=cyl([0,1.78,0],.18,.34,mk(0xd5a47d,.8),g,20);const helmet=new THREE.Mesh(new THREE.SphereGeometry(.24,16,8,0,Math.PI*2,0,Math.PI/2),M.yellow);helmet.position.set(0,2.0,0);helmet.castShadow=true;g.add(helmet);const la=box('armL',[-.29,1.2,0],[.12,.62,.12],mk(shirt,.72),g),ra=box('armR',[.29,1.2,0],[.12,.62,.12],mk(shirt,.72),g),ll=box('legL',[-.13,.48,0],[.14,.72,.17],M.dark,g),rl=box('legR',[.13,.48,0],[.14,.72,.17],M.dark,g);const cargo=box('cargo',[0,1.25,.42],[.42,.38,.42],[mk(0xc89b50,1),M.brick,M.white,M.wood,M.roof][i%5],g);g.userData={t:Math.random(),dir:1,lane:(i%6)-2.5,phase:Math.random()*6,cargo,la,ra,ll,rl};scene.add(g);workers.push(g)}const state={money:12450,sand:2450,brick:1860,cement:980,wood:1540,workerCount:6,speed:1,capacity:1,progress:0,completed:0,truck:true};try{Object.assign(state,JSON.parse(localStorage.getItem('eliteroof4')||'{}'))}catch(e){}for(let i=0;i<state.workerCount;i++)makeWorker(i);const stages=[['РАСЧИСТКА',0],['ФУНДАМЕНТ',.05],['ПОЛ',.18],['СТЕНЫ 1 ЭТАЖА',.22],['ПЕРЕКРЫТИЕ',.47],['СТЕНЫ 2 ЭТАЖА',.55],['КРЫША — КАРКАС',.71],['КРЫША — ПОКРЫТИЕ',.81],['ОТДЕЛКА',.9],['ГОТОВО',.97]];function stage(){for(let i=stages.length-1;i>=0;i--)if(state.progress>=stages[i][1])return stages[i][0];return stages[0][0]}function sync(){while(workers.length<state.workerCount)makeWorker(workers.length)}function deliver(){state.progress=Math.min(1,state.progress+.0023*state.capacity);state.money+=5*state.capacity;if(state.progress>=1){state.completed++;state.money+=1800;show('Дом завершён! +1800');setTimeout(()=>{if(state.progress>=1)state.progress=0},3000)}}function show(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>e.classList.remove('show'),1500)}hire.onclick=()=>{const c=300+state.workerCount*100;if(state.money>=c){state.money-=c;state.workerCount++;sync();show('Нанят рабочий')}else show('Не хватает денег')};speed.onclick=()=>{const n=state.speed===1?2:state.speed===2?4:1,c=n===1?0:n*800;if(n===1||state.money>=c){state.money-=c;state.speed=n}else show('Не хватает денег')};capacity.onclick=()=>{const c=800*state.capacity;if(state.money>=c){state.money-=c;state.capacity++;show('Груз увеличен')}else show('Не хватает денег')};truck.onclick=()=>{if(state.money>=250){state.money-=250;state.progress=Math.min(1,state.progress+.035);show('Доставка +3.5%')}else show('Не хватает денег')};let yaw=.72,pitch=.58,dist=30,target=new THREE.Vector3(2,2.8,0),pointers=new Map(),pinch=0;renderer.domElement.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const o=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){yaw-=(e.clientX-o.x)*.006;pitch=Math.max(.28,Math.min(1.1,pitch-(e.clientY-o.y)*.004))}else{const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)dist=Math.max(18,Math.min(42,dist-(d-pinch)*.025));pinch=d}});function end(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=0}renderer.domElement.addEventListener('pointerup',end);renderer.domElement.addEventListener('pointercancel',end);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;deliveryTruck.position.x=-11+((now*.0018)%26);excav.rotation.y=Math.sin(now*.00035)*.08;tower.rotation.y=Math.sin(now*.00012)*.08;for(const p of pieces){const u=(state.progress-p.userData.s)/(p.userData.e-p.userData.s);p.visible=u>0;if(p.visible){const k=Math.min(1,Math.max(.02,u));p.scale.copy(p.userData.target).multiplyScalar(.25+.75*k)}}workers.forEach((w,i)=>{const u=w.userData;u.t+=dt*.075*state.speed*u.dir;if(u.t>=1){u.t=1;u.dir=-1;u.cargo.visible=false;deliver()}if(u.t<=0){u.t=0;u.dir=1;u.cargo.visible=true}const sx=-7.5,sz=-1.5+u.lane*.55,ex=-1.2,ez=-1.4+u.lane*.48;w.position.set(sx+(ex-sx)*u.t,0,sz+(ez-sz)*u.t);w.rotation.y=u.dir>0?Math.PI/2:-Math.PI/2;const a=Math.sin(now*.009+u.phase)*.42;u.ll.rotation.x=a;u.rl.rotation.x=-a;u.la.rotation.x=-a*.7;u.ra.rotation.x=a*.7});camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*dist,target.y+Math.sin(pitch)*dist,target.z+Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(target);const pct=Math.round(state.progress*100);document.getElementById('pct').textContent=pct+'%';fill.style.width=pct+'%';document.getElementById('stage').textContent=stage();workers.textContent=state.workerCount;completed.textContent=state.completed;money.textContent=Math.floor(state.money).toLocaleString('ru-RU');speed.textContent='СКОРОСТЬ ×'+state.speed;capacity.textContent='ГРУЗ ×'+state.capacity;mission.textContent=state.progress<.22?'Залить фундамент и плиту':state.progress<.55?'Возвести первый этаж':state.progress<.81?'Собрать второй этаж и стропила':state.progress<.97?'Закрыть кровлю и поставить окна':'Завершить благоустройство';renderer.render(scene,camera);requestAnimationFrame(loop)}setInterval(()=>localStorage.setItem('eliteroof4',JSON.stringify(state)),2500);requestAnimationFrame(loop);</script></body></html>
