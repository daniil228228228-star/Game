<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0d151d"><title>EliteRoof Idle — Fixed Joystick</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d151d}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.joy2{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);width:105px;height:105px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.28);z-index:9999;touch-action:none;-webkit-user-select:none;user-select:none}.knob2{position:absolute;left:30px;top:30px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 4px 14px rgba(0,0,0,.5);pointer-events:none}.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);z-index:9999;background:rgba(7,11,16,.84);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 12px;font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;pointer-events:none;opacity:.9}</style></head><body><iframe id="gameFrame" src="./v9-safe.html"></iframe><div id="joy2" class="joy2"><div id="knob2" class="knob2"></div></div><div class="hint">Джойстик исправлен — веди пальцем</div><script>const frame=document.getElementById('gameFrame'),joy=document.getElementById('joy2'),knob=document.getElementById('knob2');let active=false,nx=0,ny=0,raf=0;function center(){return joy.getBoundingClientRect()}function updateFromPoint(clientX,clientY){const r=center(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=clientX-cx,dy=clientY-cy,max=31,len=Math.hypot(dx,dy)||1,k=Math.min(1,max/len);nx=dx*k/max;ny=dy*k/max;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`}function reset(){active=false;nx=ny=0;knob.style.transform='translate(0,0)'}function start(clientX,clientY){active=true;updateFromPoint(clientX,clientY);const d=frame.contentDocument;if(d){const auto=d.getElementById('auto');if(auto&&auto.textContent.includes('ВКЛ'))auto.click();const oldJoy=d.getElementById('joy');if(oldJoy)oldJoy.style.opacity='0'}}function tick(){if(active){try{const d=frame.contentDocument,innerJoy=d&&d.getElementById('joy');if(innerJoy&&typeof innerJoy.onpointermove==='function'){innerJoy.setPointerCapture=()=>{};const r=innerJoy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;innerJoy.onpointermove({clientX:cx+nx*31,clientY:cy+ny*31,pointerId:1,preventDefault(){}})}}catch(e){}}raf=requestAnimationFrame(tick)}frame.addEventListener('load',()=>{try{const d=frame.contentDocument,innerJoy=d.getElementById('joy');if(innerJoy){innerJoy.style.opacity='0';innerJoy.style.pointerEvents='none'}const auto=d.getElementById('auto');if(auto&&auto.textContent.includes('ВКЛ'))auto.click()}catch(e){}});joy.addEventListener('pointerdown',e=>{e.preventDefault();joy.setPointerCapture?.(e.pointerId);start(e.clientX,e.clientY)},{passive:false});joy.addEventListener('pointermove',e=>{if(!active)return;e.preventDefault();updateFromPoint(e.clientX,e.clientY)},{passive:false});joy.addEventListener('pointerup',e=>{e.preventDefault();reset()},{passive:false});joy.addEventListener('pointercancel',reset);joy.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];start(t.clientX,t.clientY)},{passive:false});joy.addEventListener('touchmove',e=>{e.preventDefault();if(!active)return;const t=e.touches[0];updateFromPoint(t.clientX,t.clientY)},{passive:false});joy.addEventListener('touchend',e=>{e.preventDefault();reset()},{passive:false});tick();</script></body></html>
