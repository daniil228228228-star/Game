<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090d12">
<title>EliteRoof Idle Babylon</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d12;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}#game{width:100%;height:100%;display:block;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none}.panel{background:rgba(7,10,14,.88);border:1px solid rgba(255,255,255,.13);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.35);backdrop-filter:blur(14px)}.top{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 8px);display:grid;grid-template-columns:auto 1fr;gap:8px}.brand{padding:11px 14px;font-weight:900;line-height:.95}.brand b{color:#ffad16}.brand small{display:block;font-size:8px;letter-spacing:2.8px;color:#b7c0c8;margin-top:5px}.res{display:flex;justify-content:space-around;padding:8px}.r{text-align:center;min-width:54px}.r strong{display:block;font-size:13px}.r small{font-size:8px;color:#9da7b1}.bottom{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.progressBox{padding:11px 13px}.stage{display:flex;justify-content:space-between;font-size:12px;font-weight:900}.progress{height:11px;background:#26313b;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8d00,#ffc52c)}.sub{display:flex;justify-content:space-between;font-size:9px;color:#a8b2bc;margin-top:6px}.actions{display:grid;grid-template-columns:repeat(2,94px);gap:7px;pointer-events:auto}button{border:1px solid rgba(255,255,255,.11);border-radius:14px;background:rgba(13,19,27,.96);color:#fff;padding:10px 8px;font-weight:800;font-size:9px}button.primary{background:linear-gradient(#ffc630,#ef8500);color:#211303}.boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#090d12;z-index:20;padding:32px;text-align:center;font:700 15px -apple-system}.toast{position:absolute;left:50%;top:20%;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:rgba(7,10,14,.94);border:1px solid rgba(255,255,255,.1);font-size:10px;opacity:0;transition:.25s}.toast.show{opacity:1}@media(max-width:700px){.brand{font-size:12px}.res .r:nth-child(4){display:none}.actions{grid-template-columns:repeat(2,84px)}}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="boot" class="boot">Загрузка Babylon.js…</div>
<div class="ui"><div class="top"><div class="panel brand">Elite<b>Roof</b><small>CONSTRUCTION</small></div><div class="panel res"><div class="r"><strong id="sand">2450</strong><small>ПЕСОК</small></div><div class="r"><strong id="brick">1860</strong><small>КИРПИЧ</small></div><div class="r"><strong id="cement">980</strong><small>ЦЕМЕНТ</small></div><div class="r"><strong id="wood">1540</strong><small>ДОСКИ</small></div><div class="r"><strong id="money">12450</strong><small>ДЕНЬГИ</small></div></div></div><div class="toast" id="toast"></div><div class="bottom"><div class="panel progressBox"><div class="stage"><span id="stage">РАСЧИСТКА</span><span id="pct">0%</span></div><div class="progress"><i id="fill"></i></div><div class="sub"><span>Один строитель • полный автомат</span><span>Объекты: <b id="completed">0</b></span></div></div><div class="actions"><button class="primary" id="speedBtn">СКОРОСТЬ</button><button id="cargoBtn">ГРУЗ</button><button id="incomeBtn">ДОХОД</button><button id="deliveryBtn">ДОСТАВКА</button></div></div></div>
<script>
const sources=[
 'https://cdn.babylonjs.com/babylon.js',
 'https://cdn.jsdelivr.net/npm/babylonjs@9.18.0/babylon.js',
 'https://unpkg.com/babylonjs@9.18.0/babylon.js'
];
const boot=document.getElementById('boot');
function loadEngine(i=0){
 if(i>=sources.length){boot.innerHTML='Не удалось загрузить 3D-движок.<br><small style="font-weight:500;color:#b7c0c8">Открой страницу в Safari и отключи блокировщик контента для этого сайта.</small>';return}
 boot.textContent='Загрузка 3D-движка '+(i+1)+'/'+sources.length+'…';
 const s=document.createElement('script');s.src=sources[i];s.async=true;s.onload=()=>window.BABYLON?start():loadEngine(i+1);s.onerror=()=>loadEngine(i+1);document.head.appendChild(s)
}
function start(){
 try{
 const canvas=document.getElementById('game');const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,antialias:true,adaptToDeviceRatio:true});engine.setHardwareScalingLevel(Math.max(1,window.devicePixelRatio/1.6));const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.38,.57,.66,1);scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;scene.fogDensity=.008;scene.fogColor=new BABYLON.Color3(.52,.66,.71);
 const camera=new BABYLON.ArcRotateCamera('cam',-.82,1.05,30,new BABYLON.Vector3(1,2.8,0),scene);camera.attachControl(canvas,true);camera.lowerRadiusLimit=15;camera.upperRadiusLimit=42;camera.lowerBetaLimit=.55;camera.upperBetaLimit=1.25;camera.wheelPrecision=25;camera.panningSensibility=0;
 new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene).intensity=.72;const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.45,-1,.35),scene);sun.position=new BABYLON.Vector3(-18,26,-14);sun.intensity=2.1;const shadow=new BABYLON.ShadowGenerator(1024,sun);shadow.useBlurExponentialShadowMap=true;shadow.blurKernel=18;
 function mat(name,color,rough=.85,metal=0){const m=new BABYLON.PBRMaterial(name,scene);m.albedoColor=BABYLON.Color3.FromHexString(color);m.roughness=rough;m.metallic=metal;return m}
 const M={grass:mat('grass','#45643d',1),dirt:mat('dirt','#7d5638',1),road:mat('road','#252b30',.92),concrete:mat('concrete','#a6aaac',.88),brick:mat('brick','#9c4026',.94),brick2:mat('brick2','#b85b34',.92),wood:mat('wood','#7d4d28',.86),roof:mat('roof','#162e40',.56,.12),glass:mat('glass','#3a8eb5',.18,.05),orange:mat('orange','#e58a0b',.62),dark:mat('dark','#141a20',.82),white:mat('white','#d6d0c4',.86),yellow:mat('yellow','#f4b91c',.72),soil:mat('soil','#553926',1)};
 function box(name,pos,scale,material,parent){const o=BABYLON.MeshBuilder.CreateBox(name,{size:1},scene);o.position=new BABYLON.Vector3(...pos);o.scaling=new BABYLON.Vector3(...scale);o.material=material;o.receiveShadows=true;shadow.addShadowCaster(o);if(parent)o.parent=parent;return o}
 box('ground',[0,-.5,0],[44,1,34],M.grass);box('site',[2,.02,1],[25,.12,20],M.dirt);box('road',[0,.03,-12],[44,.12,5],M.road);for(let x=-19;x<20;x+=4)box('stripe',[x,.11,-12],[1.8,.03,.18],M.yellow);
 for(let i=-10;i<=10;i++){box('fence',[i*1.35,.8,10.5],[.08,1.6,.08],M.dark);if(i<10)box('rail',[i*1.35+.65,.9,10.5],[1.25,.05,.05],M.dark)}
 box('warehouse',[-13,1.8,4],[5,3.6,4],mat('warehouse','#29485a',.76));box('roof',[-13,3.75,4],[5.5,.25,4.5],M.dark);
 function pallet(x,z,type){box('pallet',[x,.18,z],[1.7,.22,1.25],M.wood);if(type===0){for(let i=0;i<15;i++)box('brickStack',[x+(i%5)*.3-.6,.45+Math.floor(i/5)*.24,z],[.26,.2,.45],M.brick)}else if(type===1){for(let i=0;i<8;i++)box('cement',[x+(i%2)*.45-.2,.4+Math.floor(i/2)*.22,z],[.38,.18,.62],M.white)}else{for(let i=0;i<7;i++)box('boards',[x,.36+i*.13,z],[1.55,.1,.95],type===2?M.wood:M.roof)}}pallet(-8,1,0);pallet(-8,3.2,1);pallet(-8,5.4,2);pallet(-5.8,5.4,3);
 const house=new BABYLON.TransformNode('house',scene);house.position=new BABYLON.Vector3(3,0,1);const pieces=[];function add(o,s,e){o.setEnabled(false);o.metadata={s,e,base:o.scaling.y};pieces.push(o);return o}
 add(box('excavation',[0,-.28,0],[8,.55,6.2],M.soil,house),.01,.04);for(let x=-3.3;x<=3.3;x+=1.1){add(box('foundation',[x,.3,-2.7],[.95,.6,.55],M.concrete,house),.04,.13);add(box('foundation',[x,.3,2.7],[.95,.6,.55],M.concrete,house),.04,.13)}for(let z=-1.7;z<=1.7;z+=1.1){add(box('foundation',[-3.7,.3,z],[.55,.6,.95],M.concrete,house),.04,.13);add(box('foundation',[3.7,.3,z],[.55,.6,.95],M.concrete,house),.04,.13)}add(box('floor',[0,.78,0],[7.3,.35,5.4],M.concrete,house),.13,.22);
 function row(y,second,start,end){const mm=second?M.brick2:M.brick;const off=(Math.round(y*10)%2)*.42;for(let x=-3.2+off;x<=3.2;x+=.84){add(box('brick',[x,y,-2.52],[.76,.34,.42],mm,house),start,end);add(box('brick',[x,y,2.52],[.76,.34,.42],mm,house),start,end)}for(let z=-1.75+off;z<=1.75;z+=.84){add(box('brick',[-3.48,y,z],[.42,.34,.76],mm,house),start,end);add(box('brick',[3.48,y,z],[.42,.34,.76],mm,house),start,end)}}for(let r=0;r<7;r++)row(1.05+r*.38,false,.22+r*.025,.43);add(box('slab',[0,3.75,0],[7.4,.35,5.4],M.concrete,house),.43,.51);for(let r=0;r<6;r++)row(4.05+r*.38,true,.51+r*.027,.68);
 for(let i=0;i<15;i++){const x=-3.2+i*.46;const a=box('rafter',[x,6.65,-1.45],[.1,.13,3.65],M.wood,house);a.rotation.x=.62;add(a,.68+i*.004,.8);const b=box('rafter',[x,6.65,1.45],[.1,.13,3.65],M.wood,house);b.rotation.x=-.62;add(b,.68+i*.004,.8)}for(let i=0;i<14;i++){const x=-3.15+i*.49;const a=box('roofTile',[x,6.95,-1.5],[.44,.12,3.78],M.roof,house);a.rotation.x=.62;add(a,.8+i*.004,.9);const b=box('roofTile',[x,6.95,1.5],[.44,.12,3.78],M.roof,house);b.rotation.x=-.62;add(b,.8+i*.004,.9)}
 for(const x of[-2.2,0,2.2]){add(box('window',[x,2.1,-2.78],[1.05,1.2,.12],M.glass,house),.9,.96);add(box('window',[x,5,-2.78],[1.05,1.1,.12],M.glass,house),.91,.96)}add(box('door',[0,1.9,-2.82],[1.25,2.3,.16],mat('door','#4d2b18',.8),house),.93,.97);for(let i=0;i<9;i++)add(box('path',[0,.1,-3.2-i*.55],[1.5,.1,.42],M.concrete,house),.97,1);
 const player=new BABYLON.TransformNode('player',scene);box('body',[0,1,0],[.48,.78,.34],M.orange,player);const head=BABYLON.MeshBuilder.CreateSphere('head',{diameter:.42,segments:12},scene);head.position=new BABYLON.Vector3(0,1.62,0);head.material=mat('skin','#d8a27d',.8);head.parent=player;shadow.addShadowCaster(head);const helmet=BABYLON.MeshBuilder.CreateSphere('helmet',{diameter:.55,segments:12,slice:.5},scene);helmet.position=new BABYLON.Vector3(0,1.82,0);helmet.material=M.yellow;helmet.parent=player;shadow.addShadowCaster(helmet);const la=box('arm',[-.35,1.03,0],[.16,.68,.18],head.material,player),ra=box('arm',[.35,1.03,0],[.16,.68,.18],head.material,player),ll=box('leg',[-.15,.35,0],[.18,.72,.22],M.dark,player),rl=box('leg',[.15,.35,0],[.18,.72,.22],M.dark,player),cargo=box('cargo',[0,1.15,.42],[.65,.48,.52],M.brick,player);
 const state={money:12450,sand:2450,brick:1860,cement:980,wood:1540,progress:0,completed:0,speed:1,cargo:1,income:1,t:0,dir:1};try{Object.assign(state,JSON.parse(localStorage.getItem('er_babylon_v7')||'{}'))}catch(e){}
 const stages=[['РАСЧИСТКА',0],['ФУНДАМЕНТ',.04],['ПОЛ',.13],['СТЕНЫ 1 ЭТАЖА',.22],['ПЕРЕКРЫТИЕ',.43],['СТЕНЫ 2 ЭТАЖА',.51],['КРЫША — КАРКАС',.68],['КРЫША — ПОКРЫТИЕ',.8],['ОТДЕЛКА',.9],['ГОТОВО',.97]];function stage(){let s=stages[0][0];for(const x of stages)if(state.progress>=x[1])s=x[0];return s}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1300)}function buy(k,cost,step){if(state.money<cost)return toast('Не хватает денег');state.money-=cost;state[k]+=step;toast('Улучшение куплено')}
 document.getElementById('speedBtn').onclick=()=>buy('speed',Math.round(600*state.speed),.25);document.getElementById('cargoBtn').onclick=()=>buy('cargo',700*state.cargo,1);document.getElementById('incomeBtn').onclick=()=>buy('income',800*state.income,1);document.getElementById('deliveryBtn').onclick=()=>{if(state.money<1500)return toast('Нужно $1500');state.money-=1500;state.progress=Math.min(1,state.progress+.04);toast('Материалы доставлены')};
 let last=performance.now();engine.runRenderLoop(()=>{const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;state.t+=dt*.12*state.speed*state.dir;if(state.t>=1){state.t=1;state.dir=-1;state.progress=Math.min(1,state.progress+.0045*state.cargo);state.money+=4*state.cargo*state.income;if(state.progress>=1){state.completed++;state.money+=2000+state.completed*250;toast('Дом готов!');setTimeout(()=>{if(state.progress>=1)state.progress=0},1800)}}if(state.t<=0){state.t=0;state.dir=1}const ax=-6.7,bx=-.7;player.position.x=ax+(bx-ax)*state.t;player.position.z=-1.1;player.rotation.y=state.dir>0?Math.PI/2:-Math.PI/2;const walk=Math.sin(now*.012*state.speed);la.rotation.x=walk*.75;ra.rotation.x=-walk*.75;ll.rotation.x=-walk*.65;rl.rotation.x=walk*.65;player.position.y=Math.abs(walk)*.035;cargo.setEnabled(state.dir>0);for(const p of pieces){const q=Math.max(0,Math.min(1,(state.progress-p.metadata.s)/(p.metadata.e-p.metadata.s)));p.setEnabled(q>0);p.scaling.y=p.metadata.base*Math.max(.04,q)}document.getElementById('money').textContent=Math.floor(state.money).toLocaleString('ru');document.getElementById('stage').textContent=stage();const pc=Math.round(state.progress*100);document.getElementById('pct').textContent=pc+'%';document.getElementById('fill').style.width=pc+'%';document.getElementById('completed').textContent=state.completed;scene.render()});setInterval(()=>localStorage.setItem('er_babylon_v7',JSON.stringify(state)),2000);addEventListener('resize',()=>engine.resize());boot.remove();
 }catch(err){boot.innerHTML='Ошибка запуска: '+err.message;console.error(err)}
}
loadEngine();
</script>
</body></html>
