<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EliteRoof 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f14;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 8px);display:grid;grid-template-columns:auto 1fr auto;gap:8px}.card{background:rgba(8,12,18,.88);border:1px solid rgba(255,255,255,.11);border-radius:15px;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.28)}.brand{padding:10px 12px;font-weight:900}.brand b{color:#ffad1a}.brand small{display:block;font-size:8px;letter-spacing:2.2px;color:#b9c2cb;margin-top:3px}.res{display:flex;justify-content:space-around;padding:8px}.r{text-align:center;min-width:45px}.r strong{display:block;font-size:12px}.r small{font-size:8px;color:#9ba6b0}.level{padding:8px 12px}.level small{font-size:8px;color:#9ba6b0}.level strong{display:block}.mission{position:absolute;left:10px;top:100px;padding:8px 10px;font-size:10px}.mission b{display:block;color:#ffb31e;margin-bottom:3px}.bottom{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.progressCard{padding:10px 12px}.stage{display:flex;justify-content:space-between;font-size:12px;font-weight:900}.progress{height:11px;background:#27313a;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8d00,#ffc22e)}.sub{display:flex;justify-content:space-between;font-size:9px;color:#aeb8c2;margin-top:6px}.actions{display:grid;grid-template-columns:repeat(2,92px);gap:7px;pointer-events:auto}button{border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(14,21,29,.96);color:#fff;padding:10px 8px;font-weight:800;font-size:9px}button.primary{background:linear-gradient(#ffc32f,#f28b00);color:#231502}.toast{position:absolute;left:50%;top:20%;transform:translateX(-50%);background:rgba(8,12,18,.92);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:8px 11px;font-size:10px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:700px){.level{display:none}.res .r:nth-child(4){display:none}.brand{font-size:12px}.actions{grid-template-columns:repeat(2,84px)}}
</style>
</head>
<body>
<div id="app"></div><div class="ui"><div class="top"><div class="card brand">Elite<b>Roof</b><small>CONSTRUCTION</small></div><div class="card res"><div class="r"><strong id="sand">2450</strong><small>ПЕСОК</small></div><div class="r"><strong id="brick">1860</strong><small>КИРПИЧ</small></div><div class="r"><strong id="cement">980</strong><small>ЦЕМЕНТ</small></div><div class="r"><strong id="wood">1540</strong><small>ДОСКИ</small></div><div class="r"><strong id="money">12450</strong><small>ДЕНЬГИ</small></div></div><div class="card level"><small>УРОВЕНЬ</small><strong>12</strong></div></div><div class="card mission"><b>ТЕКУЩАЯ ЗАДАЧА</b><span id="mission">Доставка материалов</span></div><div class="toast" id="toast"></div><div class="bottom"><div class="card progressCard"><div class="stage"><span id="stage">ФУНДАМЕНТ</span><span id="pct">0%</span></div><div class="progress"><i id="fill"></i></div><div class="sub"><span>Рабочие: <b id="workers">5</b></span><span>Объекты: <b id="completed">0</b></span></div></div><div class="actions"><button class="primary" id="hire">+ РАБОЧИЙ</button><button id="speed">СКОРОСТЬ ×1</button><button id="capacity">ГРУЗ ×1</button><button id="truck">ГРУЗОВИК</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.min.js"></script>
<script>
(()=>{const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec9df);scene.fog=new THREE.FogExp2(0xbfd9e6,.018);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,200);camera.position.set(18,16,20);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.getElementById('app').appendChild(renderer.domElement);const hemi=new THREE.HemisphereLight(0xcfe8ff,0x5f4931,1.7);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffdfaa,3.2);sun.position.set(-12,22,-8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-25;sun.shadow.camera.right=25;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;scene.add(sun);const mats={grass:new THREE.MeshStandardMaterial({color:0x557a43,roughness:.95}),dirt:new THREE.MeshStandardMaterial({color:0x9b7149,roughness:1}),road:new THREE.MeshStandardMaterial({color:0x2f3439,roughness:.9}),concrete:new THREE.MeshStandardMaterial({color:0xaeb4b8,roughness:.82}),brick:new THREE.MeshStandardMaterial({color:0xa94d2e,roughness:.92}),brick2:new THREE.MeshStandardMaterial({color:0xc26339,roughness:.9}),wood:new THREE.MeshStandardMaterial({color:0x8e5f32,roughness:.85}),roof:new THREE.MeshStandardMaterial({color:0x17384f,roughness:.58,metalness:.12}),glass:new THREE.MeshStandardMaterial({color:0x4aa2c9,roughness:.2,metalness:.08}),orange:new THREE.MeshStandardMaterial({color:0xf39a12,roughness:.6}),dark:new THREE.MeshStandardMaterial({color:0x1b232b,roughness:.75}),white:new THREE.MeshStandardMaterial({color:0xd9d8d1,roughness:.8})};function box(n,p,s,m,parent=scene){const x=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),m);x.name=n;x.position.set(...p);x.scale.set(...s);x.castShadow=x.receiveShadow=true;parent.add(x);return x}function cyl(p,r,h,m,parent=scene){const x=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),m);x.position.set(...p);x.castShadow=x.receiveShadow=true;parent.add(x);return x}box('ground',[0,-.35,0],[34,.7,26],mats.grass);box('site',[3,.02,1],[14,.12,10],mats.dirt);box('road',[0,.03,-9],[34,.12,4],mats.road);for(let x=-15;x<16;x+=3)box('stripe',[x,.1,-9],[1.4,.03,.15],new THREE.MeshStandardMaterial({color:0xeec04a}));box('warehouse',[-11,1.6,3.8],[4,3.2,3.6],new THREE.MeshStandardMaterial({color:0x31556d,roughness:.75}));box('wh-roof',[-11,3.35,3.8],[4.5,.25,4.1],mats.dark);box('window',[-9,1.7,2],[1,.9,.08],mats.glass);for(let i=0;i<5;i++){const x=-7.7+(i%2)*1.7,z=-.3+Math.floor(i/2)*1.6,mt=[new THREE.MeshStandardMaterial({color:0xc69a50}),mats.brick,mats.white,mats.wood,mats.roof][i];box('stack'+i,[x,.55,z],[1.4,1.05,1.2],mt)}for(let x=-1;x<=7;x+=2){box('pole',[x,2.2,5],[.08,4.4,.08],mats.dark);box('pole2',[x,2.2,-3],[.08,4.4,.08],mats.dark)}for(let y=1;y<=4;y+=1.3){box('bar',[3,y,5],[8,.08,.08],mats.dark);box('bar2',[3,y,-3],[8,.08,.08],mats.dark)}function truck(){const g=new THREE.Group();box('body',[0,1,0],[3,1.3,1.4],mats.orange,g);box('cab',[-1.6,1.1,0],[1.2,1.5,1.35],mats.orange,g);for(const x of[-1.5,1])for(const z of[-.75,.75]){const w=cyl([x,.45,z],.34,.22,mats.dark,g);w.rotation.x=Math.PI/2}g.position.set(-8,0,-7.7);scene.add(g);return g}const deliveryTruck=truck();function excavator(){const g=new THREE.Group();box('base',[0,.6,0],[2.8,.6,1.8],mats.dark,g);box('cabin',[-.4,1.7,0],[1.4,1.6,1.5],mats.orange,g);const a=box('arm',[1,2.5,0],[2.8,.28,.3],mats.orange,g);a.rotation.z=-.35;const b=box('bucket',[2.35,1.8,0],[.8,.6,.8],mats.orange,g);b.rotation.z=.25;g.position.set(9,0,4);scene.add(g);return g}const excav=excavator();const house=new THREE.Group();house.position.set(3,0,1);scene.add(house);const pieces=[];function addPiece(o,s,e){o.visible=false;o.userData={start:s,end:e,baseY:o.scale.y};pieces.push(o);return o}addPiece(box('excavation',[0,-.2,0],[7,.4,5.4],new THREE.MeshStandardMaterial({color:0x6d4e34}),house),.01,.05);addPiece(box('foundation',[0,.35,0],[6.8,.7,5.2],mats.concrete,house),.05,.18);addPiece(box('floor',[0,.82,0],[6.5,.28,4.9],mats.wood,house),.18,.28);function wallRow(y,m,s,e){for(let x=-2.7;x<=2.7;x+=.9){addPiece(box('brickF',[x,y,-2.25],[.78,.46,.42],m,house),s,e);addPiece(box('brickB',[x,y,2.25],[.78,.46,.42],m,house),s,e)}for(let z=-1.55;z<=1.55;z+=.9){addPiece(box('brickL',[-3.05,y,z],[.42,.46,.78],m,house),s,e);addPiece(box('brickR',[3.05,y,z],[.42,.46,.78],m,house),s,e)}}for(let r=0;r<5;r++)wallRow(1.05+r*.5,mats.brick,.28+r*.03,.47);addPiece(box('slab',[0,3.55,0],[6.6,.3,5],mats.concrete,house),.47,.56);for(let r=0;r<4;r++)wallRow(3.85+r*.5,mats.brick2,.56+r*.035,.71);for(let i=0;i<10;i++){const x=-2.8+i*.62,l=box('rafterL',[x,6,-1.15],[.12,.16,3.2],mats.wood,house);l.rotation.x=.62;addPiece(l,.71+i*.005,.81);const r=box('rafterR',[x,6,1.15],[.12,.16,3.2],mats.wood,house);r.rotation.x=-.62;addPiece(r,.71+i*.005,.81)}for(let i=0;i<10;i++){const x=-2.8+i*.62,l=box('roofL',[x,6.3,-1.2],[.56,.12,3.35],mats.roof,house);l.rotation.x=.62;addPiece(l,.81+i*.004,.90);const r=box('roofR',[x,6.3,1.2],[.56,.12,3.35],mats.roof,house);r.rotation.x=-.62;addPiece(r,.81+i*.004,.90)}for(const x of[-2,0,2]){addPiece(box('win',[x,2,-2.5],[1,1.1,.12],mats.glass,house),.90,.97);addPiece(box('win2',[x,4.75,-2.5],[1,1,.12],mats.glass,house),.92,.97)}addPiece(box('door',[0,1.75,-2.55],[1.1,2.1,.16],new THREE.MeshStandardMaterial({color:0x583019}),house),.94,.97);for(let i=0;i<8;i++)addPiece(box('path',[0,.08,-3.1-i*.55],[1.3,.08,.42],mats.concrete,house),.97,1);const workers=[];function makeWorker(i){const g=new THREE.Group();box('body',[0,.9,0],[.42,.75,.3],new THREE.MeshStandardMaterial({color:i%3===0?0xf4a11a:i%3===1?0xf0c22d:0xe56d2a}),g);cyl([0,1.45,0],.18,.35,new THREE.MeshStandardMaterial({color:0xd6a47c}),g);const h=new THREE.Mesh(new THREE.SphereGeometry(.23,16,8,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0xffd126}));h.position.set(0,1.62,0);h.castShadow=true;g.add(h);const cargo=box('cargo',[0,1,.33],[.4,.35,.4],[new THREE.MeshStandardMaterial({color:0xc99b50}),mats.brick,mats.white,mats.wood,mats.roof][i%5],g);g.userData={t:Math.random(),dir:1,lane:(i%6)-2.5,cargo,phase:Math.random()*6};scene.add(g);workers.push(g)}const state={money:12450,sand:2450,brick:1860,cement:980,wood:1540,workerCount:5,speed:1,capacity:1,progress:0,completed:0,truck:false};try{Object.assign(state,JSON.parse(localStorage.getItem('eliteroof3d')||'{}'))}catch(e){}for(let i=0;i<state.workerCount;i++)makeWorker(i);const stages=[['РАСЧИСТКА',0],['ФУНДАМЕНТ',.05],['ПОЛ',.18],['СТЕНЫ 1 ЭТАЖА',.28],['ПЕРЕКРЫТИЕ',.47],['СТЕНЫ 2 ЭТАЖА',.56],['КРЫША — КАРКАС',.71],['КРЫША — ПОКРЫТИЕ',.81],['ОТДЕЛКА',.90],['ГОТОВО',.97]];function stageName(){for(let i=stages.length-1;i>=0;i--)if(state.progress>=stages[i][1])return stages[i][0];return stages[0][0]}function updatePieces(){pieces.forEach(p=>{const t=THREE.MathUtils.clamp((state.progress-p.userData.start)/(p.userData.end-p.userData.start),0,1);p.visible=t>0;p.scale.y=p.userData.baseY*Math.max(.03,t)})}function deliver(){state.progress=Math.min(1,state.progress+.0028*state.capacity);state.money+=4*state.capacity;if(state.progress>=1){state.completed++;state.money+=1800;toast('Дом завершён!');setTimeout(()=>state.progress=0,2800)}}let target=new THREE.Vector3(1.5,2,0),yaw=.72,pitch=.62,distance=26,drag=false,last={x:0,y:0},pinch=0;const dom=renderer.domElement;dom.addEventListener('pointerdown',e=>{drag=true;last={x:e.clientX,y:e.clientY};dom.setPointerCapture(e.pointerId)});dom.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;yaw-=dx*.006;pitch=THREE.MathUtils.clamp(pitch-dy*.004,.28,1.15);last={x:e.clientX,y:e.clientY}});dom.addEventListener('pointerup',()=>drag=false);dom.addEventListener('wheel',e=>distance=THREE.MathUtils.clamp(distance+e.deltaY*.015,14,38));dom.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)distance=THREE.MathUtils.clamp(distance-(d-pinch)*.03,14,38);pinch=d}},{passive:false});dom.addEventListener('touchend',()=>pinch=0);function syncWorkers(){while(workers.length<state.workerCount)makeWorker(workers.length)}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1500)}document.getElementById('hire').onclick=()=>{const c=300+state.workerCount*90;if(state.money>=c){state.money-=c;state.workerCount++;syncWorkers();toast('Нанят рабочий')}else toast('Не хватает денег')};document.getElementById('speed').onclick=()=>state.speed=state.speed===1?2:state.speed===2?4:1;document.getElementById('capacity').onclick=()=>{const c=800*state.capacity;if(state.money>=c){state.money-=c;state.capacity++;toast('Груз увеличен')}else toast('Не хватает денег')};document.getElementById('truck').onclick=()=>{if(state.truck){state.progress=Math.min(1,state.progress+.05);toast('Доставка выполнена')}else if(state.money>=3500){state.money-=3500;state.truck=true;toast('Грузовик куплен')}else toast('Нужно 3500')};function ui(){for(const id of['money','sand','brick','cement','wood'])document.getElementById(id).textContent=Math.floor(state[id]).toLocaleString('ru-RU');document.getElementById('workers').textContent=state.workerCount;document.getElementById('completed').textContent=state.completed;const p=Math.round(state.progress*100);document.getElementById('pct').textContent=p+'%';document.getElementById('fill').style.width=p+'%';document.getElementById('stage').textContent=stageName();document.getElementById('speed').textContent='СКОРОСТЬ ×'+state.speed;document.getElementById('capacity').textContent='ГРУЗ ×'+state.capacity;document.getElementById('truck').textContent=state.truck?'ДОСТАВКА':'ГРУЗОВИК';document.getElementById('mission').textContent=state.progress<.28?'Подготовить фундамент':state.progress<.71?'Возвести стены':'Завершить кровлю'}let lastTime=performance.now();function loop(now){const dt=Math.min(.05,(now-lastTime)/1000);lastTime=now;const cx=target.x+Math.cos(yaw)*Math.cos(pitch)*distance,cz=target.z+Math.sin(yaw)*Math.cos(pitch)*distance,cy=target.y+Math.sin(pitch)*distance;camera.position.lerp(new THREE.Vector3(cx,cy,cz),.12);camera.lookAt(target);workers.forEach(g=>{const u=g.userData;u.t+=dt*.09*state.speed*u.dir;if(u.t>=1){u.t=1;u.dir=-1;u.cargo.visible=false;deliver()}if(u.t<=0){u.t=0;u.dir=1;u.cargo.visible=true}const sx=-7.5,sz=-1.5+u.lane*.45,ex=-.2,ez=-1.3+u.lane*.4;g.position.set(THREE.MathUtils.lerp(sx,ex,u.t),Math.abs(Math.sin(now*.008+u.phase))*.05,THREE.MathUtils.lerp(sz,ez,u.t));g.rotation.y=u.dir>0?Math.PI/2:-Math.PI/2});deliveryTruck.position.x=THREE.MathUtils.lerp(-13,-4,(Math.sin(now*.00025)+1)/2);excav.rotation.y=Math.sin(now*.00035)*.16;updatePieces();ui();renderer.render(scene,camera);requestAnimationFrame(loop)}setInterval(()=>localStorage.setItem('eliteroof3d',JSON.stringify(state)),2000);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});requestAnimationFrame(loop)})();
</script>
