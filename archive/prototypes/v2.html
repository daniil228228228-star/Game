function tex(kind){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');if(kind==='brick'){x.fillStyle='#a94f31';x.fillRect(0,0,256,256);x.strokeStyle='#d4b099';x.lineWidth=5;for(let y=0;y<256;y+=32){x.beginPath();x.moveTo(0,y);x.lineTo(256,y);x.stroke();for(let xx=(y/32%2)*32;xx<256;xx+=64){x.beginPath();x.moveTo(xx,y);x.lineTo(xx,y+32);x.stroke()}}}else if(kind==='concrete'){x.fillStyle='#aaa9a3';x.fillRect(0,0,256,256);for(let i=0;i<1500;i++){const g=130+Math.random()*45;x.fillStyle=`rgb(${g},${g},${g})`;x.fillRect(Math.random()*256,Math.random()*256,2,2)}}else if(kind==='wood'){x.fillStyle='#95643a';x.fillRect(0,0,256,256);for(let y=8;y<256;y+=18){x.strokeStyle=`rgba(65,35,15,${.15+Math.random()*.15})`;x.beginPath();x.moveTo(0,y);x.bezierCurveTo(60,y-5,170,y+6,256,y);x.stroke()}}else if(kind==='roof'){x.fillStyle='#243847';x.fillRect(0,0,256,256);x.strokeStyle='#111d26';for(let y=0;y<256;y+=22){for(let xx=(y/22%2)*11;xx<256;xx+=22){x.strokeRect(xx,y,22,22)}}}else{x.fillStyle='#9b7651';x.fillRect(0,0,256,256);for(let i=0;i<1000;i++){x.fillStyle=`rgba(70,45,25,${Math.random()*.15})`;x.fillRect(Math.random()*256,Math.random()*256,2,2)}}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t}

const state={money:12450,sand:2450,brick:1860,cement:980,wood:1540,workers:6,speed:1,cargo:1,progress:.02,done:0};try{Object.assign(state,JSON.parse(localStorage.getItem('er-v2')||'{}'))}catch(e){}const people=[];function worker(i){const g=new THREE.Group();const shirt=[0xf39a13,0xf0c22b,0x3476a8,0xd8613d][i%4];box('torso',[0,1,0],[.42,.78,.3],new THREE.MeshStandardMaterial({color:shirt}),g);cyl([0,1.55,0],.18,.35,new THREE.MeshStandardMaterial({color:0xd8aa82}),g);const helmet=new THREE.Mesh(new THREE.SphereGeometry(.24,16,8,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:i%3===0?0xffd122:0xf4f4f2}));helmet.position.y=1.72;helmet.castShadow=true;g.add(helmet);const leg1=box('leg1',[-.12,.38,0],[.13,.55,.15],mats.dark,g),leg2=box('leg2',[.12,.38,0],[.13,.55,.15],mats.dark,g);const cargo=box('cargo',[0,1.05,.38],[.42,.34,.42],[mats.dirt,mats.brick,mats.white,mats.wood,mats.roof][i%5],g);g.userData={t:Math.random(),dir:1,lane:(i%6)-2.5,cargo,leg1,leg2,phase:Math.random()*6};scene.add(g);people.push(g)}for(let i=0;i<state.workers;i++)worker(i);
