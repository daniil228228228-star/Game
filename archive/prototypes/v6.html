const stages=[['РАСЧИСТКА',0],['ФУНДАМЕНТ',.04],['ПОЛ',.13],['СТЕНЫ 1 ЭТАЖА',.22],['ПЕРЕКРЫТИЕ',.43],['СТЕНЫ 2 ЭТАЖА',.51],['КРЫША — КАРКАС',.68],['КРЫША — ПОКРЫТИЕ',.8],['ОТДЕЛКА',.9],['ГОТОВО',.97]];function stage(){let x=stages[0][0];for(const s of stages)if(state.progress>=s[1])x=s[0];return x}

let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;state.t+=dt*.12*state.speed*state.dir;if(state.t>=1){state.t=1;state.dir=-1;state.progress=Math.min(1,state.progress+.0045*state.cargo);state.money+=4*state.cargo*state.income;if(state.progress>=1){state.completed++;state.money+=2000+state.completed*250;toast('Дом готов!');setTimeout(()=>{if(state.progress>=1)state.progress=0},1800)}}if(state.t<=0){state.t=0;state.dir=1}const a=new THREE.Vector3(-6.7,0,-1.1),b=new THREE.Vector3(-.7,0,-1.1);player.position.lerpVectors(a,b,state.t);player.rotation.y=state.dir>0?Math.PI/2:-Math.PI/2;const walk=Math.sin(now*.012*state.speed);la.rotation.x=walk*.75;ra.rotation.x=-walk*.75;ll.rotation.x=-walk*.65;rl.rotation.x=walk*.65;player.position.y=Math.abs(walk)*.035;cargo.visible=state.dir>0;mix.drum.rotation.x+=dt*.55;excav.rotation.y=Math.sin(now*.00035)*.08;crane.children[crane.children.length-1].position.y=4.45+Math.sin(now*.001)*.45;for(const p of pieces){const q=THREE.MathUtils.clamp((state.progress-p.userData.s)/(p.userData.e-p.userData.s),0,1);p.visible=q>0;p.scale.y=p.userData.base*Math.max(.04,q)}document.getElementById('money').textContent=Math.floor(state.money).toLocaleString('ru');document.getElementById('sand').textContent=state.sand;document.getElementById('brick').textContent=state.brick;document.getElementById('cement').textContent=state.cement;document.getElementById('wood').textContent=state.wood;document.getElementById('stage').textContent=stage();const pc=Math.round(state.progress*100);document.getElementById('pct').textContent=pc+'%';document.getElementById('fill').style.width=pc+'%';document.getElementById('completed').textContent=state.completed;document.getElementById('speedStat').textContent='×'+state.speed.toFixed(2);document.getElementById('cargoStat').textContent='×'+state.cargo;document.getElementById('incomeStat').textContent='+'+Math.round(state.speed*state.cargo*state.income*4)+'/с';renderer.render(scene,c
