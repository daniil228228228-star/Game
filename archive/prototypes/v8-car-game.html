<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#091017"><title>EliteRoof Car Game</title><style>*{box-sizing:border-box}html,body,#c{margin:0;width:100%;height:100%;overflow:hidden;background:#091017;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}#c{display:block;touch-action:none}#boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;background:#091017;font-weight:800}.ui{position:fixed;inset:0;pointer-events:none}.p{background:rgba(5,9,13,.88);border:1px solid rgba(255,255,255,.14);border-radius:16px;box-shadow:0 12px 28px rgba(0,0,0,.35);backdrop-filter:blur(12px)}.top{position:absolute;left:9px;right:9px;top:calc(env(safe-area-inset-top) + 8px);display:flex;justify-content:space-between;gap:8px}.brand{padding:10px 13px;font-weight:900}.brand b{color:#ffab18}.brand small{display:block;font-size:8px;letter-spacing:2.2px;color:#aeb8c1}.cash{padding:9px 13px;text-align:right}.cash strong{display:block}.cash small{color:#67df62}.goal{position:absolute;left:9px;top:calc(env(safe-area-inset-top) + 73px);width:210px;padding:10px 12px}.goal small{font-size:8px;color:#aab4bd}.goal b{display:block;font-size:12px;color:#ffd029;margin-top:3px}.bar{height:9px;border-radius:99px;background:#26323c;overflow:hidden;margin-top:8px}.bar i{display:block;width:45%;height:100%;background:linear-gradient(90deg,#3abc42,#9be443)}.joy{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom) + 22px);width:100px;height:100px;border:2px solid rgba(255,255,255,.33);border-radius:50%;background:rgba(0,0,0,.2)}.joy:after{content:"";position:absolute;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.88);left:29px;top:29px}.run{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 24px);width:90px;height:90px;border:2px solid rgba(255,255,255,.38);border-radius:50%;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font-size:33px}.hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);padding:8px 11px;font-size:9px;white-space:nowrap}.err{color:#ffb4aa;max-width:560px;line-height:1.45}</style></head><body><canvas id="c"></canvas><div id="boot">Загрузка стройплощадки…</div><div class="ui"><div class="top"><div class="p brand">Elite<b>Roof</b><small>CONSTRUCTION</small></div><div class="p cash"><strong>15 230 ₽</strong><small>+230/сек</small></div></div><div class="p goal"><small>ТЕКУЩАЯ ЦЕЛЬ</small><b>Осмотреть служебную машину</b><div class="bar"><i></i></div></div><div class="joy"></div><div class="run">🏃</div><div class="p hint">Палец — камера • щипок — масштаб</div></div><script>const boot=document.getElementById('boot');function load(url){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=url;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}async function any(a){let e;for(const u of a)try{return await load(u)}catch(x){e=x}throw e} (async()=>{try{await any(['https://cdn.babylonjs.com/babylon.js','https://cdnjs.cloudflare.com/ajax/libs/babylonjs/7.34.1/babylon.min.js','https://unpkg.com/babylonjs@7.34.1/babylon.js']);const canvas=document.getElementById('c'),engine=new BABYLON.Engine(canvas,true,{adaptToDeviceRatio:true});engine.setHardwareScalingLevel(Math.max(1,devicePixelRatio/1.5));const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.53,.7,.8,1);scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;scene.fogDensity=.009;scene.fogColor=new BABYLON.Color3(.53,.7,.8);const cam=new BABYLON.ArcRotateCamera('cam',-1.12,1.03,29,new BABYLON.Vector3(0,2,1),scene);cam.lowerRadiusLimit=12;cam.upperRadiusLimit=42;cam.lowerBetaLimit=.42;cam.upperBetaLimit=1.35;cam.attachControl(canvas,true);cam.pinchPrecision=55;const hemi=new BABYLON.HemisphericLight('h',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=.9;const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.5,-1,.35),scene);sun.position=new BABYLON.Vector3(18,25,-16);sun.intensity=2.3;const shadow=new BABYLON.ShadowGenerator(1024,sun);shadow.useBlurExponentialShadowMap=true;shadow.blurKernel=18;function mat(n,h,r=.8,m=0){const x=new BABYLON.PBRMaterial(n,scene);x.albedoColor=BABYLON.Color3.FromHexString(h);x.roughness=r;x.metallic=m;return x}const M={dirt:mat('dirt','#765139',1),grass:mat('grass','#496e3c',1),road:mat('road','#242a30',.95),brick:mat('brick','#a74729',.92),con:mat('con','#a7aaa8',.88),wood:mat('wood','#84552e',.88),dark:mat('dark','#171c20',.68,.18),orange:mat('orange','#e17d08',.58,.12),glass:mat('glass','#244c64',.18,.2),white:mat('white','#d7d4cb',.72),blue:mat('blue','#1d4f77',.55,.1)};function box(n,p,s,ma){const o=BABYLON.MeshBuilder.CreateBox(n,{size:1},scene);o.position.set(...p);o.scaling.set(...s);o.material=ma;o.receiveShadows=true;shadow.addShadowCaster(o);return o}function cyl(n,p,d,h,ma,rot){const o=BABYLON.MeshBuilder.CreateCylinder(n,{diameter:d,height:h,tessellation:24},scene);o.position.set(...p);if(rot)o.rotation.set(...rot);o.material=ma;o.receiveShadows=true;shadow.addShadowCaster(o);return o}const ground=BABYLON.MeshBuilder.CreateGround('g',{width:48,height:38},scene);ground.material=M.dirt;ground.receiveShadows=true;const road=BABYLON.MeshBuilder.CreateGround('road',{width:48,height:7},scene);road.position.set(0,.02,-14);road.material=M.road;for(let x=-21;x<22;x+=4)box('line',[x,.07,-14],[1.7,.03,.12],mat('line'+x,'#e6b62c'));box('slab',[4,.35,3],[9,.7,7],M.con);for(let r=0;r<5;r++){for(let x=-3.8;x<=3.8;x+=.9){box('b',[4+x,1+r*.38,-.1],[.8,.32,.42],r%2?M.brick:mat('br'+r+x,'#963d24'));box('b2',[4+x,1+r*.38,6.1],[.8,.32,.42],M.brick)}for(let z=.8;z<=5.2;z+=.9){box('bl',[.1,1+r*.38,z],[.42,.32,.8],M.brick);box('br',[7.9,1+r*.38,z],[.42,.32,.8],M.brick)}}for(let i=0;i<12;i++)box('pal'+i,[-9+(i%4)*.5,.25+Math.floor(i/4)*.27,4],[.42,.21,.62],M.brick);box('container',[-9,1.5,-3],[4.5,3,3.2],mat('cont','#214b3b',.78,.12));function car(){const g=new BABYLON.TransformNode('car',scene);function B(n,p,s,ma){const o=box(n,p,s,ma);o.parent=g;return o}function C(n,p,d,h,ma,r){const o=cyl(n,p,d,h,ma,r);o.parent=g;return o}B('chassis',[0,.72,0],[4.6,.55,1.9],M.dark);B('hood',[1.45,1.2,0],[1.5,.65,1.72],M.orange);B('cab',[-.55,1.55,0],[2.1,1.55,1.75],M.orange);B('roof',[-.55,2.36,0],[2.2,.16,1.85],M.dark);B('wind',[-.58,1.7,-.9],[1.45,.73,.05],M.glass);B('side',[-.58,1.7,.9],[1.45,.73,.05],M.glass);B('bumper',[2.25,.68,0],[.25,.35,1.95],M.dark);for(const x of[-1.5,1.45])for(const z of[-1.02,1.02])C('wheel',[x,.48,z],.9,.34,M.dark,[Math.PI/2,0,0]);for(const x of[-1.5,1.45])for(const z of[-1.02,1.02])C('rim',[x,.48,z],.42,.36,M.white,[Math.PI/2,0,0]);B('bed',[-2.25,1.15,0],[1.35,.35,1.75],M.orange);B('rail1',[-2.25,1.65,-.85],[1.4,.75,.08],M.dark);B('rail2',[-2.25,1.65,.85],[1.4,.75,.08],M.dark);g.position.set(-1,0,4);g.rotation.y=-.48;return g}const vehicle=car();function pad(n,x,z,c){const tor=BABYLON.MeshBuilder.CreateTorus(n,{diameter:3.1,thickness:.12,tessellation:48},scene);tor.position.set(x,.12,z);const mm=new BABYLON.StandardMaterial(n+'m',scene);mm.emissiveColor=BABYLON.Color3.FromHexString(c);mm.diffuseColor=mm.emissiveColor.scale(.22);tor.material=mm;const d=BABYLON.MeshBuilder.CreateCylinder(n+'d',{diameter:2.85,height:.05,tessellation:48},scene);d.position.set(x,.06,z);d.material=mm}pad('Склад',-7,-6,'#58ff6d');pad('Скорость',-2,-6,'#34c5ff');pad('Доход',3,-6,'#ffd22d');pad('Доставка',8,-6,'#ff8b22');const body=cyl('body',[-5,1,0],.72,1.45,M.orange);const head=cyl('head',[-5,1.95,0],.42,.42,mat('skin','#d1a07d'),[0,0,0]);for(const z of[-.25,.25])box('leg',[-5,.32,z],[.18,.68,.18],M.blue);let t=0;scene.onBeforeRenderObservable.add(()=>{t+=engine.getDeltaTime()/1000;vehicle.position.y=Math.sin(t*1.3)*.015});boot.remove();engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize())}catch(e){boot.innerHTML='<div class="err"><b>Не удалось загрузить 3D-движок.</b><br><br>Открой страницу в обычном Safari и проверь интернет.<br><br>'+String(e.message||e)+'</div>'}})();</script></body></html>
