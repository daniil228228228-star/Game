document.getElementById('hire').onclick=()=>{const cost=350+state.workerCount*120;if(state.money>=cost){state.money-=cost;state.workerCount++;makeWorker(workers.length);toast('Нанят рабочий')}else toast('Не хватает денег')};document.getElementById('speed').onclick=()=>{const n=state.speed===1?2:state.speed===2?4:1,c=n===1?0:n*850;if(n===1||state.money>=c){if(c)state.money-=c;state.speed=n}else toast('Не хватает денег')};document.getElementById('capacity').onclick=()=>{const c=900*state.capacity;if(state.money>=c){state.money-=c;state.capacity++;toast('Груз увеличен')}else toast('Не хватает денег')};document.getElementById('truck').onclick=()=>{if(!state.truck){if(state.money>=4200){state.money-=4200;state.truck=true;toast('Техника активирована')}else toast('Нужно 4200')}else{state.progress=Math.min(1,state.progress+.045);toast('Крупная доставка')}};setInterval(()=>localStorage.setItem('eliteroof3d-v5',JSON.stringify(state)),2500);
let last=performance.now();function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*dist,target.y+Math.sin(pitch)*dist,target.z+Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(target);workers.forEach((w,i)=>{const u=w.userData;u.t+=dt*(.075+i*.001)*state.speed*u.dir;if(u.t>=1){u.t=1;u.dir=-1;u.cargo.visible=false;deliver()}if(u.t<=0){u.t=0;u.dir=1;u.cargo.visible=true}const starts=[[-7.3,-.4],[-6.4,1.5],[-5.2,3.6]],ends=[[-.9,-1.6],[-.6,.2],[-.8,1.9]],a=starts[u.route],b=ends[u.route],x=a[0]+(b[0]-a[0])*u.t,z=a[1]+(b[1]-a[1])*u.t+u.lane*.12;w.position.set(x,0,z);w.rotation.y=Math.atan2(b[0]-a[0],b[1]-a[1])+(u.dir<0?Math.PI:0);const swing=Math.sin(now*.009+u.phase)*.55;u.ll.rotation.x=swing;u.rl.rotation.x=-swing;u.la.rotation.x=-swing*.65;u.ra.rotation.x=swing*.65});deliveryTruck.position.x=-11+((now/7000)%1)*22;deliveryTruck.userData.drum.rotation.z+=dt*1.5;excav.userData.arm.rotation.z=-.12+Math.sin(now*.001)*.07;siteCrane.rotation.y=Math.sin(now*.00018)*.18;updatePieces();const pct=Math.round(state.progress*100);document.getElementById('pct').textContent=pct+'%';document.getElementById('fill').style.width=pct+'%';document.getElementById('stage').textContent=stageName();document.getElementById('workers').textContent=state.workerCount;document.getElementById('completed').textContent=state.completed;for(const id of['money','sand','brick','cement','wood'])document.getElementById(id).textContent=Math.floor(state[id]).toLocaleString('ru-RU');document.getElementById('speed').textContent='СКОРОСТЬ ×'+state.speed;document.getElementById('capacity').textContent='ГРУЗ ×'+state.capacity;document.getElementById('truck').textContent=state.truck?'ДОСТАВКА +4.5%':'ТЕХНИКА';document.getElementById('mission').textContent=state.progress<.27?'Основание и плита':state.progress<.57?'Кирпичная коробка':state.progress<.83?'Второй этаж и стропила':state.progress<.97?'Кровля и окна':'Благоустройство';renderer.render(scene,camera);requestAnimationFrame(frame)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});requestAnimationFrame(frame);
