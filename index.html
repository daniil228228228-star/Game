<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EliteRoof">
<title>EliteRoof Construction</title>
<style>
:root{--bg:#0b1016;--panel:rgba(10,15,22,.92);--line:rgba(255,255,255,.10);--orange:#ff9d12;--orange2:#ffbe2e;--text:#f7f8fa;--muted:#9ba7b4}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}body{overscroll-behavior:none}#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:grid;grid-template-columns:auto 1fr auto;gap:8px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:0 10px 28px rgba(0,0,0,.28);backdrop-filter:blur(14px)}.brand{padding:10px 12px;font-weight:900;line-height:.95;letter-spacing:.2px}.brand b{color:var(--orange2)}.brand small{display:block;font-size:8px;letter-spacing:2.6px;margin-top:5px;color:#c9d0d7}.resources{display:flex;justify-content:space-around;padding:8px;min-width:0}.resource{text-align:center;min-width:44px}.resource .icon{font-size:14px}.resource strong{display:block;font-size:12px}.resource small{display:block;font-size:8px;color:var(--muted)}.level{padding:8px 10px;min-width:86px}.level small{font-size:8px;color:var(--muted)}.level strong{display:block;font-size:12px}.xp{height:7px;background:#28313b;border-radius:99px;margin-top:5px;overflow:hidden}.xp i{display:block;width:65%;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange2))}.bottom{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.progressCard{padding:10px 12px}.stageLine{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900}.progress{height:11px;background:#26303a;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--orange2));transition:width .2s}.subline{display:flex;justify-content:space-between;margin-top:6px;font-size:9px;color:var(--muted)}.actions{display:grid;grid-template-columns:repeat(2,96px);gap:7px;pointer-events:auto}button{border:1px solid var(--line);border-radius:14px;padding:10px 8px;background:rgba(15,22,31,.96);color:white;font-weight:800;font-size:10px;box-shadow:0 6px 18px rgba(0,0,0,.22)}button.primary{background:linear-gradient(180deg,var(--orange2),var(--orange));color:#211303}button:active{transform:scale(.97)}.toast{position:absolute;left:50%;top:18%;transform:translateX(-50%) translateY(-10px);background:rgba(8,12,18,.9);border:1px solid var(--line);padding:9px 12px;border-radius:999px;font-size:10px;opacity:0;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media (max-width:700px){.brand{font-size:12px}.brand small{font-size:7px}.resources{overflow:hidden}.resource:nth-child(4){display:none}.level{display:none}.actions{grid-template-columns:repeat(2,86px)}button{font-size:9px;padding:9px 7px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="ui"><div class="top"><div class="card brand">Elite<b>Roof</b><small>CONSTRUCTION</small></div><div class="card resources"><div class="resource"><div class="icon">⛰️</div><strong id="sand">2450</strong><small>ПЕСОК</small></div><div class="resource"><div class="icon">🧱</div><strong id="brick">1860</strong><small>КИРПИЧ</small></div><div class="resource"><div class="icon">🧺</div><strong id="cement">980</strong><small>ЦЕМЕНТ</small></div><div class="resource"><div class="icon">🪵</div><strong id="wood">1540</strong><small>ДОСКИ</small></div><div class="resource"><div class="icon">💵</div><strong id="money">12450</strong><small>ДЕНЬГИ</small></div></div><div class="card level"><small>УРОВЕНЬ</small><strong>12</strong><div class="xp"><i></i></div></div></div><div class="toast" id="toast"></div><div class="bottom"><div class="card progressCard"><div class="stageLine"><span id="stage">ФУНДАМЕНТ</span><span id="pct">0%</span></div><div class="progress"><i id="fill"></i></div><div class="subline"><span>Рабочие: <b id="workersCount">5</b></span><span>Доход: <b id="income">+0/с</b></span></div></div><div class="actions"><button class="primary" id="hire">+ РАБОЧИЙ</button><button id="speed">СКОРОСТЬ ×1</button><button id="capacity">ГРУЗ +1</button><button id="truck">ГРУЗОВИК</button></div></div></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});let DPR=Math.min(devicePixelRatio||1,2),W=0,H=0;function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();const state={money:12450,sand:2450,brick:1860,cement:980,wood:1540,workers:5,speed:1,capacity:1,progress:0,completed:0,deliveries:0,truckUnlocked:false,income:0};try{const saved=JSON.parse(localStorage.getItem('eliteroof_save_v1'));if(saved)Object.assign(state,saved)}catch(e){}let cam={x:0,y:30,zoom:1},pointers=new Map(),lastPinch=0;canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){cam.x+=e.clientX-old.x;cam.y+=e.clientY-old.y}else if(pointers.size===2){const pts=[...pointers.values()],d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(lastPinch)cam.zoom=Math.max(.72,Math.min(1.5,cam.zoom+(d-lastPinch)*.003));lastPinch=d}});function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)lastPinch=0}canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);const TILE=42;function iso(x,z,y=0){return{x:(x-z)*TILE*cam.zoom+W*.5+cam.x,y:(x+z)*TILE*.5*cam.zoom-y*TILE*cam.zoom+H*.48+cam.y}}function poly(points,fill,stroke='rgba(0,0,0,.2)'){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}function shade(hex,amt){const n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+amt)),g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));return'#'+(b|(g<<8)|(r<<16)).toString(16).padStart(6,'0')}function cube(x,z,y,w,d,h,c){const A=iso(x-w/2,z-d/2,y+h),B=iso(x+w/2,z-d/2,y+h),C=iso(x+w/2,z+d/2,y+h),D=iso(x-w/2,z+d/2,y+h),a=iso(x-w/2,z-d/2,y),b=iso(x+w/2,z-d/2,y),c2=iso(x+w/2,z+d/2,y),d2=iso(x-w/2,z+d/2,y);poly([D,C,c2,d2],shade(c,-34));poly([B,C,c2,b],shade(c,-20));poly([A,B,C,D],c)}function diamond(x,z,w,d,c){poly([iso(x-w/2,z),iso(x,z-d/2),iso(x+w/2,z),iso(x,z+d/2)],c)}function ellipse3d(x,z,y,rx,ry,c){const p=iso(x,z,y);ctx.beginPath();ctx.ellipse(p.x,p.y,rx*cam.zoom,ry*cam.zoom,0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}function line3d(a,b,c,w=2){const p=iso(...a),q=iso(...b);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=c;ctx.lineWidth=w*cam.zoom;ctx.stroke()}const stages=[['РАСЧИСТКА',0],['ФУНДАМЕНТ',.05],['ПОЛ',.18],['СТЕНЫ 1 ЭТАЖА',.28],['ПЕРЕКРЫТИЕ',.47],['СТЕНЫ 2 ЭТАЖА',.56],['КРЫША — КАРКАС',.71],['КРЫША — ПОКРЫТИЕ',.81],['ОТДЕЛКА',.90],['ГОТОВО',.97]];function stageName(){for(let i=stages.length-1;i>=0;i--)if(state.progress>=stages[i][1])return stages[i][0];return stages[0][0]}function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6fa4c5');g.addColorStop(.58,'#bed8e7');g.addColorStop(1,'#e6c79f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);diamond(0,0,22,17,'#567b46');diamond(1,0,14,10,'#a88159');for(let i=-10;i<=10;i++)cube(i,-6.1,0,1,2.4,.08,'#343a40');for(let i=-9;i<=9;i+=2)cube(i,-6.1,.09,.8,.08,.03,'#f1bf3d')}function drawSandPile(x,z){const p=iso(x,z,.1);ctx.beginPath();ctx.moveTo(p.x-28*cam.zoom,p.y);ctx.lineTo(p.x,p.y-34*cam.zoom);ctx.lineTo(p.x+28*cam.zoom,p.y);ctx.closePath();ctx.fillStyle='#c7964f';ctx.fill()}function drawBrickPallet(x,z){cube(x,z,0,1.55,1.2,.18,'#75502f');for(let r=0;r<3;r++)for(let c=0;c<4;c++)cube(x-.55+c*.36,z-.32+r*.32,.18+r*.24,.3,.25,.2,'#ad4d2d')}function drawCement(x,z){for(let i=0;i<5;i++)cube(x+(i%2)*.34,z+(i/2|0)*.26,0,.32,.55,.2,'#d8d5ca')}function drawTimber(x,z){for(let i=0;i<5;i++)cube(x,z+i*.22,0,1.7,.16,.15,'#9d6c38')}function drawRoofPallet(x,z){cube(x,z,0,1.5,1.1,.18,'#6f4b2f');for(let i=0;i<4;i++)cube(x,z,.18+i*.11,1.45,1,.08,'#203d52')}function drawMixer(x,z){cube(x,z,0,2.3,1.1,.38,'#2d343b');cube(x-.55,z,.38,.7,1,.65,'#f09517');ellipse3d(x+.35,z,.9,18,11,'#f6a528');ellipse3d(x-.65,z,-.02,7,7,'#111820');ellipse3d(x+.65,z,-.02,7,7,'#111820')}function drawForklift(x,z){cube(x,z,0,1.2,.9,.45,'#f0a111');cube(x,z,.45,.85,.75,.75,'#e7970c');line3d([x+.55,z-.32,.2],[x+.55,z-.32,1.6],'#26313a',3);line3d([x+.55,z+.32,.2],[x+.55,z+.32,1.6],'#26313a',3)}function drawTruck(x,z){cube(x,z,0,2.8,1.25,.65,'#d87e10');cube(x-.8,z,.65,1,1.2,1,'#f09b18');cube(x+.55,z,.65,1.5,1.2,.95,'#8b969f');ellipse3d(x-.8,z-.58,-.02,7,7,'#111820');ellipse3d(x+.75,z-.58,-.02,7,7,'#111820')}function drawSiteProps(){for(let i=-6;i<=6;i++){if(i%2===0)cube(i*.9,4.9,0,.1,.1,1.3,'#6f6d68');line3d([i*.9,4.9,.4],[(i+1)*.9,4.9,.4],'#7d7b74',1.6)}cube(-6.8,1.7,0,4.2,3.5,2.9,'#2b5169');cube(-6.8,1.7,2.9,4.6,3.9,.25,'#142832');cube(-6.8,0,1.25,1.25,.12,1,'#4a9cc4');drawSandPile(-4.7,-1.2);drawBrickPallet(-4.3,.4);drawCement(-4.2,2);drawTimber(-4,3.3);drawRoofPallet(-2.8,3.4);drawMixer(-1.8,-4.6);drawForklift(-5.4,4);if(state.truckUnlocked)drawTruck(-6.8,-4.7)}function drawWalls(x,z,y,h,c){cube(x,z-2.25,y,6.4,.38,h,c);cube(x,z+2.25,y,6.4,.38,h,shade(c,-10));cube(x-3.05,z,y,.38,4.2,h,shade(c,8));cube(x+3.05,z,y,.38,4.2,h,shade(c,-16))}function drawHouse(){const p=state.progress;if(p>.01)cube(2.3,.2,-.3,7,5.4,.35,'#6f5138');if(p>.05)cube(2.3,.2,0,6.8,5.2,.72*Math.min(1,(p-.05)/.13),'#aeb6bd');if(p>.18)cube(2.3,.2,.72,6.5,4.9,.28*Math.min(1,(p-.18)/.10),'#8f7355');if(p>.28)drawWalls(2.3,.2,.95,2.2*Math.min(1,(p-.28)/.19),'#b75733');if(p>.47)cube(2.3,.2,3.15,6.6,5,.30*Math.min(1,(p-.47)/.09),'#8f7558');if(p>.56)drawWalls(2.3,.2,3.45,2*Math.min(1,(p-.56)/.15),'#c56a3e');if(p>.71){const count=Math.floor(10*Math.min(1,(p-.71)/.10));for(let i=0;i<count;i++){const x=-.7+i*.66;line3d([x,.2,5.45],[x,-2.35,3.95],'#704322',4);line3d([x,.2,5.45],[x,2.75,3.95],'#704322',4)}}if(p>.81){const t=Math.min(1,(p-.81)/.09);cube(2.3,-.95,5.25,6.9,2.5,.16*t,'#18384f');cube(2.3,1.35,5.25,6.9,2.5,.16*t,'#143246')}if(p>.90&&Math.min(1,(p-.90)/.07)>.35){for(const x of [.1,2.3,4.5]){cube(x,-2.45,1.6,.9,.12,1.15,'#4a9fc4');cube(x,-2.45,4.05,.9,.12,1,'#4a9fc4')}cube(2.3,-2.52,.85,1.1,.16,2,'#58301a')}if(p>.97){for(let i=0;i<9;i++)cube(2.3,-3-i*.45,.03,1.2,.34,.09,'#adb3b7');for(let i=0;i<5;i++)ellipse3d(-.2+i*1.25,3.1,.15,9,5,'#2e7a39')}}const workers=[];function syncWorkers(){while(workers.length<state.workers){const i=workers.length;workers.push({t:Math.random(),dir:1,lane:i%6-2.5,phase:Math.random()*10,load:true})}while(workers.length>state.workers)workers.pop()}syncWorkers();function drawWorker(w,i,dt){w.t+=dt*.08*state.speed*w.dir;if(w.t>=1){w.t=1;w.dir=-1;w.load=false;deliver()}if(w.t<=0){w.t=0;w.dir=1;w.load=true}const sx=-3.6,sz=-1.4+w.lane*.55,ex=-.6,ez=-1.4+w.lane*.48,x=sx+(ex-sx)*w.t,z=sz+(ez-sz)*w.t,bob=Math.abs(Math.sin(performance.now()*.009+w.phase))*.05;ellipse3d(x,z,.02,7,3,'rgba(0,0,0,.25)');cube(x,z,bob,.34,.28,.72,'#ef8d13');ellipse3d(x,z,.93+bob,7,7,'#e7b186');ellipse3d(x,z,1.04+bob,8,4,'#ffd21a');if(w.load){const colors=['#c9954d','#b74f2c','#d5d2c9','#94653a','#1f3f56'];cube(x,z-.25,.72+bob,.38,.36,.30,colors[i%colors.length])}}function deliver(){state.progress=Math.min(1,state.progress+.0024*state.capacity);state.deliveries++;state.money+=4*state.capacity;state.income=Math.round(state.workers*state.speed*state.capacity*1.1);if(state.progress>=1){state.completed++;state.money+=1500+state.completed*250;toast('Дом завершён!');setTimeout(()=>{if(state.progress>=1)state.progress=0},2500)}}function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1600)}document.getElementById('hire').onclick=()=>{const cost=250+state.workers*90;if(state.money>=cost){state.money-=cost;state.workers++;syncWorkers();toast('Нанят новый рабочий')}else toast('Не хватает денег')};document.getElementById('speed').onclick=()=>{const next=state.speed===1?2:state.speed===2?4:1,cost=next===1?0:next*650;if(next===1||state.money>=cost){if(cost)state.money-=cost;state.speed=next}else toast('Не хватает денег')};document.getElementById('capacity').onclick=()=>{const cost=700*state.capacity;if(state.money>=cost){state.money-=cost;state.capacity++;toast('Груз увеличен')}else toast('Не хватает денег')};document.getElementById('truck').onclick=()=>{if(state.truckUnlocked){state.progress=Math.min(1,state.progress+.05);toast('Материалы доставлены')}else if(state.money>=3500){state.money-=3500;state.truckUnlocked=true;toast('Грузовик открыт')}else toast('Нужно 3500')};setInterval(()=>{try{localStorage.setItem('eliteroof_save_v1',JSON.stringify(state))}catch(e){}},2000);let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;ctx.clearRect(0,0,W,H);drawBackground();drawSiteProps();drawHouse();workers.forEach((w,i)=>drawWorker(w,i,dt));updateUI();requestAnimationFrame(frame)}function updateUI(){for(const id of['money','sand','brick','cement','wood'])document.getElementById(id).textContent=Math.floor(state[id]).toLocaleString('ru-RU');document.getElementById('workersCount').textContent=state.workers;document.getElementById('income').textContent='+'+state.income+'/с';const pct=Math.round(state.progress*100);document.getElementById('pct').textContent=pct+'%';document.getElementById('fill').style.width=pct+'%';document.getElementById('stage').textContent=stageName();document.getElementById('speed').textContent='СКОРОСТЬ ×'+state.speed;document.getElementById('capacity').textContent='ГРУЗ ×'+state.capacity;document.getElementById('truck').textContent=state.truckUnlocked?'ДОСТАВКА':'ГРУЗОВИК'}requestAnimationFrame(frame)})();
</script>
</body>
</html>
