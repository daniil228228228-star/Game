<script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});let DPR=Math.min(devicePixelRatio||1,2),W=0,H=0;function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();const state={money:12450,sand:2450,brick:1860,cement:980,wood:1540,workers:5,speed:1,capacity:1,progress:0,completed:0,deliveries:0,truckUnlocked:false,income:0,foreman:false,craneUnlocked:false,weather:'sunny'};try{const saved=JSON.parse(localStorage.getItem('eliteroof_save_v2'));if(saved)Object.assign(state,saved)}catch(e){}let cam={x:0,y:30,zoom:1},pointers=new Map(),lastPinch=0;canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){cam.x+=e.clientX-old.x;cam.y+=e.clientY-old.y}else if(pointers.size===2){const pts=[...pointers.values()],d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(lastPinch)cam.zoom=Math.max(.72,Math.min(1.5,cam.zoom+(d-lastPinch)*.003));lastPinch=d}});function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)lastPinch=0}canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);const TILE=42;function iso(x,z,y=0){return{x:(x-z)*TILE*cam.zoom+W*.5+cam.x,y:(x+z)*TILE*.5*cam.zoom-y*TILE*cam.zoom+H*.48+cam.y}}function poly(points,fill,stroke='rgba(0,0,0,.2)'){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}function shade(hex,amt){const n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+amt)),g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));return'#'+(b|(g<<8)|(r<<16)).toString(16).padStart(6,'0')}function cube(x,z,y,w,d,h,c){const A=iso(x-w/2,z-d/2,y+h),B=iso(x+w/2,z-d/2,y+h),C=iso(x+w/2,z+d/2,y+h),D=iso(x-w/2,z+d/2,y+h),a=iso(x-w/2,z-d/2,y),b=iso(x+w/2,z-d/2,y),c2=iso(x+w/2,z+d/2,y),d2=iso(x-w/2,z+d/2,y);poly([D,C,c2,d2],shade(c,-34));poly([B,C,c2,b],shade(c,-20));poly([A,B,C,D],c)}function diamond(x,z,w,d,c){poly([iso(x-w/2,z),iso(x,z-d/2),iso(x+w/2,z),iso(x,z+d/2)],c)}function ellipse3d(x,z,y,rx,ry,c){const p=iso(x,z,y);ctx.beginPath();ctx.ellipse(p.x,p.y,rx*cam.zoom,ry*cam.zoom,0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}function line3d(a,b,c,w=2){const p=iso(...a),q=iso(...b);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=c;ctx.lineWidth=w*cam.zoom;ctx.stroke()}const stages=[['РАСЧИСТКА',0],['ФУНДАМЕНТ',.05],['ПОЛ',.18],['СТЕНЫ 1 ЭТАЖА',.28],['ПЕРЕКРЫТИЕ',.47],['СТЕНЫ 2 ЭТАЖА',.56],['КРЫША — КАРКАС',.71],['КРЫША — ПОКРЫТИЕ',.81],['ОТДЕЛКА',.90],['ГОТОВО',.97]];function stageName(){for(let i=stages.length-1;i>=0;i--)if(state.progress>=stages[i][1])return stages[i][0];return stages[0][0]}function drawBackground(){const t=(Math.sin(performance.now()/18000)+1)/2,g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgb(${90+35*t},${140+45*t},${180+45*t})`);g.addColorStop(.58,`rgb(${178+28*t},${205+25*t},${220+20*t})`);g.addColorStop(1,'#e7c795');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const sun=iso(-7,-7,7);ctx.beginPath();ctx.arc(sun.x,sun.y,26*cam.zoom,0,Math.PI*2);ctx.fillStyle='rgba(255,225,140,.85)';ctx.fill();diamond(0,0,22,17,'#557c43');diamond(1,0,14,10,'#a67c50');for(let i=-10;i<=10;i++)cube(i,-6.1,0,1,2.4,.08,'#343a40');for(let i=-9;i<=9;i+=2)cube(i,-6.1,.09,.8,.08,.03,'#f1bf3d');for(let i=-9;i<=9;i+=2){cube(i,5.7,0,.12,.12,1.15,'#766d5e');line3d([i,5.7,.95],[i+2,5.7,.95],'#827867',1.5)}for(const [x,z] of [[-8,-3],[8,-3],[-8,4],[8,4]]){cube(x,z,0,.28,.28,1.1,'#70502f');ellipse3d(x,z,1.65,18,12,'#3f793c');ellipse3d(x+.25,z-.1,1.85,12,9,'#4b8b45')}}function drawSandPile(x,z){const p=iso(x,z,.1);ctx.beginPath();ctx.moveTo(p.x-28*cam.zoom,p.y);ctx.lineTo(p.x,p.y-34*cam.zoom);ctx.lineTo(p.x+28*cam.zoom,p.y);ctx.closePath();ctx.fillStyle='#c7964f';ctx.fill()}function drawBrickPallet(x,z){cube(x,z,0,1.55,1.2,.18,'#75502f');for(let r=0;r<3;r++)for(let c=0;c<4;c++)cube(x-.55+c*.36,z-.32+r*.32,.18+r*.24,.3,.25,.2,'#ad4d2d')}function drawCement(x,z){for(let i=0;i<5;i++)cube(x+(i%2)*.34,z+(i/2|0)*.26,0,.32,.55,.2,'#d8d5ca')}function drawTimber(x,z){for(let i=0;i<5;i++)cube(x,z+i*.22,0,1.7,.16,.15,'#9d6c38')}function drawRoofPallet(x,z){cube(x,z,0,1.5,1.1,.18,'#6f4b2f');for(let i=0;i<4;i++)cube(x,z,.18+i*.11,1.45,1,.08,'#203d52')}function drawMixer(x,z){cube(x,z,0,2.3,1.1,.38,'#2d343b');cube(x-.55,z,.38,.7,1,.65,'#f09517');ellipse3d(x+.35,z,.9,18,11,'#f6a528');ellipse3d(x-.65,z,-.02,7,7,'#111820');ellipse3d(x+.65,z,-.02,7,7,'#111820')}function drawForklift(x,z){cube(x,z,0,1.2,.9,.45,'#f0a111');cube(x,z,.45,.85,.75,.75,'#e7970c');line3d([x+.55,z-.32,.2],[x+.55,z-.32,1.6],'#26313a',3);line3d([x+.55,z+.32,.2],[x+.55,z+.32,1.6],'#26313a',3)}function drawTruck(x,z){cube(x,z,0,2.8,1.25,.65,'#d87e10');cube(x-.8,z,.65,1,1.2,1,'#f09b18');cube(x+.55,z,.65,1.5,1.2,.95,'#8b969f');ellipse3d(x-.8,z-.58,-.02,7,7,'#111820');ellipse3d(x+.75,z-.58,-.02,7,7,'#111820')}const particles=[];function emit(x,z,c='#d6c19d',n=5){for(let i=0;i<n;i++)particles.push({x,z,y:.4+Math.random()*.5,vx:(Math.random()-.5)*.5,vz:(Math.random()-.5)*.5,vy:.35+Math.random()*.45,life:.7+Math.random()*.5,c})}function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.z+=p.vz*dt;p.y+=p.vy*dt;p.vy-=.55*dt;p.life-=dt;ellipse3d(p.x,p.z,p.y,4*p.life,3*p.life,p.c);if(p.life<=0)particles.splice(i,1)}}function drawCrane(){cube(6.8,3.8,0,.7,.7,1.0,'#c68a10');line3d([6.8,3.8,1],[6.8,3.8,7.2],'#e0a21c',7);line3d([6.8,3.8,7.2],[1.2,3.8,7.2],'#e0a21c',5);line3d([4.2,3.8,7.2],[4.2,3.8,4.8],'#313841',2);cube(4.2,3.8,4.5,.55,.55,.35,'#d39312')}function drawScaffold(){for(const x of[-1.15,5.75])for(const z of[-2.7,2.7]){line3d([x,z,0],[x,z,4.7],'#59626a',2);for(let y=.8;y<4.7;y+=.9)line3d([x-.25,z,y],[x+.25,z,y],'#6d757d',2)}}function drawExcavator(x,z){cube(x,z,0,2.2,1.35,.42,'#2e3338');cube(x-.45,z,.42,1.1,1.1,.9,'#e79a14');line3d([x+.2,z,.9],[x+1.4,z,1.7],'#e79a14',5);line3d([x+1.4,z,1.7],[x+2.0,z,.55],'#d98b0c',5);cube(x+2.05,z,.25,.7,1.0,.4,'#71451f')}function drawSiteProps(){for(let i=-6;i<=6;i++){if(i%2===0)cube(i*.9,4.9,0,.1,.1,1.3,'#6f6d68');line3d([i*.9,4.9,.4],[(i+1)*.9,4.9,.4],'#7d7b74',1.6)}cube(-6.8,1.7,0,4.2,3.5,2.9,'#2b5169');cube(-6.8,1.7,2.9,4.6,3.9,.25,'#142832');cube(-6.8,0,1.25,1.25,.12,1,'#4a9cc4');drawSandPile(-4.7,-1.2);drawBrickPallet(-4.3,.4);drawCement(-4.2,2);drawTimber(-4,3.3);drawRoofPallet(-2.8,3.4);drawMixer(-1.8,-4.6);drawForklift(-5.4,4);drawExcavator(7.4,3.0);drawScaffold();if(state.craneUnlocked||state.progress>.58)drawCrane();if(state.truckUnlocked){const tt=(performance.now()/5000)%1;drawTruck(-8+tt*15,-4.7)}}function drawWalls(x,z,y,h,c){cube(x,z-2.25,y,6.4,.38,h,c);cube(x,z+2.25,y,6.4,.38,h,shade(c,-10));cube(x-3.05,z,y,.38,4.2,h,shade(c,8));cube(x+3.05,z,y,.38,4.2,h,shade(c,-16))}function drawHouse(){const p=state.progress;if(p>.01)cube(2.3,.2,-.3,7,5.4,.35,'#6f5138');if(p>.05)cube(2.3,.2,0,6.8,5.2,.72*Math.min(1,(p-.05)/.13),'#aeb6bd');if(p>.18)cube(2.3,.2,.72,6.5,4.9,.28*Math.min(1,(p-.18)/.10),'#8f7355');if(p>.28)drawWalls(2.3,.2,.95,2.2*Math.min(1,(p-.28)/.19),'#b75733');if(p>.47)cube(2.3,.2,3.15,6.6,5,.30*Math.min(1,(p-.47)/.09),'#8f7558');if(p>.56)drawWalls(2.3,.2,3.45,2*Math.min(1,(p-.56)/.15),'#c56a3e');if(p>.71){const count=Math.floor(10*Math.min(1,(p-.71)/.10));for(let i=0;i<count;i++){const x=-.7+i*.66;line3d([x,.2,5.45],[x,-2.35,3.95],'#704322',4);line3d([x,.2,5.45],[x,2.75,3.95],'#704322',4)}}if(p>.81){const t=Math.min(1,(p-.81)/.09);cube(2.3,-.95,5.25,6.9,2.5,.16*t,'#18384f');cube(2.3,1.35,5.25,6.9,2.5,.16*t,'#143246')}if(p>.90&&Math.min(1,(p-.90)/.07)>.35){for(const x of [.1,2.3,4.5]){cube(x,-2.45,1.6,.9,.12,1.15,'#4a9fc4');cube(x,-2.45,4.05,.9,.12,1,'#4a9fc4')}cube(2.3,-2.52,.85,1.1,.16,2,'#58301a')}if(p>.81){for(let i=0;i<11;i++)line3d([-.9+i*.65,-2.15,5.35],[-.9+i*.65,2.55,5.35],'rgba(245,245,245,.13)',1)}if(p>.88)cube(4.6,1.1,5.25,.75,.75,1.35,'#8f4a2d');if(p>.90&&Math.min(1,(p-.90)/.07)>.35){cube(.2,-2.52,1.7,.12,.2,1.3,'#e7e0d5');cube(4.4,-2.52,1.7,.12,.2,1.3,'#e7e0d5')}if(p>.97){for(let i=0;i<9;i++)cube(2.3,-3-i*.45,.03,1.2,.34,.09,'#adb3b7');for(let i=0;i<5;i++)ellipse3d(-.2+i*1.25,3.1,.15,9,5,'#2e7a39');cube(2.3,-3.15,.12,1.8,.9,.18,'#a9adb0')}}const workers=[];function syncWorkers(){while(workers.length<state.workers){const i=workers.length;workers.push({t:Math.random(),dir:1,lane:i%6-2.5,phase:Math.random()*10,load:true,role:i%4,route:i%3})}while(workers.length>state.workers)workers.pop()}syncWorkers();function drawWorker(w,i,dt){w.t+=dt*(.072+w.role*.006)*state.speed*w.dir;if(w.t>=1){w.t=1;w.dir=-1;w.load=false;deliver();if(Math.random()<.6)emit(-.4,-1.4+w.lane*.45,'rgba(210,190,150,.65)',4)}if(w.t<=0){w.t=0;w.dir=1;w.load=true}const starts=[[-3.9,-1.4],[-4.4,.3],[-3.7,2.2]],ends=[[-.7,-1.4],[-.35,.25],[-.7,2.0]],a=starts[w.route],b=ends[w.route],sx=a[0],sz=a[1]+w.lane*.18,ex=b[0],ez=b[1]+w.lane*.14,x=sx+(ex-sx)*w.t,z=sz+(ez-sz)*w.t,bob=Math.abs(Math.sin(performance.now()*.009+w.phase))*.055;ellipse3d(x,z,.02,7,3,'rgba(0,0,0,.25)');const shirts=['#ef8d13','#e5b522','#3d78a8','#d75c3e'];cube(x,z,bob,.34,.28,.72,shirts[w.role]);ellipse3d(x,z,.93+bob,7,7,'#e7b186');ellipse3d(x,z,1.04+bob,8,4,w.role===2?'#f3f3f3':'#ffd21a');line3d([x-.12,z,.18+bob],[x-.17,z,.02+bob],'#202a34',2);line3d([x+.12,z,.18+bob],[x+.17,z,.02+bob],'#202a34',2);if(w.load){const colors=['#c9954d','#b74f2c','#d5d2c9','#94653a','#1f3f56'];cube(x,z-.25,.72+bob,.38,.36,.30,colors[(i+w.route)%colors.length])}}function deliver(){state.progress=Math.min(1,state.progress+.0024*state.capacity);state.deliveries++;state.money+=4*state.capacity;state.income=Math.round(state.workers*state.speed*state.capacity*1.1);if(state.progress>=1){state.completed++;state.money+=1500+state.completed*250;emit(2.3,.2,'rgba(255,184,38,.8)',18);toast('Дом завершён! +'+(1500+state.completed*250));setTimeout(()=>{if(state.progress>=1){state.progress=0;state.sand+=250;state.brick+=180;state.cement+=90;state.wood+=120}},2800)}}function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1600)}document.getElementById('hire').onclick=()=>{const cost=250+state.workers*90;if(state.money>=cost){state.money-=cost;state.workers++;syncWorkers();toast('Нанят новый рабочий')}else toast('Не хватает денег')};document.getElementById('speed').onclick=()=>{const next=state.speed===1?2:state.speed===2?4:1,cost=next===1?0:next*650;if(next===1||state.money>=cost){if(cost)state.money-=cost;state.speed=next}else toast('Не хватает денег')};document.getElementById('capacity').onclick=()=>{const cost=700*state.capacity;if(state.money>=cost){state.money-=cost;state.capacity++;toast('Груз увеличен')}else toast('Не хватает денег')};document.getElementById('truck').onclick=()=>{if(state.truckUnlocked){state.progress=Math.min(1,state.progress+.05);toast('Материалы доставлены')}else if(state.money>=3500){state.money-=3500;state.truckUnlocked=true;state.craneUnlocked=true;toast('Техника открыта')}else toast('Нужно 3500')};setInterval(()=>{try{localStorage.setItem('eliteroof_save_v2',JSON.stringify(state))}catch(e){}},2000);let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;ctx.clearRect(0,0,W,H);drawBackground();drawSiteProps();drawHouse();workers.forEach((w,i)=>drawWorker(w,i,dt));if(state.progress>.02&&Math.random()<dt*.8)emit(7.9,3,'rgba(205,185,145,.45)',1);updateParticles(dt);updateUI();requestAnimationFrame(frame)}function updateUI(){for(const id of['money','sand','brick','cement','wood'])document.getElementById(id).textContent=Math.floor(state[id]).toLocaleString('ru-RU');document.getElementById('workersCount').textContent=state.workers;document.getElementById('income').textContent='+'+state.income+'/с';const pct=Math.round(state.progress*100);document.getElementById('pct').textContent=pct+'%';document.getElementById('fill').style.width=pct+'%';document.getElementById('stage').textContent=stageName();document.getElementById('speed').textContent='СКОРОСТЬ ×'+state.speed;document.getElementById('capacity').textContent='ГРУЗ ×'+state.capacity;document.getElementById('truck').textContent=state.truckUnlocked?'ДОСТАВКА +5%':'ТЕХНИКА';document.getElementById('completed').textContent=state.completed;const m=state.progress<.28?'Подготовить основание':state.progress<.56?'Возвести коробку дома':state.progress<.81?'Собрать второй этаж и стропила':state.progress<.97?'Закрыть кровлю и фасад':'Завершить благоустройство';document.getElementById('missionText').textContent=m}requestAnimationFrame(frame)})();
