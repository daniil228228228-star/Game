<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0d151d"><title>EliteRoof Idle</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d151d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none}.glass{background:rgba(7,11,16,.86);border:1px solid rgba(255,255,255,.14);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.35);backdrop-filter:blur(12px)}.top{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:grid;grid-template-columns:auto 1fr;gap:8px}.brand{padding:10px 12px;font-weight:900}.brand b{color:#ffad17}.brand small{display:block;font-size:8px;letter-spacing:2px;color:#aeb8c2}.stats{padding:8px 10px;display:flex;justify-content:space-around;text-align:center}.stats strong{display:block;font-size:13px}.stats small{font-size:8px;color:#aeb8c2}.mission{position:absolute;left:8px;top:92px;width:210px;padding:11px 12px}.mission small{font-size:8px;color:#aeb8c2}.mission b{display:block;font-size:12px;color:#ffd127;margin:4px 0}.bar{height:8px;background:#27333d;border-radius:99px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#2dbd45,#b6e946)}.auditBtn{position:absolute;right:8px;top:92px;padding:10px 12px;border:0;color:#fff;font-weight:850;pointer-events:auto}.audit{position:absolute;right:8px;top:138px;width:230px;padding:12px;display:none}.audit.open{display:block}.audit h3{font-size:12px;margin:0 0 8px}.audit p{font-size:9px;line-height:1.4;margin:5px 0;color:#cbd4dd}.audit b{color:#ff8a76}.bottom{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:space-between;align-items:end}.joy{width:105px;height:105px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.2);position:relative;pointer-events:auto}.knob{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.9);position:absolute;left:30px;top:30px}.actions{display:grid;gap:8px;pointer-events:auto}.actions button{width:88px;height:42px;border-radius:13px;border:1px solid rgba(255,255,255,.15);background:rgba(8,13,18,.9);color:#fff;font-weight:850}.actions .run{height:84px;border-radius:50%;font-size:28px}.toast{position:absolute;left:50%;top:25%;transform:translateX(-50%);padding:9px 13px;border-radius:999px;background:rgba(0,0,0,.8);font-size:10px;opacity:0;transition:.2s}.toast.on{opacity:1}</style></head><body><canvas id="game"></canvas><div class="ui"><div class="top"><div class="glass brand">Elite<b>Roof</b><small>CONSTRUCTION</small></div><div class="glass stats"><div><strong id="money">12 450</strong><small>ДЕНЬГИ</small></div><div><strong id="brick">1 860</strong><small>КИРПИЧ</small></div><div><strong id="wood">1 540</strong><small>ДОСКИ</small></div></div></div><div class="glass mission"><small>ТЕКУЩАЯ ЦЕЛЬ</small><b id="stage">Фундамент</b><div class="bar"><i id="fill"></i></div><small id="pct">0%</small></div><button id="auditBtn" class="glass auditBtn">АУДИТ</button><div id="audit" class="glass audit"><h3>Визуальный агент</h3><p>Сильные стороны: композиция, понятный маршрут, зоны прокачки.</p><p><b>Косяки:</b> пока нет GLB-персонажа, PBR-текстур, настоящих теней и детальной техники.</p><p>Текущая визуальная оценка: 41/100.</p></div><div id="toast" class="toast"></div><div class="bottom"><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div class="actions"><button id="auto">АВТО: ВКЛ</button><button class="run">🏃</button></div></div></div><script>const c=document.getElementById('game'),x=c.getContext('2d');let W,H,D=window.devicePixelRatio||1;function resize(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}resize();addEventListener('resize',resize);const s={money:12450,brick:1860,wood:1540,progress:0,speed:1,cargo:1,income:1,auto:true,t:0,dir:1,px:W*.47,py:H*.68};try{Object.assign(s,JSON.parse(localStorage.getItem('er_safe')||'{}'))}catch(e){}function iso(X,Y,Z=0){return{x:W*.5+(X-Y)*32,y:H*.42+(X+Y)*17-Z*25}}function poly(p,fill,stroke){x.beginPath();x.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)x.lineTo(p[i].x,p[i].y);x.closePath();x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.stroke()}}function box(X,Y,Z,w,d,h,col){const a=iso(X,Y,Z),b=iso(X+w,Y,Z),cc=iso(X+w,Y+d,Z),dd=iso(X,Y+d,Z),a2=iso(X,Y,Z+h),b2=iso(X+w,Y,Z+h),c2=iso(X+w,Y+d,Z+h),d2=iso(X,Y+d,Z+h);poly([a,b,b2,a2],shade(col,-25));poly([b,cc,c2,b2],shade(col,-45));poly([a2,b2,c2,d2],col,'rgba(0,0,0,.2)')}function shade(hex,n){let v=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(v>>16)+n)),g=Math.max(0,Math.min(255,((v>>8)&255)+n)),b=Math.max(0,Math.min(255,(v&255)+n));return`rgb(${r},${g},${b})`}function circle(X,Y,r,col,label,cost){const p=iso(X,Y,0);x.save();x.shadowBlur=20;x.shadowColor=col;x.strokeStyle=col;x.lineWidth=4;x.beginPath();x.ellipse(p.x,p.y,r,r*.48,0,0,Math.PI*2);x.stroke();x.shadowBlur=0;x.fillStyle='rgba(0,0,0,.6)';x.fillRect(p.x-55,p.y-45,110,38);x.textAlign='center';x.fillStyle='#fff';x.font='700 12px system-ui';x.fillText(label,p.x,p.y-29);x.fillStyle='#baf075';x.font='700 11px system-ui';x.fillText(cost+' ₽',p.x,p.y-14);x.restore();return p}function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8bc2de');g.addColorStop(.48,'#b8d3dc');g.addColorStop(.49,'#5b7845');g.addColorStop(1,'#3b4f35');x.fillStyle=g;x.fillRect(0,0,W,H);poly([iso(-12,-10),iso(12,-10),iso(12,10),iso(-12,10)],'#8a6040');for(let i=-12;i<12;i+=2)box(i,9,0,1.7,.35,.12,'#343b40');box(-9,-5,0,4,3,2.7,'#274d40');for(let p=0;p<4;p++){let X=-8+(p%2)*2.4,Y=-1+Math.floor(p/2)*2.2;box(X,Y,0,1.7,1.2,.18,'#8b5b31');for(let i=0;i<18;i++)box(X+.15+(i%6)*.23,Y+.38,0.18+Math.floor(i/6)*.22,.2,.36,.18,p===0?'#a54b2c':p===1?'#d0ccc2':p===2?'#8e6238':'#2c4655')}box(1,-3,-.25,7,5,.45,'#66604f');let pr=s.progress;for(let X=1;X<8;X+=.85){if(pr>.05)box(X,-3,.2,.72,.36,.45,'#aaaead');if(pr>.05)box(X,1.65,.2,.72,.36,.45,'#aaaead')}for(let Y=-2.5;Y<1.5;Y+=.85){if(pr>.05)box(1,Y,.2,.36,.72,.45,'#aaaead');if(pr>.05)box(7.62,Y,.2,.36,.72,.45,'#aaaead')}if(pr>.14)box(1.2,-2.8,.68,6.2,4.2,.3,'#a9acab');let rows=Math.floor(Math.max(0,pr-.23)/.03);for(let r=0;r<Math.min(rows,7);r++)for(let X=1.2;X<7.4;X+=.72){box(X,-2.65,1+r*.34,.62,.32,.3,r%2?'#b85c35':'#a84b2c');box(X,1.5,1+r*.34,.62,.32,.3,r%2?'#b85c35':'#a84b2c')}if(pr>.44)box(1.2,-2.8,3.5,6.2,4.2,.28,'#aaaead');if(pr>.52){let rr=Math.floor((pr-.52)/.03);for(let r=0;r<Math.min(rr,6);r++)for(let X=1.2;X<7.4;X+=.72)box(X,-2.65,3.8+r*.34,.62,.32,.3,'#bd6037')}box(9,-1,0,3.8,1.7,.55,'#222a2f');box(8.2,-1,0.55,1.3,1.6,1.5,'#e58d12');box(10.2,-1,0.55,1.9,1.6,1.2,'#d7d2c8');for(let q of[[8.6,-.2],[10.8,-.2],[8.6,-1.7],[10.8,-1.7]]){let p=iso(q[0],q[1],.3);x.fillStyle='#15191d';x.beginPath();x.arc(p.x,p.y,13,0,7);x.fill()}const pads=[circle(-7,5,34,'#66ff6e','СКЛАД',3200),circle(-3,5,34,'#39bfff','СКОРОСТЬ',3400),circle(1,5,34,'#ffd12f','ДОХОД',4800),circle(5,5,34,'#ff8c24','ДОСТАВКА',1500)];let from=iso(-8,1,0),to=iso(.2,-1.2,0);if(s.auto){s.t+=.0032*s.speed*s.dir;if(s.t>=1){s.t=1;s.dir=-1;s.progress=Math.min(1,s.progress+.0045*s.cargo);s.money+=5*s.cargo*s.income}if(s.t<=0){s.t=0;s.dir=1}s.px=from.x+(to.x-from.x)*s.t;s.py=from.y+(to.y-from.y)*s.t}x.save();x.translate(s.px,s.py);x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.ellipse(0,18,18,7,0,0,7);x.fill();x.fillStyle='#161b20';x.fillRect(-8,-4,7,24);x.fillRect(2,-4,7,24);x.fillStyle='#f0eee8';x.fillRect(-13,-35,26,31);x.fillStyle='#d3a078';x.beginPath();x.arc(0,-44,9,0,7);x.fill();if(s.dir>0){x.fillStyle='#a94c2d';x.fillRect(-13,-28,26,17)}x.restore();document.getElementById('money').textContent=Math.floor(s.money).toLocaleString('ru');document.getElementById('brick').textContent=s.brick;document.getElementById('wood').textContent=s.wood;let pc=Math.round(s.progress*100);document.getElementById('pct').textContent=pc+'%';document.getElementById('fill').style.width=pc+'%';let st='Расчистка';if(pr>.05)st='Фундамент';if(pr>.14)st='Плита';if(pr>.23)st='Стены 1 этажа';if(pr>.44)st='Перекрытие';if(pr>.52)st='Стены 2 этажа';if(pr>.69)st='Стропила';if(pr>.81)st='Кровля';document.getElementById('stage').textContent=st;requestAnimationFrame(draw)}requestAnimationFrame(draw);setInterval(()=>localStorage.setItem('er_safe',JSON.stringify(s)),2000);document.getElementById('auto').onclick=()=>{s.auto=!s.auto;document.getElementById('auto').textContent='АВТО: '+(s.auto?'ВКЛ':'ВЫКЛ')};document.getElementById('auditBtn').onclick=()=>document.getElementById('audit').classList.toggle('open');const joy=document.getElementById('joy'),knob=document.getElementById('knob');let active=false;function mv(e){if(!active||s.auto)return;let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=31,l=Math.hypot(dx,dy)||1,k=Math.min(1,m/l);knob.style.transform=`translate(${dx*k}px,${dy*k}px)`;s.px+=dx/l*2.4;s.py+=dy/l*2.4}joy.onpointerdown=e=>{active=true;joy.setPointerCapture(e.pointerId);mv(e)};joy.onpointermove=mv;joy.onpointerup=()=>{active=false;knob.style.transform=''};</script></body></html>
