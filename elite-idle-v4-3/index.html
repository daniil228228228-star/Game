<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#87b8d0">
  <title>EliteRoof Idle V4.3</title>
  <link rel="stylesheet" href="../elite-idle-v4-2/style.css?v=431">
  <style>
    #engineStatus{position:fixed;left:50%;top:58%;transform:translateX(-50%);z-index:40;max-width:86vw;padding:10px 14px;border-radius:14px;background:rgba(7,11,16,.86);font:700 12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#dce8ef;text-align:center}
  </style>
</head>
<body>
  <div id="loading">Запуск локального 3D-движка…</div>
  <div id="engineStatus">Движок загружается прямо из твоего GitHub</div>
  <div id="error"></div>
  <canvas id="game"></canvas>
  <div class="ui">
    <header class="top">
      <div class="brand">Elite<span>Roof</span><small>CONSTRUCTION</small></div>
      <div class="stats"><div><b id="money">12 450</b><small>ДЕНЬГИ</small></div><div><b id="progress">0%</b><small>ПРОГРЕСС</small></div></div>
    </header>
    <section class="mission"><small>ТЕКУЩАЯ ЦЕЛЬ</small><b id="stage">Расчистка</b><div class="bar"><i id="fill"></i></div></section>
    <button id="quality" class="quality">КАЧЕСТВО: АВТО</button>
    <div class="bottom"><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div class="buttons"><button id="auto">АВТО: ВКЛ</button><button id="run" class="run">🏃</button></div></div>
  </div>
  <script>
    window.__engineFailed=false;
    function engineFail(message){
      window.__engineFailed=true;
      var l=document.getElementById('loading');
      var s=document.getElementById('engineStatus');
      if(l)l.style.display='none';
      if(s){s.textContent=message||'Локальный движок не загрузился. Обнови страницу.';s.style.color='#ffd36a';}
    }
    setTimeout(function(){if(!window.THREE)engineFail('Локальный движок не загрузился. Обнови страницу в Safari.');},7000);
  </script>
  <script src="./vendor/three.min.js?v=1281" onerror="engineFail('Файл Three.js не найден в GitHub Pages.')"></script>
  <script>
    if(window.THREE){
      // Three.js r128 не содержит CapsuleGeometry. Делаем совместимый корпус персонажа.
      if(!THREE.CapsuleGeometry){
        THREE.CapsuleGeometry=function(radius,length,capSegments,radialSegments){
          return new THREE.CylinderGeometry(radius,radius,length+radius*2,radialSegments||12,1,false);
        };
      }
      var statusNode=document.getElementById('engineStatus');
      if(statusNode)statusNode.textContent='Движок загружен. Запускаю сцену…';
    }
  </script>
  <script src="../elite-idle-v4-2/app.js?v=431"></script>
  <script>
    setTimeout(function(){
      var s=document.getElementById('engineStatus');
      var e=document.getElementById('error');
      if(s&&window.THREE&&(!e||getComputedStyle(e).display==='none'))s.remove();
    },1600);
  </script>
</body>
</html>
